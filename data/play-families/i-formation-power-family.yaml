family_id: i-formation-power-family
name: "I-Formation Power Family"
description: |
  A disguise family anchored by Power-O. Every member shows the defense the
  identical pre-snap look and the identical first ~1.5 seconds — Z motion, QB
  reverse-out, HB off-tackle track, FB lead through the hole, LG pull, OL
  down-block show. Only after the mesh do they diverge: Power-O hands off,
  Power Pass settles and throws from the pocket, Power Boot keeps it and boots
  backside. The defense cannot distinguish them until it is too late to react.

formation_id: i-formation
philosophy: power-run
philosophy_ref: power-run

base_play_id: i-formation-power-o
companion_play_ids:
  - i-formation-power-pass
  - i-formation-power-boot
  - i-formation-power-counter
  - i-formation-power-screen

disguise_score: 0.9

defensive_coverage_matrix:
