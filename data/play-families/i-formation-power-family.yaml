source_notes:
  - "Disguise family curated for the HS base playbook. The two companion plays (power-pass, power-boot) were authored specifically as disguise twins of i-formation-power-o — their QB/HB/FB/LG initial path waypoints are identical to the base play through the mesh."
  - "disguise_score 0.9 reflects identical pre-snap motion + identical initial action; the < 1.0 accounts for receiver releases (route vs stalk-block) differing slightly earlier than the backfield action."
