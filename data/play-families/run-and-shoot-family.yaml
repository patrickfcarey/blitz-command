family_id: run-and-shoot-family
name: "Run-and-Shoot Family"
description: |
  A disguise family anchored by the Switch concept. Every member shows the
  defense the identical pre-snap picture and the identical first ~1.5 seconds
  — the same SLOT-R short-across motion and the same QB drop (first two
  waypoints byte-identical across all five plays). Only after the drop do they
  fork: Switch and Go take vertical shots, Choice options off coverage
  underneath, the HB Screen punishes the teed-up rush, and the HB Draw hits
  the emptied box. True to the run-and-shoot — motion every snap, receivers
  read coverage live — the defense cannot tell run from pass, vertical from
  underneath, until it is too late.

formation_id: double-slot
philosophy: spread-pass
philosophy_ref: run-and-shoot

base_play_id: run-and-shoot-switch
companion_play_ids:
  - run-and-shoot-choice
  - run-and-shoot-go
  - run-and-shoot-screen
  - run-and-shoot-draw

disguise_score: 0.9

defensive_coverage_matrix:
