source_notes:
  - "Disguise family curated 2026-05-15 around the run-and-shoot's signature concepts (Switch, Choice, Go/seam-read) plus its two constraints (HB Screen, HB Draw). All five plays were authored or updated to share an identical SLOT-R short-across motion and an identical QB drop — the first two QB path waypoints ([0,0],[0,-2]) are byte-identical across every member."
  - "disguise_score 0.9 reflects the identical pre-snap motion and identical QB drop start; the < 1.0 accounts for the receivers' route stems diverging slightly earlier than the QB action (and the screen/draw mesh resolving the run-pass picture by ~1.5 seconds)."
  - "Concept sourcing: switch, four-verticals concepts in data/concepts/pass-concepts/; draw, screen as canonical run-and-shoot run concepts in data/concepts/philosophies/run-and-shoot.yaml. Routes referenced from data/routes/ (switch-go, switch-out-go, choice, choice-seam, seam, go, slant, hitch, flat)."
