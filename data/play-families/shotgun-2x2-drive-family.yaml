family_id: shotgun-2x2-drive-family
name: "Shotgun 2x2 West Coast Drive Family"
description: |
  A disguise family anchored by the West Coast Drive concept — a shallow
  crossing route run underneath a deep dig for a hi-lo read, a Bill Walsh
  staple. Every member shows the defense the identical pre-snap look (no
  motion, the same 2x2 alignment) and the identical first ~1.5 seconds — the
  QB's three-step rhythm drop and the TE's shallow-cross release are shared
  across all five plays. Only after the crosser clears do they diverge: the
  base reads the dig over the drag, the play-action holds the linebackers off
  a run fake first, the hi-lo variant attacks the corner-over-flat level, the
  screen slips the TE behind the LOS, and the shot turns the crosser into a
  clear-out for a deep post. The defense cannot distinguish them until it is
  too late to react.

