source_notes:
  - "Disguise family curated for the HS West Coast passing game. The four companion plays (drive-pa, drive-hilo, drive-screen, drive-shot) were authored specifically as disguise twins of shotgun-2x2-drive — all five carry an identical empty motions block, the QB's first two drop waypoints are byte-identical ([[0, 0], [0, -1]]), and the TE's shallow-cross drag release is shared across the family."
  - "disguise_score 0.9 reflects the identical empty pre-snap motion and identical initial QB drop and TE release; the < 1.0 accounts for the outside receivers' releases (clear-out vertical vs intermediate breaking route) differing slightly earlier than the backfield and crosser action."
  - "Web validated 2026-05-15 — the Drive concept (shallow cross under a dig, hi-lo read) is a documented Bill Walsh West Coast staple; see Throw Deep Publishing 'Drive Concept' and Wikipedia 'West Coast offense'."
