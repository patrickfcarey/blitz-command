family_id: goal-line-power-family
name: "Goal Line Power Family"
description: |
  A disguise family anchored by Goal Line Power. Every member shows the
  defense the identical pre-snap look and the identical first ~1.5 seconds
  — no motion, QB reverse-out, HB off-tackle track, FB lead through the
  hole, LG pull, playside OL down-block / TE-R kickout. Only after the mesh
  do they diverge: Goal Line Power hands off, Goal Line Power Pass settles
  and throws the TE corner from the pocket, Goal Line Power Keeper pulls
  the ball and boots the backside edge. From a jumbo look where the defense
  expects run 90%+ of the time, the deception is brutal.

