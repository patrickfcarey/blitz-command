source_notes:
  - "Disguise family curated for the HS base playbook. The two companion plays (power-pass, power-keeper) were authored specifically as disguise twins of goal-line-power — their QB/HB/FB initial path waypoints (first two entries) and empty motions block are byte-identical to the base play through the mesh."
  - "disguise_score 0.92 reflects an identical empty-motion pre-snap look from a jumbo formation plus identical initial backfield action; the < 1.0 accounts for the keeper's TE-L block changing from down-block to kickout and the pass twin's receiver releases diverging slightly earlier than the backfield action."
