family_id: i-formation-counter-family
name: "I-Formation Counter Family"
description: |
  A disguise family anchored by Counter Trey. Every member shows the
  defense the identical pre-snap look and the identical first ~1.5
  seconds — no motion, QB reverse-out, HB counter step away from the
  playside, FB lead through the hole, LG and LT pulls, OL down-block
  show. Only after the mesh do they diverge: Counter Trey hands off,
  Counter Pass settles and throws from the pocket, Counter Boot keeps it
  and boots backside, Counter Screen slips the HB back for a throwback
  screen. The defense cannot distinguish them until it is too late to
  react.

formation_id: i-formation
philosophy: power-run
