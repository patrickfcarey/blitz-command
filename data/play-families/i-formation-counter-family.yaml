source_notes:
  - "Disguise family curated for the HS base playbook. The three companion plays (counter-pass, counter-boot, counter-screen) were authored specifically as disguise twins of i-formation-counter-trey — their QB, HB, and FB initial path waypoints are identical to the base play through the first two waypoints, and all four members carry the same empty motions block."
  - "disguise_score 0.9 reflects identical (empty) pre-snap motion plus identical initial QB/HB/FB action through the mesh; the < 1.0 accounts for receiver releases (route vs stalk-block) and the pulling-linemen peel-back diverging slightly earlier than the backfield action."
