family_id: i-formation-toss-family
name: "I-Formation Toss Family"
description: |
  A disguise family anchored by Lead Toss. Every member shows the defense
  the identical pre-snap look and the identical first ~1.5 seconds — no
  motion, QB reverse-out, HB perimeter track off the pitch, FB lead to the
  corner, RG pull, OL run-block show. Only after the pitch fake do they
  diverge: Lead Toss pitches it and runs the perimeter, Toss Pass settles
  and throws from the pocket, Toss Boot keeps it and boots backside away
  from the toss flow. The defense cannot distinguish them until it is too
  late to react.

formation_id: i-formation
philosophy: power-run
philosophy_ref: power-run

base_play_id: i-formation-lead-toss
companion_play_ids:
