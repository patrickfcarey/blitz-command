source_notes:
  - "Disguise family curated for the HS base playbook. The two companion plays (toss-pass, toss-boot) were authored specifically as disguise twins of i-formation-lead-toss — their QB/HB/FB initial path waypoints (first two entries) and empty motions block are byte-identical to the base play through the pitch fake."
  - "disguise_score 0.9 reflects an identical empty-motion pre-snap look plus identical initial backfield action; the < 1.0 accounts for receiver releases (route vs stalk/crack-block) diverging slightly earlier than the backfield action."
