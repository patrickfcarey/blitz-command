family_id: shotgun-2x2-quick-game-family
name: "Shotgun 2x2 Quick-Game Family"
description: |
  A disguise family anchored by Stick whose deception lives in the receiver
  releases. Every member shows the defense the identical pre-snap look, the
  identical 3-step QB drop, and the identical early receiver releases — the
  WRs take the same first ~3 steps off the line. Only then do the routes
  branch into different concepts: Stick runs the mirrored option routes,
  Quick Snag breaks into the snag triangle, Quick Zebra pivots the fake-drag
  back underneath, and the West Coast trio attacks every level of the quick
  game — Slant-Flat hi-los the flat defender, Quick Hitch settles hitches
  with a seam answer, Quick Out snaps speed-outs behind vertical clear-outs.
  The defense reads the same quick-game picture on all members until the
  routes diverge.

