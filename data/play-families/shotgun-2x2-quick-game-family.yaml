source_notes:
  - "Disguise family curated for the HS base playbook. The companion plays (quick-snag, quick-zebra) were authored specifically as disguise twins of shotgun-2x2-stick — the QB's 3-step drop first two waypoints are identical to the base play, all members carry the same empty motions block, and every receiver's early release waypoints match the base play before the routes branch into their respective concepts."
  - "Extended 2026-05-15 with three West Coast quick-game companions (slant-flat, quick-hitch, quick-out) — Bill Walsh bread-and-butter slants / hitches / outs off the 3-step drop. Each was authored as a disguise twin of shotgun-2x2-stick: byte-identical QB drop first two waypoints, the same empty motions block, and early receiver release waypoints matching the base play's vertical stems before the routes branch. One inherent exception: the SLOT-W flat in slant-flat releases outside immediately, as a flat route cannot match a vertical stem."
  - "disguise_score 0.85 reflects identical (empty) pre-snap motion, identical QB drop, and matched early receiver releases; the < 0.9 accounts for this family's disguise living in the route releases (which branch after ~3 steps) rather than in a backfield run fake that holds for the full ~1.5 seconds, and for the one flat route that releases outside immediately."
