family_id: singleback-trio-zone-family
name: "Singleback Trio Zone Family"
description: |
  A disguise family anchored by Inside Zone from the 11-personnel singleback
  trio set. Every member shows the defense the identical pre-snap look and the
  identical first ~1.5 seconds — no motion, QB reverse-pivot, HB bang track,
  OL zone-step show. Only after the mesh do they diverge: Inside Zone hands
  off, Zone Pass settles and throws from the pocket, Zone Boot keeps it and
  boots backside. The defense cannot distinguish them until it is too late to
  react.

formation_id: singleback-trio
philosophy: zone-run
