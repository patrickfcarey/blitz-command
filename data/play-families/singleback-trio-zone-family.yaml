source_notes:
  - "Disguise family curated for the HS base playbook. The two companion plays (zone-pass, zone-boot) were authored specifically as disguise twins of singleback-trio-inside-zone — their QB and HB initial path waypoints are identical to the base play through the mesh, and all three carry the same empty motions block."
  - "disguise_score 0.9 reflects identical (absent) pre-snap motion + identical initial backfield action; the < 1.0 accounts for receiver releases (route vs stalk-block) differing slightly earlier than the backfield action."
