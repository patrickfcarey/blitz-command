family_id: shotgun-2x2-jet-family
name: "Shotgun 2x2 Jet Family"
description: |
  A disguise family anchored by Jet Sweep. Every member runs the identical
  jet motion — SLOT-W flying full-speed across the formation with the ball
  snapped on the move — and the QB rides the identical jet mesh for the
  first ~1.5 seconds. Only after that do they diverge: Jet Sweep hands it
  to the flying receiver, Jet Counter pulls it and counters backside, Jet
  Pop Pass throws the TE seam behind the run-flow linebackers, Jet Boot
  keeps it and boots away from the jet flow. The defense cannot distinguish
  them until it is too late to react.

