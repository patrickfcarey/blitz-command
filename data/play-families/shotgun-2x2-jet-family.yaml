source_notes:
  - "Disguise family curated for the HS base playbook. The three companion plays (jet-counter, jet-pop-pass, jet-boot) were authored specifically as disguise twins of shotgun-2x2-jet-sweep — every member carries the byte-identical mandatory jet motion block (SLOT-W, jet, end_position x:6.0 y:-2.0, snap_on_motion true), and the QB's first two path waypoints mirror the Jet Sweep handoff mesh."
  - "disguise_score 0.92 reflects the identical mandatory jet motion plus identical initial QB jet-mesh action; the < 1.0 accounts for receiver releases (route vs stalk-block) diverging slightly earlier than the backfield action."
