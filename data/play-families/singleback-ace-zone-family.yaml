family_id: singleback-ace-zone-family
name: "Singleback Ace Zone Family"
description: |
  A disguise family anchored by Inside Zone from the 12-personnel symmetric
  singleback. Every member shows the defense the identical pre-snap look and
  the identical first ~1.5 seconds — no motion, QB reverse-pivot, HB bang
  track, OL zone-step show. Only after the mesh do they diverge: Inside Zone
  hands off, Zone Pass settles and throws from the pocket, Zone Boot keeps it
  and boots backside. The defense cannot distinguish them until it is too late
  to react.

formation_id: singleback-ace
philosophy: zone-run
