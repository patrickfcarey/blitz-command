family_id: shotgun-2x2-qb-power-family
name: "Shotgun 2x2 QB-Power Family"
description: |
  A disguise family anchored by QB Power. Every member shows the defense
  the identical pre-snap look and the identical first ~1.5 seconds — no
  motion, QB attacking the off-tackle hole, HB lead-sweep track, LG pull,
  OL down-block show. Only after that do they diverge: QB Power runs it,
  QB Power Pass pulls up and throws the TE drag from the pocket, QB Power
  Keep-Throw reads the conflict defender to keep or throw the slant, QB
  Power Counter plants and counters backside behind a pulling RG, QB Power
  Screen slips the HB back for a throwback screen. The defense cannot
  distinguish them until it is too late to react.

formation_id: shotgun-2x2
