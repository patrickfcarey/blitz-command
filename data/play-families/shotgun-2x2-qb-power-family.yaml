source_notes:
  - "Disguise family curated for the HS base playbook. The two companion plays (qb-power-pass, qb-power-keep-throw) were authored specifically as disguise twins of shotgun-2x2-qb-power — their QB and HB initial path waypoints are identical to the base play through the first two waypoints, and all three carry the same empty motions block."
  - "Extended with two further disguise twins (qb-power-counter, qb-power-screen) — both carry the same empty motions block and QB/HB first-two-waypoint paths identical to shotgun-2x2-qb-power. qb-power-counter shows the strong-side QB-Power track then counters backside; qb-power-screen shows the QB-Power track then throws an HB throwback screen."
  - "disguise_score 0.9 reflects identical (empty) pre-snap motion plus identical initial QB/HB action; the < 1.0 accounts for receiver releases (route vs stalk-block) diverging slightly earlier than the backfield action."
