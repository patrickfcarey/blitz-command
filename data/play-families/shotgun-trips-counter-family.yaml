family_id: shotgun-trips-counter-family
name: "Shotgun Trips Counter Family"
description: |
  A disguise family anchored by Counter Read. Every member shows the
  defense the identical pre-snap look and the identical first ~1.5
  seconds — no motion, QB counter step, HB outside-zone sweep track, LT
  and LG pulls, OL down-block show. Only after that do they diverge:
  Counter Read keeps or gives, Counter Pass drifts away and throws the
  WR3 corner, Counter Screen slips the HB back for a throwback screen,
  Counter Boot keeps it and boots backside off the run fake, Counter Keep
  is a designed QB keep with the playside EDGE blocked. The defense cannot
  distinguish them until it is too late to react.

