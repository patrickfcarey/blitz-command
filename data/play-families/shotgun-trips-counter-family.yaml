source_notes:
  - "Disguise family curated for the HS base playbook. The two companion plays (counter-pass, counter-screen) were authored specifically as disguise twins of shotgun-trips-right-counter-read — their QB and HB initial path waypoints are identical to the base play through the first two waypoints, and all three carry the same empty motions block."
  - "Extended with two further disguise twins (counter-boot, counter-keep) — both carry the same empty motions block and QB/HB first-two-waypoint paths identical to shotgun-trips-right-counter-read. counter-boot shows the counter run fake then boots backside; counter-keep is a designed QB keep that blocks the playside EDGE instead of reading it (the answer to a scrape-exchange). The series is complete: run option (counter-read), designed run (counter-keep), play-action pocket throw (counter-pass), bootleg (counter-boot), and screen (counter-screen)."
  - "disguise_score 0.9 reflects identical (empty) pre-snap motion plus identical initial QB/HB action; the < 1.0 accounts for receiver releases (route vs stalk-block) and the pulling-lineman peel-back diverging slightly earlier than the backfield action."
