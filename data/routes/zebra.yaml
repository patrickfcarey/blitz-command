description: |
  A fake-drag. The receiver releases as if running an out — three hard steps
  to the outside — then pivots sharply back inside and crosses underneath like
  a standard drag. The outside fake influences the covering defender to widen
  or trigger; the receiver works back in behind him for an easy underneath
  completion. A disguise wrinkle, droppable in anywhere a drag is the primary.
