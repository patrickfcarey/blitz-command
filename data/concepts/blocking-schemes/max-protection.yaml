scheme_id: max-protection
name: Max Protection (7-Man)
category: pass-protection
description: |
  7-man protection: all 5 OL, TE, and RB stay in to block. Zero checkdowns.
  Used on obvious passing situations (deep shots, two-minute drill) where the
  QB needs maximum time and accepts the sacrifice of receiving options. Forces
  very tight route trees.
assignments_by_position:
  LT: "Block the LDE / EMOL. Set vertical, mirror."
  LG: "Block the 1-tech DT. Punch and anchor."
  C: "Block the NT. Shade to the pressure side."
  RG: "Block the 3-tech DT. Punch and anchor."
  RT: "Block the RDE / EMOL. Set vertical."
  HB: "Stay in to block. Read and react — pick up the most dangerous unblocked rusher post-snap."
  TE: "Stay in to block the edge or secondary defender. No route."
pairs_with:
  - deep-routes
  - go-route
  - post
defeats:
  - "4-man, 5-man, even 6-man pass rushes"
vulnerable_to:
  - "defensive scheming (all 11 D-linemen rush, QB has no time)"
  - "elite pass rushers who win 1-on-1"
tags:
  - pass-protection
  - max
  - max-protection
  - 7-man
  - deep-shot
  - two-minute
  - college
  - nfl
verification_status: unverified
source_notes:
  - "Web validated 2026-04-30 — Throw Deep Publishing 'Max Protection' (https://throwdeeppublishing.com/blogs/football-glossary/): confirmed 7-man (OL + TE + RB) structure used on deep shots."
  - "Web validated 2026-04-30 — X&O Labs 'Protection Concepts' (https://www.xandolabs.com/): max protection defined as all available bodies in pass pro, no checkdowns."
