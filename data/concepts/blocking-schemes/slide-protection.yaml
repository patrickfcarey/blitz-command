scheme_id: slide-protection
name: Slide Protection
category: pass-protection
description: |
  All 5 OL slide one direction (left or right) in coordinated fashion. The RB
  picks up the backside C-gap defender who is left unaccounted for by the
  slide. Used to combat heavy pressure on one side or protect a QB's blind
  spot. Common in the NFL.
assignments_by_position:
  LT: "Slide left — block whatever shows in the leftmost gap."
  LG: "Slide left — block 5-tech if present, otherwise climb to LB."
  C: "Slide left — block weakside 1-tech / 0-tech."
  RG: "Slide left — block playside NT now in his right gap."
  RT: "Slide left — block playside 3-tech."
  HB: "REQUIRED: scan the backside C-gap. Pick up the most dangerous unblocked rusher."
  TE: "Optional: chip-and-release on EDGE if in pass-pro."
pairs_with:
  - bootleg-strong
  - flood-strong
  - mesh
defeats:
  - "predictable one-sided blitzes"
  - "unbalanced pass-rush fronts"
vulnerable_to:
  - "twist stunt that overloads the slide direction"
  - "double-A-gap blitz on the opposite side"
  - "delayed LB blitz from the unslid side"
tags:
  - pass-protection
  - slide
  - any-level
  - high-school
  - college
  - nfl
verification_status: unverified
source_notes:
  - "Web validated 2026-04-30 — Throw Deep Publishing 'Pass Protection — Slide Schemes' (https://throwdeeppublishing.com/blogs/football-glossary/): confirmed 5-OL slide structure with RB picking up backside edge."
  - "Web validated 2026-04-30 — X&O Labs 'Slide Protection Variations' (https://www.xandolabs.com/): confirmed full slide is 5-man, leaves backside C-gap to RB."
