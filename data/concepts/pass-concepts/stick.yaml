concept_id: stick
name: Stick
category: option-route
description: |
  Three receivers running option routes at different levels: inside slant, dig/stick
  route (intermediate), and a deep route. QB reads down the levels. High variance routing
  based on coverage. Used heavily in Air Raid. Creates flexibility vs all coverage types.
progression:
  - primary: inside slant (quick decision)
    secondary: dig/stick (intermediate choice)
  - tertiary: deep route
best_vs_coverage:
  - man
  - zone
  - "both (flexible)"
attacks:
  - "Option routing vs any coverage"
  - "Creates natural throwing lanes"
pairs_with:
