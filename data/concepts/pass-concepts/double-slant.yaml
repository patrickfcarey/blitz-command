concept_id: double-slant
name: Double Slant
category: interior-read
description: |
  Two receivers running slant routes at interior (creating natural spacing). QB reads
  one slant vs the other based on coverage. Quick interior passing concept. Strong vs
  man coverage (natural separation). Used as constraint and in quick-passing game.
progression:
  - primary: first slant
    secondary: second slant
