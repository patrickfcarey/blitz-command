concept_id: flood
name: Flood
category: horizontal-stretch
depth: medium
description: |
  Three receivers attacking the same side/area horizontally at different depths (deep,
  intermediate, flat). Forces cornerback and safety to spread. QB reads from deep to
  flat. Naturally attacks zone coverage by flooding a zone with multiple targets.
progression:
  - primary: deep route (vertical stretch)
    secondary: intermediate (intermediate depth)
  - tertiary: flat (hot read)
best_vs_coverage:
  - cover-3
  - cover-2
  - zone-corner-coverage
attacks:
  - "Floods zone areas with 3 targets"
  - "Creates YAC opportunities on flat"
pairs_with:
  - smash
  - four-verticals
  - west-coast
tags:
  - pass-concept
  - flood
  - horizontal-stretch
  - zone-beater
  - any-level
  - college
  - nfl
verification_status: unverified
