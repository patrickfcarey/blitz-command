concept_id: post-corner
name: Post-Corner (Coryell Deep)
category: deep-route
description: |
  Receiver runs a post route initially, then cuts to the corner. Creates confusion
  vs defender. Strong vertical concept attacking safeties. Originated in Coryell system.
  High-skill throw requiring QB to anticipate and deliver accurately. Works vs cover-2
  when safeties are split.
progression:
  - primary: post-corner route
best_vs_coverage:
  - cover-2 (split safeties)
  - aggressive-corner
attacks:
  - "Post move fakes safety rotation"
  - "Corner breaks away from coverage"
pairs_with:
  - coryell
  - deep-shot
tags:
