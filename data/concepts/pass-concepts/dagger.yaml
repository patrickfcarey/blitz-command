concept_id: dagger
name: Dagger
category: vertical-read
description: |
  Deep cornerback route (attacking corner of endzone) with underneath receiver providing
  safety valve. Attacks safeties deep; underneath receiver provides outlet vs aggressive
  coverage. Vertical concept with layered protection. Used for deep shots in red zone
  or aggressive situations.
