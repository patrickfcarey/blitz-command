philosophy_id: big-12-spread
name: Big 12 Spread (Modern College Spread)
description: |
  Modern spread offense emphasizing 4-5 WRs, high-tempo play-calling, and pass-heavy
  attack. Developed in Big 12 conference (Oklahoma, Texas, Kansas State). Heavy use
  of motion, misdirection, and QB-read decisions. Balances run and pass but leans
  pass. Influenced by Air Raid but with more balanced approach.
era: "2000s–present"
originators:
  - "Bob Stoops (Oklahoma, 2000–2016)"
  - "Mack Brown (Texas, 1998–2013)"
  - "Bill Snyder (Kansas State, 1995–2005)"
notable_practitioners:
  - "Lincoln Riley (Oklahoma, now USC)"
  - "Tom Herman"
  - "Chris Petersen"
