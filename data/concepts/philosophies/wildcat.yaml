philosophy_id: wildcat
name: Wildcat (Gadget/Gimmick Offense)
description: |
  Unconventional offensive set where a non-QB takes the snap directly (typically an
  elite RB or WR). Used to bypass weak QB play or create confusion. Originally popularized
  by Miami Dolphins (Ricky Williams era). Can be run-heavy or pass-heavy depending on
  personnel. Effective as a change-of-pace or situational attack. Limited long-term
  viability due to defensive adaptation.
era: "2008–present"
originators:
  - "Miami Dolphins (Wildcat with Ricky Williams, 2008–2009)"
  - "Bill Parcells / David Lee"
notable_practitioners:
