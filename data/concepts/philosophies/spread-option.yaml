philosophy_id: spread-option
name: Spread Option
description: |
  Spread the field with 4-5 WRs to create space and open run lanes for the QB
  and RB. QB option reads to keep or pitch. Emphasizes speed, space, and OL
  ability to pull and lead on the perimeter. Developed by Rich Rodriguez at
  West Virginia and popularized by Gus Malzahn at Auburn. Combines spread
  spacing with triple-option mechanics.
era: "2000s–present"
