philosophy_id: flexbone
name: Flexbone (Veer-Wishbone Triple Option)
description: |
  Modern triple-option system using Flexbone formation (FB offset behind QB, two HBs
  in I-Form). Veer-option reads at the EDGE defender. More adaptable than pure Wishbone.
  Used at service academies (Army, Navy) and a few college programs. Emphasizes option
  flow, deceptive footwork, and pitch-man execution. Punishes aggressive edge defense.
era: "1960s–present (peak 1980s-1990s; resurgence 2000s)"
originators:
  - "Wishbone: Darrell Royal (University of Texas, 1968)"
  - "Flexbone: Army/Navy coaches (1990s evolution)"
notable_practitioners:
  - "Jeff Monken (Army)"
  - "Ken Niumatalolo (Navy)"
  - "Craig Coan (Army assistant coaches)"
