philosophy_id: erhardt-perkins
name: Erhardt-Perkins
description: |
  Concept-based pass game where the same play has multiple names depending on
  formation. Developed by Erhardt and Perkins at Patriots in 1970s; perfected
  by Bill Belichick. Emphasizes QB flexibility, universal concepts across
  formations, and adaptability to talent. Core to Patriots dynasty.
