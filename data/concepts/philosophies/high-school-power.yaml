philosophy_id: high-school-power
name: High School Power (Classic HS)
description: |
  Traditional high school football approach emphasizing downhill power running (Power,
  Counter, ISO), physical OL play, and simplicity. Heavy use of fullback lead blocking.
  Designed for high school athletes' strength and skill levels. Often mirrors old-school
  college/NFL approaches. Focus on blocking schemes, gap discipline, and ball security.
  Still dominant in many HS programs.
