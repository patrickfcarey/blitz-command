philosophy_id: shanahan-zone
name: Shanahan Zone
description: |
  Outside-zone run + bootleg play-action + tempo passing. Developed by Mike
  Shanahan at Denver Broncos in 1990s; carried forward by Kyle Shanahan at
  Atlanta, San Francisco, Washington. Emphasizes horizontal run game, quick
  hitters off play-action, and motion/tempo concepts. Zone-based OL blocking
  with QB flexibility.
era: "1990s–present"
