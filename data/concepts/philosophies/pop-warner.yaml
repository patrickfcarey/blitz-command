philosophy_id: pop-warner
name: Pop Warner (Youth Football)
description: |
  Simplified, age-appropriate football for youth players (typically 8-12 years old).
  Emphasizes fundamentals, ball security, and basic gap-blocking. Limited passing
  complexity; heavy reliance on outside runs, simple dive plays, and end-sweeps.
  Designed for shorter fields and younger player bodies. Focus on teaching blocking
  concepts and reading defenders in simple situations.
era: "1929–present"
