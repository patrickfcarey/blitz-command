philosophy_id: wing-t
name: Wing-T
description: |
  Misdirection-heavy, run-first offense using 21/22 personnel (2 RBs, 1-2 TEs,
  1-2 WRs). The "big three" plays — Buck Sweep, Belly Series, Trap — create
  a core playbook. Heavy use of pulling and trap blocking. Developed by Tubby
  Raymond at University of Delaware. Staple of high school football; still used
  in college and occasionally in NFL.
era: "1950s–today (primarily HS)"
originators:
  - "Tubby Raymond (University of Delaware, 1952–1986)"
