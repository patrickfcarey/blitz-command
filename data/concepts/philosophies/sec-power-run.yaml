philosophy_id: sec-power-run
name: SEC Power Run (Smashmouth College)
description: |
  Distinctive Southeastern Conference approach to power football: heavy emphasis on
  downhill running (Power, Counter, ISO), elite OL play, and physical play-action.
  Combines classic power-run principles with modern spread-motion. Built around
  recruiting deep southern traditions of run-heavy football. Staple of Alabama,
  Georgia, LSU, and other SEC blue-bloods.
