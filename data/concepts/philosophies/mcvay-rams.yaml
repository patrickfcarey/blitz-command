philosophy_id: mcvay-rams
name: McVay / Rams Wide Zone
description: |
  Wide-zone run + jet motion + condensed formations + pre-snap read passing.
  Developed by Sean McVay at Los Angeles Rams (2017–2020). Combines stretch
  outside-zone with motion, slot receiver usage, and RPO/tempo concepts.
  Modern evolution of zone-blocking; emphasizes receiver separation and
  window creation. Influential in current NFL.
