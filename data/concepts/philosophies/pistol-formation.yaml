philosophy_id: pistol-formation
name: Pistol Formation
description: |
  Hybrid formation combining elements of shotgun (QB in shotgun) and I-Form (RB closer
  behind QB). Popularized by Colin Kaepernick and the 49ers. Provides flexibility:
  can run zone or gap schemes, quick passing, or read options. Used in modern NFL and
  increasingly in college. Balanced approach with both run and pass threats.
