philosophy_id: run-and-pound
name: Run-and-Pound (Modern Heavy Run)
description: |
  Modern NFL approach emphasizing heavy rushing volume, clock control, and physical
  play. Originated with Baltimore Ravens (Ray Rice era) and Seattle Seahawks (Beast Mode).
  Combines zone-blocking with occasional play-action. Heavy reliance on elite RB talent
  and strong OL. Used to wear down defenses and protect a developing or backup QB.
era: "2000s–present"
originators:
