philosophy_id: option-heavy
name: Option-Heavy (Modern Option)
description: |
  General category for any offense built around QB option reads (triple option, veer,
  midline option, or read-option/zone-read hybrids). Emphasis on QB decision-making,
  pitch-man execution, and multiple-threat attack. Can be pure triple-option (veer/
  flexbone) or modern zone-read option. Gaining popularity in college as teams seek
  mobile QBs.
era: "1960s–present (waves of popularity)"
originators:
  - "Army/Navy service academies"
  - "Darrell Royal (Texas Wishbone)"
  - "Rich Rodriguez (modern zone-read option at WVU/Michigan)"
