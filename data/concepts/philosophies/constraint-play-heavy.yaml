philosophy_id: constraint-play-heavy
name: Constraint-Play Heavy
description: |
  Offensive philosophy built around heavy use of constraint plays (draw, screen,
  bubble screens, play-action, RPO) to punish aggressive defenses. Emphasizes deception
  and misdirection. Works best against pass-rushing defenses. Can be applied to any
  base system (West Coast, Air Raid, Pro-Style) but defines the philosophy by constraint
  frequency rather than base concepts.
era: "2000s–present (modern evolution)"
