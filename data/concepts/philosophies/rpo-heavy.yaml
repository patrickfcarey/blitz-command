philosophy_id: rpo-heavy
name: RPO-Heavy (Run-Pass Option Modern)
description: |
  Modern offensive philosophy emphasizing RPO (Run-Pass Option) and read-option concepts
  heavily. Post-snap read-based attack where QB decides run vs pass based on defender
  actions. Combines zone-run efficiency with vertical passing threat. Growing trend in
  college and modern NFL. Requires versatile QB and multiple route trees. Used to attack
  both run-stopping and pass-rushing defenses simultaneously.
era: "2010s–present"
