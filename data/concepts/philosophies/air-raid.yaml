philosophy_id: air-raid
name: Air Raid
description: |
  Pass-heavy, 4-WR shotgun offense emphasizing multiple receivers and high-low
  reads. Developed by Mike Mumme and elevated to prominence by Mike Leach at
  Texas Tech in the late 1990s. Focuses on spacing, receiver separation, and
  QB touches on many short-intermediate routes. Low run rate; high pass rate.
  Adapted widely in college and increasingly in NFL.
era: "Mid-1990s–present"
originators:
  - "Mike Mumme (University of Wyoming, 1990s)"
  - "Mike Leach (Texas Tech, 2000–2009; Washington State 2012–2019)"
