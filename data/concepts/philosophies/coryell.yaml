philosophy_id: coryell
name: Coryell (Air Coryell)
description: |
  Vertical pass-first offense emphasizing deep posts, digs, and vertical seam
  routes. Developed by Don Coryell at SDSU and San Diego Chargers in the 1970s.
  Focus on spacing, route timing, and aggressive QB play. Influenced modern
  NFL; many modern concepts built on Coryell principles. Emphasizes precision
  and ball placement over play-action.
era: "1970s–1980s (peak); 1990s–present (evolution)"
