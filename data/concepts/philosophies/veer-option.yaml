philosophy_id: veer-option
name: Veer Option (Houston System)
description: |
  Triple-option (Veer) attack from under-center. QB reads playside EDGE: if
  crashes → give to FB dive; if stays wide → keep or pitch to HB on perimeter.
  Developed by Bill Yeoman at University of Houston in 1965. Punishes aggressive
  edge defense; relies on QB speed and decision-making. Still used in service
  academies (Army, Navy, Air Force) and some college programs.
era: "1965–present"
originators:
  - "Bill Yeoman (University of Houston, 1965–1987)"
