philosophy_id: spread-to-run
name: Spread-to-Run (Modern HS/College)
description: |
  High school and college offensive approach using spread formations (4-5 WRs) but
  built around power-run concepts (Inside Zone, Outside Zone). Uses spacing to create
  run lanes while maintaining passing threat. Combines spread efficiency with downhill
  run game. Common in modern high school systems and mid-major college programs.
era: "2000s–present"
originators:
