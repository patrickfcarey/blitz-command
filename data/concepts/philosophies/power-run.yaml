philosophy_id: power-run
name: Power Run (Smashmouth)
description: |
  Run-first, downhill attack using gap schemes (Power, Counter, Iso) and heavy
  personnel (multiple TEs, FB). Build-first strategy: establish the run, set up
  play-action, control the line of scrimmage. Pre-dates the forward pass; roots
  in 1800s American football. Still dominant at HS level and in NFL when teams
  have elite OL.
era: "Pre-WW2 to present"
originators:
  - "Amos Alonzo Stagg (early 1900s)"
  - "Knute Rockne (Notre Dame, 1918–1930)"
  - "Pop Warner (Stanford, Yale, 1890s–1930s)"
notable_practitioners:
  - "Vince Lombardi"
  - "Tom Coughlin"
  - "John Gruden"
  - "Andy Reid (when employing smashmouth)"
