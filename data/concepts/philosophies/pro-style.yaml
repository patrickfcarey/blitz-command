philosophy_id: pro-style
name: Pro-Style
description: |
  Generic NFL/CFL balanced offense combining both run and pass elements in
  relatively equal measure. 11 personnel (1 RB, 1 TE, 3 WR) is standard. Call
  plays from under-center and shotgun. Attack vertically (deep routes) and
  horizontally (perimeter, screens). Emphasis on play-caller IQ and scheme fit.
  De facto standard for modern NFL play-design.
