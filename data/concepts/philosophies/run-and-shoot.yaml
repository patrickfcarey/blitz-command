philosophy_id: run-and-shoot
name: Run and Shoot
description: |
  4-WR, no-TE, choice-route offense where every receiver reads post-snap
  coverage and adjusts his route accordingly. Developed by Mouse Davis and
  popularized by June Jones. Emphasizes QB precision and receiver autonomy.
  Low run rate; extremely high pass rate. Used in USFL, WLAF; adapted to NFL
  by Houston Oilers and others. Still used in some college programs.
era: "1980s–1990s (peak); 2000s–present (resurgence)"
originators:
  - "Mouse Davis (Portland State, 1977–1989)"
  - "June Jones (Oilers, Atlanta Falcons)"
notable_practitioners:
