concept_id: sweep
name: Sweep
category: gap-scheme
description: |
  Both guards pull around the perimeter, with a WR or TE cracking back inside
  to block a playside LB. Creates a wide running lane for the HB to follow the
  pulling guards. Used in Wing-T, spread, and misdirection offenses. Fast-hitting
  but requires synchronized pulling and lead blocking.
aim_point: "Perimeter, wide-reaching"
read_tree:
  - phase: 1
    defender: "playside edge"
    decision: "Pulling Gs lead; HB reads if edge is sealed or if he needs to bounce."
  - phase: 2
    defender: "secondary defender"
    decision: "HB follows pullers and works toward sideline or cutback."
blocking_scheme_ref: gap-blocking
pulls_required:
  - LG
  - RG
pairs_with:
  - counter
  - option
  - wing-t
tags:
  - run
  - perimeter
  - wing-t
  - misdirection
  - any-level
  - high-school
  - college
verification_status: unverified
