concept_id: inside-zone
name: Inside Zone (IZ)
category: zone-scheme
description: |
  Zone-blocking run where OL zone-step playside and combo-block DL, climbing
  to LBs on the second level. The HB reads the interior DL — if he bends away
  (BANG), attack inside; if he presses (BEND), work up to the LB; if he
  overcommits (BOUNCE), cut it back. Aims for the B-gap initially but can
  change based on reads.
aim_point: "B-gap, with flexibility based on DL movement"
read_tree:
  - phase: 1
    defender: "playside DT / 3-tech"
    decision: "BANG/BEND/BOUNCE read: if defender leans playside, attack inside; if over-aggressive, bounce it."
  - phase: 2
    defender: "playside ILB"
    decision: "Read block progression to LB level; attack his hip."
blocking_scheme_ref: zone-blocking
pulls_required: []
lead_blocker: FB
pairs_with:
  - outside-zone
  - stretch
  - west-coast
tags:
