notes: 'QB at 4 yd, HB directly behind QB at 7 yd is the signature alignment.

  Distinguishes from shotgun (QB at 5 yd, HB beside QB) — pistol hides the

  HB''s lateral position, allowing read-option and PA without a directional

  tell. Same 11 personnel as Singleback Ace; the Pistol is a depth/alignment

  variant rather than a personnel change.

  '
