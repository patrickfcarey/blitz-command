strengths:
- QB closer to LOS than shotgun = downhill run angles preserved (faster handoff)
- HB directly behind QB hides direction pre-snap (no offset tell)
- Read-option / RPO concepts work without the shotgun "back beside" tell
- PA threat retained — QB can keep the ball or hand off cleanly
- Modern spread-option with under-center-style mesh point
weaknesses:
- QB still slightly removed from LOS — sneak / quick play-action a hair slower than under-center
- HB depth at 7 yd makes outside zone slower to develop than singleback
- Heavy run schemes lose the FB lead block (single-back limitation)
- Some games' editors don't model pistol depth correctly
common_uses:
- Modern college base offense (zone read + RPO heavy)
- 1st-and-10 base run/pass balanced calls
- Hiding run direction pre-snap
- 2-minute / hurry-up where QB needs reads but HB needs depth
