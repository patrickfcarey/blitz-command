era: 2004 onward — Chris Ault innovation at Nevada; widespread in modern college and used in NFL (Kaepernick, RG3 era).
famous_users:
- Chris Ault Nevada (2004 onward) — created the formation
- Colin Kaepernick / 49ers (2012-2014) under Jim Harbaugh
