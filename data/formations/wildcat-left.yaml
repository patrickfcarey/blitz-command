notes: 'The "QB-WR" label captures the unusual case where the formation''s listed QB

  is split as a WR; the actual signal-caller for this play is RB1 taking the

  direct snap. For motion, RB2 commonly motions across pre-snap to fake jet

  or set up a counter step. Mirror left-handed wildcat by flipping all x.

