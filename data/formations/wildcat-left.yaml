era: 'Modern resurgence: 2006 Arkansas (Darren McFadden) and 2008 Miami Dolphins (Dan Henning, Ronnie Brown). Roots trace
  to single-wing direct-snap football of the 1920s-1940s.'
famous_users:
- 2008 Miami Dolphins (Dan Henning OC) — 38-13 win over Patriots Sept 21 2008 (4 rushing TDs + 1 passing TD on 6 wildcat plays)
- 2006 Arkansas (Houston Nutt) with Darren McFadden + Felix Jones
- Various NFL teams as a surprise package (Jets / Bills / Eagles between 2008-2012)
