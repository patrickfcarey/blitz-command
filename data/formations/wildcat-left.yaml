strengths:
- 11 vs 11 numbers advantage in the box (the QB as WR removes a defender from the box if he's covered)
- Direct snap = no fake/handoff timing risk; ball is in the hands of a runner immediately
- Multiple ball-handling threats (RB1 keeper, RB2 jet/sweep, WR reverse)
- Surprise factor — defenses rarely prepare for it
- Pass option — RB1 can throw (Ronnie Brown TD pass vs Patriots, 2008)
- Power-running scheme works to either side from same look
weaknesses:
- Loss of QB threat — defense knows pass is unlikely
- Limited route tree (only the 3 receivers + outlet to RB2 if RB1 throws)
- Telegraphs run intent without a credible passing threat
- Defenses adjusted by 2010 (4-man front + safety in the box neutralizes)
- QB removed from the formation = no audibles / no protection adjustments
common_uses:
- Short-yardage / goal-line constraint package
- Surprise package on an early down
- Trick-play setups (RB pass)
- Runs against light boxes when defenses don't adjust
- Power-spread teams as a tempo / look-changer
