strengths:
  - Pre-aligned weak-side lead blocker for counters, traps, and weak-side power
  - Disrupts defensive expectations vs Strong I tendency
  - Bootleg passes weak-side — FB stays in to fake/release
  - Sets up strong cutback lanes for inside zone (defense overplays weak)

weaknesses:
  - Reduces strong-side run threat (FB not pre-aligned for strong lead)
  - Weak side has no in-line blocker beyond LT — runs there rely on cutoffs
  - Pass protection vs strong-side blitz worse (FB not centered)
  - Less common = easier for film-study defenses to identify intent

common_uses:
  - Weak-side counter and power
  - Weak-side toss / sweep
  - Weak-side bootleg and waggle
  - Setting up reverses and misdirection

