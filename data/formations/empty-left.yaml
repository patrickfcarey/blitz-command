strengths:
- 5 immediate receiving threats — defense must declare coverage pre-snap
- Forces nickel/dime personnel; weakens defense vs the run (in theory)
- Maximum horizontal field stretch
- QB can read pre-snap matchups and audible to favorable matchup
- Quick-game answers everywhere (slants, hitches, screens, choice routes)
- No RB indecision in protection — 5 blockers vs 4-5 rushers is clean
weaknesses:
- Only 5 blockers — any blitz beyond 5 forces a hot throw
- Zero run threat — defense can drop 7 into coverage with no respect for run
- QB exposed if pocket collapses — no checkdown back option
- Two-minute / desperation tell — defense knows pass is coming
- Some games' editors limit empty sets or won't let you save them
common_uses:
- 3rd-and-long
- 4th-and-long
- 2-minute drill (when behind)
- Forcing a defensive personnel mismatch
- QB-led offense vs predictable nickel/dime
run_concepts:
- qb-draw
- qb-sneak
- quick-screen-as-run
