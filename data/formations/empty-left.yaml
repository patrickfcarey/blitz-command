- 'Web validated 2026-04-29 — KOKA Sports ''What is 10 Personnel'' (https://blog.kokasports.com/what-is-10-personnel-in-football/);
  KOKA Sports ''10 Personnel Football'' (https://blog.kokasports.com/10-personnel-football/); CougCenter ''Air Raid WSU formations''
  (https://www.cougcenter.com/2013/3/12/4070202/air-raid-playbook-offensive-formations-mike-leach). CORRECTION applied: this
  file was labeled ''10 personnel'' but the standard RB-TE convention has 10 = 1 RB / 0 TE / 4 WR (not empty). With 0 RB and
  1 TE this is correctly ''01'' personnel; true Empty (no RB) is uncommon enough that ''empty'' and ''10 personnel'' are sometimes
  informally conflated.'
