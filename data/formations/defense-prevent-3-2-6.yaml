notes: |
  Prevent defense — the situational answer to "we lead, opponent has time
  for one drive." 3-man rush (DL only) keeps QB in pocket but gives time;
  2 ILBs cover middle hooks; 6 DBs blanket the deep area in quarters and
  half-deep zones. Trade-off: underneath is wide open, but a 10-yard gain
  is acceptable when the offense needs 60 yards in 30 seconds.

  Common pairing: prevent on 1st/2nd down then timeout-clock-management;
  rarely used outside end-of-half or end-of-game scenarios.

