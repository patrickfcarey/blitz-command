notes: 'Mirror by flipping all x to make "Shotgun 2x1 TE-Weak (Trips Left)" with TE

  on right and 2 WRs left. The TE side here is the WEAK side (where the run

  game is supported) but strength_side=right because that''s where 2 of the 3

  WRs align.

  '
