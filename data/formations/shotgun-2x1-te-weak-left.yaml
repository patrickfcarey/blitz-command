strengths:
- TE on weak side gives backside run support and PA bootleg credibility
- Strong-side overload of 2 wide receivers stretches strong-side coverage
- Slot WR (strong) creates RPO-friendly inside-breaking routes
- Hides intent — TE-Weak is less common than TE-Strong, defense has fewer keys
- HB offset strong for protection help vs strong-side blitz
weaknesses:
- Strong side has no in-line blocker for runs (no TE strong = harder edge sealing)
- Backside slot route congested with TE underneath
- Less common formation = less practiced by your own offense
- Vulnerable to weak-side blitzes (only TE for blocking help, no HB chip)
- Strong-side run hits the C-gap with no TE seal
common_uses:
- PA bootleg weak-side after establishing strong-side run
- Constraint to TE-Strong tendencies (gives defense a different look)
- Strong-side passing concepts (smash, flood)
- 3rd-and-medium with QB needing time and protection backside
run_concepts:
- inside-zone (weak cutback — TE seals backside)
- outside-zone-weak (TE reach blocks edge weak)
- draw
- counter (pull strong-side guard)
pass_concepts:
- pa-bootleg-weak
- smash-strong
- flood-strong
- mesh
- stick (strong-side slot version)
- rpo-slant (read MIKE)
era: 2000s onward — modern spread variant emphasizing weak-side blocking and strong-side passing.
famous_users:
- Patriots / Belichick offense (TE-Weak as a counter to TE-Strong tendencies)
- Modern NFL teams varying TE alignment to defeat keys
