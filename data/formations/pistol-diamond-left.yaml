notes: 'Pistol Diamond places 3 backs in a diamond shape behind the QB:

  - HB directly behind QB at 7 yd (the deep slot of the diamond)

  - FB-L and FB-R flanking QB at 5 yd depth (the side slots)


  This gives the offense 3 ball-carrier threats from one look. The HB

  can run inside zone read; FB-L can run jet sweep; FB-R can lead block

  or kick out an EDGE. Defenses have to fit gaps for 3 different runners.


  Less common than base Pistol — used in modern hybrid run packages

  rather than as a base offense. Pistol Trips and Pistol Y-Off are

  more common pistol variants.

  '
