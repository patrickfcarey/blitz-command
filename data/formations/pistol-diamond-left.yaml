strengths:
- Three-back threat from one look (HB run, FB lead, FB ball-carrier on sweep)
- Diamond formation hides which back is taking the ball
- FB-L / FB-R can run kickouts, leads, jet sweeps, or routes
- QB read-option mechanic still works (HB behind QB hides direction)
- RPO-friendly with 2 WRs split + 1 TE — 3 receivers eligible
- Heavy-personnel run threat with passing flexibility
weaknesses:
- Still 1 RB primary — not as run-overpowering as a true 22 personnel
- Slot/spread teams may struggle vs nickel defense (only 2 WRs)
- Diamond alignment can tip play direction if FB lean / set is off
- Slow-developing perimeter runs (FB1/FB2 have to come from the diamond)
- Limited use vs disciplined modern defenses with film prep
common_uses:
- Modern hybrid run-game (split-zone, jet-sweep, power-read)
- Goal-line / short-yardage flex (3 backs as lead blockers)
- Constraint to spread tendencies
- PA shots with multiple play-fakes
- 1st-down balanced run/pass calls
