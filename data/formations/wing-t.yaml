notes: |
  The Wing position is a hybrid TE/HB — listed with position TE for blocking
  purposes (he's eligible). Some teams classify him as a "wingback" or RB
  (making it 32 personnel). 22 here is the more common modern classification.
  Three core plays per Tubby Raymond / Wakefield tradition: Buck Sweep, Trap,
  Belly. Add Boot/Waggle for the PA cousin.

