name: Wing-T
side: offense
personnel: "22"
strength_side: right

# Classic Delaware Wing-T. 22 personnel: 2 RB (FB + HB), 2 TE (in-line TE
# + Wing back as flex/H-back hybrid), 1 WR (split end).
# - FB directly behind QB at 4.5 yd
# - HB offset weak side at 5.5 yd (the "tailback" or "halfback")
# - Wing aligned 1.5 yd outside the strong-side TE, 1 yd off the line
# - Split end (X) wide weak-side
# Legality: 5 OL + TE + X = 7 on the line. Wing is OFF the line (a 4th
# off-line player), so: WING + QB + FB + HB = 4 off line, balanced.
players:
  - { label: LT,    position: LT, x: -2.0,  y:  0.0, on_line: true  }
  - { label: LG,    position: LG, x: -1.0,  y:  0.0, on_line: true  }
  - { label: C,     position: C,  x:  0.0,  y:  0.0, on_line: true  }
