strengths:
  - "Misdirection-heavy — every play looks similar pre-snap (Buck Sweep, Belly, Trap, Waggle all start identically)"
  - "Multiple ball-carrier threats — FB, HB, Wing, plus reverse / waggle off motion"
  - Pulling-guard run game (Buck Sweep) creates angles power can't match
  - Wing alignment allows wing to crack-block, kick-out, pull, or lead
  - Diversified run concepts from one look stresses defensive discipline
  - Best HS option offense — concepts simple to teach, hard to defend without film prep

weaknesses:
  - Limited passing windows (1 true WR; Wing and TE less explosive route runners)
  - Slow tempo / not built for hurry-up
  - Modern speed defenses with disciplined gap fits neutralize misdirection
  - Vulnerable to LB scrape-exchange schemes that ignore the FB fake
  - Predictable in passing situations (must motion to spread)

common_uses:
  - HS offenses with run-heavy identity
  - Small college / option football tradition
  - Goal-line and short-yardage at any level (constraint package)
  - 4-minute offense
  - Triple-play series (run, fake-run, waggle pass)

run_concepts:
  - buck-sweep
  - belly
  - trap
  - down
  - jet-sweep
  - reverse
  - counter-criss-cross

pass_concepts:
  - waggle
  - boot
  - belly-pass
  - play-action-tight-end-corner
  - pa-flood

era: "1950s onward — Dave Nelson and Tubby Raymond at Delaware (1960s-2000s) defined the modern Wing-T. Still dominant at HS / small college level."

famous_users:
  - "University of Delaware under Tubby Raymond (1966-2001) — definitive program"
  - "Many HS programs across the US (especially the Northeast and Mid-Atlantic)"
  - "Pop Warner and youth football programs"
  - "Navy under Paul Johnson before transitioning to flexbone"

