  - "Web validated 2026-04-29 — Throw Deep Publishing 'Wing-T Offense In-Depth Guide' (https://throwdeeppublishing.com/blogs/football-glossary/the-wing-t-offense-an-in-depth-guide); Youth Football Online 'Wing T Buck Sweep' (https://youthfootballonline.com/wing-t-formation-buck-sweep-play/); USA Football 'Reflections from a Wing T guru' (https://blogs.usafootball.com/blog/6633/reflections-from-a-wing-t-guru-part-1); Glazier Drive 'Base Plays in Under-Center Wing-T' (https://production.glazierdrive.com/library/base-plays-in-the-under-center-wing-t-offense-buck-sweep-trap-down-belly-jet-sweep-boot-waggle-belly-pass). Confirmed top-3 plays: Trap, Belly, Down (sometimes called Belly G); plus Buck Sweep as signature."
