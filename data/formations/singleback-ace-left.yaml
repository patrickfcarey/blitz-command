notes: 'Symmetric 12-personnel under-center singleback. Both TEs in-line as

  line-ends; both WRs split wide off the line. Madden uses this as the

  default "Singleback" formation. The 11-personnel variant (1 TE / 3 WR)

  with a slot receiver lives in singleback-trio.yaml.

  '
