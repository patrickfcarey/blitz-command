name: I-Formation
side: offense
personnel: "21"
strength: right

# 11 players, universal coordinates (yards) — see docs/coordinate-systems.md.
# Legality: exactly 7 players with on_line: true.
# Here: 5 OL + TE + X = 7 on the line; Z, QB, FB, HB are off.
players:
  - { label: LT, position: LT, x: -2.0,  y:  0.0, on_line: true  }
  - { label: LG, position: LG, x: -1.0,  y:  0.0, on_line: true  }
  - { label: C,  position: C,  x:  0.0,  y:  0.0, on_line: true  }
  - { label: RG, position: RG, x:  1.0,  y:  0.0, on_line: true  }
  - { label: RT, position: RT, x:  2.0,  y:  0.0, on_line: true  }
  - { label: TE, position: TE, x:  3.5,  y:  0.0, on_line: true  }
  - { label: X,  position: WR, x: -15.0, y:  0.0, on_line: true  }
  - { label: Z,  position: WR, x:  12.0, y: -1.0, on_line: false }
  - { label: QB, position: QB, x:  0.0,  y: -1.5, on_line: false }
  - { label: FB, position: FB, x:  0.0,  y: -4.5, on_line: false }
  - { label: HB, position: HB, x:  0.0,  y: -7.0, on_line: false }

common_uses:
  - Power and gap-scheme running
  - Play-action passing off run looks
  - Short-yardage and goal-line situations
  - Pro-style and old-school NFL/NCAA offenses

weaknesses:
  - Telegraphs run-first intent pre-snap
  - Slow to spread the field for quick passing
  - FB and HB stacked behind QB limits backfield deception without motion

tags:
  - pro-style
  - power
  - 21-personnel

notes: |
  Standard "Pro I" / "I-Form Normal": strong-side TE on the right, split end
  (X) opposite. Z aligns off the line on the strong side; if Z came on the
  line the formation would be illegal (8 on the LOS). This file describes the
  base alignment; per-play motion and minor splits live in play files.

verification_status: inferred
source_notes:
  - "Coordinates use widely-taught coaching conventions; not measured from any specific game tape or coaching manual."
  - "OL splits assume 1 yd C-G / G-T and 1.5 yd T-TE — typical of pro-style spacing."
