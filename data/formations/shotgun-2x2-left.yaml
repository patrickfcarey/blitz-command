era: 2000s onward — modern spread/RPO base; ubiquitous across NFL and college.
famous_users:
- Most modern NFL offenses (2x2 with 11 personnel is the league-average set)
- Air Raid college programs (Mike Leach lineage)
- Spread option offenses (Auburn, Ole Miss, modern Big 12)
