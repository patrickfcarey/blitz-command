strengths:
- Balanced presentation forces defense to declare coverage rotation
- 2 receivers each side = mirrored concepts on left and right
- Easy RPO setup (read backside LB, throw bubble or quick game)
- QB has full field read; pre-snap matchups visible
- Pairs naturally with both 4-vert and quick-game families
- Modern offensive base — every team has a 2x2 staple
weaknesses:
- No formation strength tilts the run game one direction
- HB offset weak gives a tell for protection slide
- Vulnerable to bracket coverage on outside WRs
- Run game without TE attached to playside is one-dimensional vs heavy fronts
- Defensive nickel personnel matches well — neutralizes mismatch attempts
common_uses:
- Modern offensive base on most NFL/college 1st/2nd downs
- 2-minute drill / hurry-up
- RPO setups (read-then-throw)
- Symmetric route concepts (same call, mirrored both sides)
- Hiding play tendency (no formation tip)
