notes: '"2x2" = 2 receivers each side. With 11 personnel and TE in-line strong,

  that means TE + Z strong / X + SLOT-W weak. Y-Flex variant (TE flexed

  off the line as a slot) is a separate file when added. Mirror to

  Shotgun 2x2 with TE-Left for opposite strength.

  '
