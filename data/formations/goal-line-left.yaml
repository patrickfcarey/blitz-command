strengths:
- Maximum blocking surface — 7 in-line blockers (5 OL + 2 TE)
- FB lead block + HB downhill for short-yardage power
- Defense can't load every gap with only 7 to block
- Play-action is brutal — defense has to commit hard to stop the run
- Strong red-zone fade option to single WR vs press
- Multiple gap-scheme options from same look
weaknesses:
- Telegraphs run intent — formation only used in short-yardage / goal-line
- Single WR limits passing windows
- Struggles vs goal-line-stand defenses with 9+ in the box and zero coverage
- QB has minimal time on PA pass — rollout safer than dropback
- Cutback lanes can collapse against a disciplined penetrating front
common_uses:
- 1st-and-Goal from inside the 5
- 4th-and-1 (or 4th-and-inches anywhere on the field)
- Short-yardage 2-point conversion
- Final-minute clock-killing run packages
- Goal-line PA shots to TE corner
