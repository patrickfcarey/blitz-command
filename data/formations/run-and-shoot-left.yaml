strengths:
- Four receivers all eligible — extreme spread-out attack
- Choice routes adjust to coverage post-snap — hard to defend with a fixed call
- Forces defense out of base personnel into nickel or dime
- Tempo-friendly — quick reads and quick throws
- QB has multiple options on every play; checkdown is built in
- Innovative for its era — trail-blazed modern spread offense
weaknesses:
- Run game limited (1 RB, no TE, no FB lead)
- QB must read coverages quickly — high cognitive load
- Receivers must read coverage AND adjust routes — high cognitive load
- Pass-protection fragile (no extra blockers)
- Modern pattern-match coverage neutralizes choice routes
- Relies on QB being right more often than not
common_uses:
- Pass-heavy passing-down packages
- Tempo offense / hurry-up base
- 1980s-90s NFL run-and-shoot teams (Houston Oilers, Detroit Lions)
- Modern spread-passing variants (some Air Raid concepts inherit this)
- When the offense needs to spread the field horizontally
