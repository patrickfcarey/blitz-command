notes: |
  Buddy Ryan's 46 Bear — 5 DL aligned to overload the inside (NT over
  center, DTs in A-gaps, DEs outside the offensive tackles). 3 LBs walked
  up to the LOS for blitz threats. CBs press-man on outside WRs. SS man
  on TE. NO deep safety — pure cover-0. High risk, high reward.

