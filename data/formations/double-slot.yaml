notes: |
  Run-and-Shoot was the original "every receiver reads the coverage"
  spread offense. Routes are option / choice routes — the receiver picks
  his route post-snap based on what the corner / safety does. This makes
  the offense extremely flexible (no two snaps look the same) but also
  cognitively demanding for QB and receivers.

  The system fell out of favor in the late 1990s as defenses developed
  pattern-matching to neutralize choice routes. Concepts inherited into
  the Air Raid (Mike Leach's signature offense traces partially to RnS).

