name: Double Slot
side: offense
personnel: "10"
strength_side: balanced

# Glenn "Tiger" Ellison / Mouse Davis innovation. 4 WR (2 split wide,
# 2 in slots) + 1 RB + 0 TE + QB. Receivers run "choice" / "option" routes
# that adjust mid-route based on coverage. Built around horizontal stretch
# and post-snap defensive reads.
#
# The system's signature: every receiver can audible his own route based
# on what the defender does. This makes the offense extremely hard to
# scout — formation looks the same, but routes change every snap.
#
# Legality: 5 OL + X + Z (or one slot) = 7 on line. Variants exist with
# X off the line; here X is on for legality.
players:
  - { label: LT,    position: LT, x: -2.0,  y:  0.0, on_line: true  }
  - { label: LG,    position: LG, x: -1.0,  y:  0.0, on_line: true  }
  - { label: C,     position: C,  x:  0.0,  y:  0.0, on_line: true  }
  - { label: RG,    position: RG, x:  1.0,  y:  0.0, on_line: true  }
  - { label: RT,    position: RT, x:  2.0,  y:  0.0, on_line: true  }
  - { label: X,     position: WR, x: -15.0, y:  0.0, on_line: true  }
  - { label: Z,     position: WR, x:  15.0, y:  0.0, on_line: true  }
  - { label: SLOT-L, position: WR, x: -8.0,  y: -1.0, on_line: false }
