notes: |
  Wishbone shape: FB at 4.5 yd directly behind QB, HBL at -3 / -6, HBR
  at +3 / -6. The two HBs are pitch men, the FB is the dive man. QB
  reads twice — once for the dive (give to FB or keep) and once for
  the pitch (keep or pitch to trailing HB). Modernized into the
  Flexbone (which moves the wing-backs up to slot-back depth and
  spreads them wider).

