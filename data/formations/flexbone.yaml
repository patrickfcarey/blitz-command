strengths:
  - "Triple-option threat with faster pitch (slot-backs at slot depth, not deep HB depth)"
  - "Slot-backs can run jet motion / pre-snap motion (used heavily by service academies)"
  - "Two pitch-men (SLOT-L and SLOT-R) — option works to either side"
  - "Better passing flexibility than Wishbone (slot-backs are eligible receivers)"
  - "Run-pass deception — slot-backs can route or block depending on the play"
  - "Hard for traditional 4-3 / 3-4 defenses to fit (7 box defenders mismatch the option)"

weaknesses:
  - "Still run-heavy — not a pure passing offense"
  - "Modern fast defenses with disciplined option-fits neutralize the read element"
  - "Limited 4-WR / spread looks"
  - "QB takes hits as a runner — injury risk"
  - "Slot-backs need to be both runners AND receivers AND blockers — versatile player rare"

