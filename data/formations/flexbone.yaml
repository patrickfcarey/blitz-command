name: Flexbone
side: offense
personnel: "20 (flexbone)"
strength_side: balanced

# Modern triple-option formation — evolution of the Wishbone. 5 OL, 1 TE
# (or in some variants 0 TE / 2 SE), 2 SE/WR split wide, QB under center,
# 1 FB at FB depth directly behind QB, 2 SLOT-BACKS (slot wing-backs)
# flanking the OL at slot-back depth and width.
#
# The slot-backs replace the deep HBs of the Wishbone — they're closer
# to the LOS for faster pitch arrivals and can run jet motion / pre-snap
# motion. Service academies (Air Force, Navy, Army) run Flexbone as base.
#
# Legality: 5 OL + TE + SE = 7 on line. QB, FB, SLOT-L, SLOT-R off.
