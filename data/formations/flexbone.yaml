notes: |
  Flexbone is the modernized triple-option. The wing-backs ("slot-backs")
  replace the deep HBs of the Wishbone — they're at slot-back depth (1 yd
  off the line) and 7 yds wide, which lets them serve as pitch men, jet
  motion threats, and route-runners. Most-run college offense in
  service-academy football.

  Difference from Wishbone:
  - Wishbone HBs are deep (-6) and tight (3 yd from C)
  - Flexbone slot-backs are shallow (-1) and wide (7 yd from C)
  - Result: faster pitches, more passing flexibility, harder for defense to fit

