  notes: TE-R chips the EDGE then releases shallow — adds a 6th protection body briefly.
- player: Z
  role: route
  route_name: hitch
  depth_yd: 6
  notes: 'Strong outer Z: 6-yd hitch — the LO of the smash.'
- player: SLOT
  role: route
  route_name: corner
  depth_yd: 12
  is_primary: true
  notes: 'Strong inner slot: 12-yd corner over Z''s hitch — the HI of the smash. Primary read.'
- player: QB
  role: ball_carrier
  path:
  - - 0
    - 0
  - - 0
    - -2
  - - 0
    - -4
  notes: '5-step drop from shotgun depth. Read the playside corner:

    - Corner squats on hitch → throw the corner over the top

    - Corner carries the corner → throw the hitch underneath

    Standard hi-lo decision; pre-snap leverage often tells you.

    '
- player: HB
  role: pass_block
  blocking_scheme: man-protection
  notes: Pass-protect against weak-side blitz; release as checkdown if pressure clears.
strengths:
- Classic hi-lo on the corner — beats cover-2 by design
- TE-R chip adds protection vs strong-side blitz
- 12 personnel disguises pass intent (defense expects run)
- Backside TE-L drag is a 3rd-option outlet
- Easy QB read — pre-snap leverage tells which option open
- Pairs with PA fake to amplify (PA Smash variant)
weaknesses:
- Requires accurate corner-route throw
- Vulnerable to cover-3 (corner carries SLOT, but flat defender takes hitch)
- Slow developing for the corner route (~3.5 sec)
- Limited to one side of the field
- Bracket on slot kills it
best_vs_defense:
- cover-2 (the textbook beater)
- cover-2 invert
- cover-1 with weak-side help removed
- any defense with flat-zone corner
worst_vs_defense:
- cover-3 with hard flat defender
- cover-2 robber
- bracket coverage on slot
- quarters with poach
common_uses:
- 1st-and-10 vs cover-2 tendency
- 2nd-and-medium
- Red-zone (corner becomes back-of-end-zone fade)
- PA shot pairing
philosophy: pro-style
era: 1980s onward — Don Coryell / Bill Walsh staple; modernized continuously.
famous_examples:
- Don Coryell Chargers
- Modern NFL red-zone offenses
- 12-personnel teams using TE chip + smash
