play_id: shotgun-2x2-qb-counter
name: QB Counter (Strong)
aliases:
  - Counter Q
  - Q-Counter
  - QB Counter Trey

formation: shotgun-2x2
play_type: run
ball_carrier: QB

motions: []

assignments:
  - player: LT
    role: run_block
    blocking_scheme: pull-around
    target: edge-defender
    path: [[0, 0], [3, -0.5], [5, -0.5], [7, 2]]
    notes: "PULL — backside tackle pulls and kicks out the playside EDGE."
  - player: LG
    role: run_block
    blocking_scheme: pull-around
    target: playside-LB
    path: [[0, 0], [2, -0.5], [4, 0], [5, 4]]
    notes: "PULL — backside guard pulls around C, leads through the off-tackle hole on the playside ILB."
  - player: C
    role: run_block
    blocking_scheme: gap-block
    target: backside-A-gap
  - player: RG
    role: run_block
    blocking_scheme: down-block
    target: playside-3-tech
  - player: RT
    role: run_block
    blocking_scheme: down-block
    target: playside-DT
  - player: TE
    role: run_block
    blocking_scheme: down-block
    target: playside-LB
    notes: "TE down-blocks at the second level."
  - player: X
    role: run_block
    blocking_scheme: stalk
    target: backside-cornerback
  - player: Z
    role: run_block
    blocking_scheme: stalk
    target: playside-cornerback
  - player: SLOT-W
    role: run_block
    blocking_scheme: stalk
    target: nickel-defender
  - player: QB
    role: ball_carrier
    is_primary: true
    path: [[0, 0], [-1, 0], [3, 3], [4, 8]]
    notes: |
      DESIGNED QB RUN — counter-trey scheme. QB is the ball carrier (no read).
      Counter step LEFT first (sells weakside flow), then plant and run RIGHT
      through the off-tackle hole behind the pulling LT (kickout) and LG (lead).
  - player: HB
    role: fake
    path: [[0, 0], [-1, -1], [-3, 0]]
    notes: "Sell a backside zone-read fake — holds backside DE and LBs from chasing the QB run."

strengths:
  - "Two pulling blockers (LT kickout + LG lead) at the QB-keep point of attack"
  - "Backside HB fake holds defenders, like a true read but with no give option"
  - "Mobile QB becomes a downhill runner with two lead blockers"
  - "Counter step + 3-WR look hold defenders — looks like a pass-or-zone-read"
  - "Modern NFL/college staple for mobile-QB offenses"
  - "Punishes defenses that over-rotate to HB on zone-read tendencies"

weaknesses:
  - "Slow-developing — pullers need ~2.5 sec to arrive"
  - "QB injury risk on every snap (no give option)"
  - "Defense knows QB is the ball-carrier if HB doesn't get a real handoff threat"
  - "Vulnerable to backside DE who reads the pull and chases"
  - "Predictable in known QB-run situations"

best_vs_defense:
  - "4-3 base with predictable EDGE / over-front"
  - "cover-3 with run-fit LBs"
  - "any defense over-pursuing the HB (zone-read tendency)"
  - "nickel personnel (3-WR forces lighter box)"

worst_vs_defense:
  - "scrape-exchange (LB scraping for QB)"
  - "cover-1 robber (extra defender)"
  - "8-man fronts"
  - "bear front"

defensive_counters:
  - counter_id: scrape-exchange
    pre_snap_look: "Playside EDGE squeezed down in a tight inside shade, with the MIKE/SAM walked up and cheated outside his normal alignment"
    qb_key: "Scan the playside EDGE — squeezed inside with a LB cheated outside him"
    read_category: dl-alignment
    why: "An EDGE already squeezed inside is set to take the off-tackle hole, so the cheated-out LB scrapes over to meet the QB unblocked where the LT kickout expected a static defender."
    typical_against: ["over-front", "4-3 base", "any defense with QB-run rules"]
  - counter_id: spill-puller
    pre_snap_look: "Playside EDGE in a tight, heavy inside-hand stance with his outside shoulder cocked down, alley safety creeping toward the LOS"
    qb_key: "Scan the playside EDGE — heavy inside hand, outside shoulder ducked"
    read_category: dl-alignment
    why: "An EDGE aligned to wrong-arm spills the LT kickout, bending the QB outside into the creeping alley help instead of letting him run downhill behind the lead guard."
    typical_against: ["over-front", "spill-everything defenses", "modern 4-3 / 3-4 hybrids"]
  - counter_id: extra-box-defender
    pre_snap_look: "7+ defenders in the box against the 3-WR look — strong safety walked down to 6-8 yds inside the playside hash, single-high shell behind"
    qb_key: "Count the box — seven-plus vs a 3-WR set, one high safety"
    read_category: box-count
    why: "QB is the runner, so the offense doesn't gain a number — the extra box body leaves someone in the gap-scheme fit unblocked when the pullers arrive."
    typical_against: ["cover-1 robber", "quarters with SS rolled down", "8-man fronts"]

common_uses:
  - "1st-and-10 base run with mobile QB"
  - "Goal-line / red-zone scoring concept"
  - "3rd-and-short conversion"
  - "Constraint to base inside-zone-read (different ball-carrier, different read)"
  - "Modern NFL (Hurts, Lamar, Allen, Fields, Daniels) staple call"

philosophy: spread-option
run_concept_ref: power
philosophy_ref: spread-option

era: "Mid-2010s onward — designed QB runs from spread became universal as mobile QBs spread through college and NFL."

famous_examples:
  - "Eagles under Doug Pederson / Nick Sirianni (Jalen Hurts QB counter)"
  - "Ravens under John Harbaugh (Lamar Jackson designed-counter)"
  - "Bills under Brian Daboll (Josh Allen designed-counter)"
  - "Commanders under Kliff Kingsbury (Jayden Daniels QB-counter)"
  - "Bears (Justin Fields era) — heavily featured in Luke Getsy offense"

