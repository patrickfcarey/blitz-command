play_id: i-formation-power-boot
name: Power Boot (Strong)
aliases:
  - Power Bootleg
  - Power Waggle
  - Power Naked

formation: i-formation
play_type: play-action
ball_carrier: QB
primary_read: TE
secondary_read: FB
checkdown: X

# Identical Z motion to Power-O — part of the family's shared pre-snap look.
# Run the motion on every member of the Power family, or on none.
motions:
  - player: Z
    type: optional
    motion_type: short-across
    end_position: { x: -8.0, y: -1.0 }
    notes: "Same Z shift as Power-O — keeps the pre-snap look identical across the Power family."

assignments:
  - player: LT
    role: pass_block
    blocking_scheme: half-roll-protection
    notes: "Show the Power down-block, then hinge to protect the backside as the QB clears."
  - player: LG
    role: pass_block
    blocking_scheme: pull-around
    target: playside-edge
    path: [[0, 0], [2, -0.5], [4, 0]]
    notes: "PULL — identical pull track to Power-O for the first two steps to sell the run, then wall the playside edge."
  - player: C
    role: pass_block
    blocking_scheme: half-roll-protection
    notes: "Show the gap block, then slide protection toward the playside."
  - player: RG
    role: pass_block
    blocking_scheme: half-roll-protection
    notes: "Fire out showing the Power down-block, then slide-protect."
  - player: RT
    role: pass_block
    blocking_scheme: half-roll-protection
    notes: "Show the down-block, then seal the playside."
  - player: TE
    role: route
    route_name: drag
    depth_yd: 9
    is_primary: true
    notes: "Show the kickout block on the EDGE for one beat to sell Power, then release across on the drag to the boot side — the bread-and-butter throw on the move."
  - player: X
    role: route
    route_name: comeback
    depth_yd: 14
    notes: "Boot-side comeback — the deeper throw if the drag is walled off."
  - player: QB
    role: ball_carrier
    path: [[0, 0], [-1, -1], [-2, -1], [-5, -1], [-7, 0]]
    notes: "Reverse-out IDENTICAL to Power-O, ride the HB fake, then keep booting backside off the run fake Power-O already sells. Eyes on the TE drag."
  - player: FB
    role: route
    route_name: flat
    depth_yd: 3
    path: [[0, 0], [3, 3], [1, 3], [-3, 3]]
    notes: "Lead through the hole exactly like Power-O for the first two steps, then cross back to the boot-side flat as the underneath outlet."
  - player: HB
    role: fake
    path: [[0, 0], [3, 3], [4, 5]]
    notes: "Run the exact Power-O off-tackle track to sell the handoff, then continue as if finishing the run."

strengths:
  - Identical pre-snap look and first-step action to Power-O — indistinguishable from the run early
  - QB on the move — easier throws, fewer pass-rush angles
  - Power-O already sells a backside boot fake, so the boot is the most natural twin
  - PA fake holds run-flow linebackers, opening the TE drag
  - High completion percentage once Power is respected

weaknesses:
  - Needs Power-O on tape first — a cold fake holds no one
  - Boot-side EDGE defender is unblocked or chipped at best
  - Field cut in half — only the boot side is live
  - Slow-developing — needs ~4 seconds to reach the launch point
  - Throwing back across the field is high-risk

best_vs_defense:
  - cover-3 with run-fit linebackers
  - 4-3 with predictable LB flow
  - any defense overcommitting to Power
  - single-high coverages

worst_vs_defense:
  - two-high shells with LBs at pass depth
  - safety blitz from the boot side
  - cover-2 with a corner playing edge contain
  - any defense not biting the Power fake

defensive_counters:
  - counter_id: alert-zone-no-bite
    pre_snap_look: "Linebackers aligned at full passing depth (5+ yards off the LOS) under a two-high safety shell, not crowding the box"
    qb_key: "Check the LB depth and safety shell — backers deep, two-high behind them"
    read_category: lb-depth
    why: "Linebackers already at pass depth read pass first; they will not vacate on the Power fake, so the TE drag arrives into a populated zone."
    typical_against: ["cover-4", "cover-3 alert", "any defense after Power has been slowed"]
  - counter_id: rush-the-boot-edge
    pre_snap_look: "Boot-side EDGE in a wide-9 sprinter's stance with no blocker assigned to him"
    qb_key: "Scan the boot-side edge — EDGE flared wide-9, weight forward, uncovered"
    read_category: dl-alignment
    why: "A wide-9 EDGE in a get-off stance with no blocker crashes upfield and flushes the QB before the rollout reaches its launch point."
    typical_against: ["cover-1 with edge pressure", "any defense with a free runner off the boot side"]
  - counter_id: squat-flat-corner
    pre_snap_look: "Boot-side CB aligned tight at 5-6 yards with inside leverage and a safety capped over the top of him"
    qb_key: "Check the boot-side corner — CB squatted low and inside with a safety overlapping above"
    read_category: cb-leverage
    why: "A low, inside-leverage corner with deep safety help is free to trigger down on the FB flat, removing the rolling QB's safety-valve outlet."
    typical_against: ["cover-2 with hard corners", "quarters with cloud rotation"]

common_uses:
  - After establishing Power-O for 4+ yards
  - 1st-and-10 play-action shot
  - 3rd-and-medium moving-pocket throw
  - Red-zone moving-target passing

philosophy: power-run
pass_concept_ref: sail
philosophy_ref: power-run

era: "Universal — the bootleg off the power run is a staple of every power-running era, modernized continuously."

famous_examples:
  - "Vince Lombardi's Packers (waggle off the Power sweep)"
  - "Mike Shanahan / Gary Kubiak bootleg game off the downhill run"

tags:
  - pa
  - play-action
  - bootleg
  - rollout
  - power-run
  - high-school
  - college
  - nfl

notes: |
  Play-action bootleg off Power-O. The QB reverse-out, the HB off-tackle
  fake, the FB lead, the LG pull, and the OL down-block show are all
  IDENTICAL to Power-O — and Power-O already sells a backside boot fake, so
  the boot is the most natural disguise twin of the run. The QB keeps it and
  boots backside with a three-level read (TE drag / FB flat / X comeback).
  Member of the I-Formation Power disguise family (see data/play-families/).

  Mirror to power-boot-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "Bootleg off the power run is a universal constraint concept. Authored as a disguise twin of i-formation-power-o — initial action (QB reverse-out, HB/FB tracks, LG pull) deliberately mirrors the base play."
