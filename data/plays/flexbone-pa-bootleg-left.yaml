  notes: 'Triple play-fake — sell FB midline / dive, sell SLOT-R pitch action, then bootleg

    to the strong (right) side. QB rolls to ~5 yd depth, scans:

    - SLOT-R wheel (the kill shot — slot-back wheel route is the signature flexbone PA throw)

    - TE drag if SLOT-R covered

    - SLOT-L flat as outlet

