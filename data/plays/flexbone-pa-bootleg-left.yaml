notes: 'Flexbone PA Bootleg is the signature passing play of the flexbone offense.

  Slot-back wheel (SLOT-R) is the kill shot — flexbone defenses know they

  have to fit run aggressively, so the slot-back faking pitch then turning

  upfield is essentially uncovered on most snaps.


  Triple play-fake (FB midline + SLOT-R pitch + QB bootleg) is what makes

  this concept lethal — defense has to simultaneously honor 3 different

  run threats, which is impossible.


  Mirror by flipping all x.

  '
