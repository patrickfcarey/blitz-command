strengths:
- Triple play-fake (FB midline + SLOT-R pitch + QB bootleg) sells the run massively
- Wheel route from a slot-back is hard to cover (LB / SS gets crossed up)
- Flexbone defenses key heavily on run — PA shots have huge impact
- Backside SE post threat keeps the FS honest
- SLOT-L flat outlet provides a 3-yd quick-throw on the rollout
- Constraint package after establishing triple-option success
weaknesses:
- Slow-developing — QB rolling out takes 3+ sec
- Vulnerable to backside DE pursuing the rollout
- Pass protection fragile (only 5 OL, no extra blockers)
- Cover-2 with playside corner squat shuts down comeback
- Flexbone QB may not be a true thrower — accuracy / arm-strength concerns
best_vs_defense:
- Cover-3 with FS biting on TE drag
- Cover-1 with single coverage on slot-backs
- any defense aggressively run-fitting (LBs flow, leaving voids)
- 8-man fronts (no help for slot wheel)
worst_vs_defense:
- Cover-2 with disciplined corner play
- Cover-4 with disciplined deep coverage
- Backside DE who plays QB on rollouts
- Defenses that don't bite on PA
common_uses:
- PA shot off established triple-option run game
- 1st-and-10 after a sequence of triple-option calls
- Red-zone TE corner / SLOT wheel (back of end zone)
- Constraint to over-pursuing run defenses
- Service-academy scoring concept
philosophy: pro-style
