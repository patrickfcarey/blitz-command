strengths:
- Triple-fake (sweep + belly + bootleg) sells deep PA
- QB on the move — easier throws and better angles
- Off the most-feared Wing-T run play (Buck Sweep)
- WING flat is easy first-down completion
- Defenders biting on sweep get burned
weaknesses:
- QB exposed if blockers don't seal bootleg edge
- Slow-developing — needs 4 sec for routes to break
- Backside DE who chases hard kills the rollout
- Modern speed defenses with disciplined keys can sit on PA
best_vs_defense:
- over-front
- cover-3 with run-fit LBs
- any defense biting on Wing-T sweep
worst_vs_defense:
- cover-2 with squatting flat-defender
- zero blitz
- backside DE chase
common_uses:
- Setup play after Buck Sweep success
- 1st/2nd-and-medium PA shot
- Red-zone bootleg for TE drag
