play_id: i-formation-lead-toss
name: Lead Toss (Strong)
aliases:
  - Toss
  - Pitch
  - Lead Pitch

formation: i-formation
play_type: run
ball_carrier: HB

motions: []

assignments:
  - player: LT
    role: run_block
    blocking_scheme: drive-block
    target: backside-DE
  - player: LG
    role: run_block
    blocking_scheme: drive-block
    target: backside-DT
  - player: C
    role: run_block
    blocking_scheme: drive-block
    target: 0-or-1-tech
  - player: RG
    role: run_block
    blocking_scheme: pull-around
    target: playside-LB
    path: [[0, 0], [3, -0.5], [6, 0], [7, 4]]
    notes: "PULL — playside guard pulls and leads up to the playside LB."
  - player: RT
    role: run_block
    blocking_scheme: down-block
    target: playside-DE
    notes: "Down-block on playside DE — seal him inside."
  - player: TE
    role: run_block
    blocking_scheme: kickout
    target: edge-defender
    notes: "Kick out the EDGE / force defender — opens the perimeter."
  - player: X
    role: run_block
    blocking_scheme: stalk
    target: cornerback
  - player: Z
    role: run_block
    blocking_scheme: crack
    target: outside-LB-or-S
    notes: "Crack-block back inside — pick off the alley defender."
  - player: QB
    role: handoff
    path: [[0, 0], [-1, -1], [-3, -1]]
    notes: "Reverse-out and pitch the ball to HB on the move; carry out a fake bootleg backside."
  - player: FB
    role: lead_block
    target: cornerback
    path: [[0, 0], [5, 3], [9, 5]]
    notes: "Lead through the perimeter; kickout the corner if needed."
  - player: HB
    role: ball_carrier
    is_primary: true
    path: [[0, 0], [4, 1], [7, 5], [10, 9]]
    notes: |
      Receive the toss while moving laterally; gain ground toward the
      playside corner; turn upfield once the perimeter is sealed by FB
      and pulling RG.

strengths:
  - Speed advantage at the perimeter — HB receiving the ball on the move
  - Multiple lead blockers (FB + pulling RG) at the corner
  - Forces defense to honor the perimeter; opens cutback if defense overflows
  - Good complement to inside power runs (constraint to over-pursuit inside)
  - Big-play potential when the EDGE is kicked out and cornerback is cracked

weaknesses:
  - Slow-developing — needs ~2.5 sec for HB to reach the corner
  - Requires fast HB and athletic OL who can pull
  - Vulnerable to playside DE shooting upfield
  - Cornerback who avoids the crack-block can chase HB down
  - Pre-snap motion or shifts can tip the play

best_vs_defense:
  - 4-3 with predictable EDGE
  - cover-3 with stretched playside coverage
  - any defense over-pursuing inside runs
  - cover-2 with squatting corners

worst_vs_defense:
  - cover-1 with EDGE squeezing
  - bear front
  - blitz from the playside
  - defenses with disciplined edge contain

defensive_counters:
  - counter_id: force-the-cutback
    pre_snap_look: "Playside EDGE in a wide-9 outside the TE with his outside hand and shoulder free, and the force defender aligned outside the TE rather than over him"
    qb_key: "Scan the playside edge — EDGE in a wide-9 with outside leverage, force defender widened"
    read_category: dl-alignment
    why: "An EDGE already wide with outside leverage is set to squeeze and refuse the TE kickout, walling the perimeter and forcing the HB to bend back into pursuit."
    typical_against: ["cover-1 with EDGE squeeze", "any defense with disciplined contain"]
  - counter_id: crash-safety-alley
    pre_snap_look: "Strong safety walked down to 6-8 yds inside the playside hash, in the run alley, under a single-high shell"
    qb_key: "Count the box — strong safety rolled down into the playside alley"
    read_category: box-count
    why: "A safety already sitting in the alley beats the Z crack-block to the spot, so the cracker has no angle and an unblocked defender meets the HB on the perimeter."
    typical_against: ["cover-3 with rolled-down SS", "cover-1 robber"]
  - counter_id: cb-avoid-crack
    pre_snap_look: "Playside CB in soft press at 3-4 yds with his eyes turned inside on the Z, and the strong safety aligned head-up mirroring the outside WR"
    qb_key: "Check the playside corner — CB in soft press, eyes inside on the slot, safety capping the WR"
    read_category: cb-leverage
    why: "A corner peeking inside with the safety already over the WR is set to crack-replace — he runs the alley while the safety takes the WR, so the cracker hits air."
    typical_against: ["cover-2 with crack-replace rules", "press-quarters teams"]

flip_reads:
  - flip_id: force-set-callside
    pre_snap_look: "The playside force defender (CB or OLB) is aligned tight and downhill with run support clearly set to the called side"
    qb_key: "Check the playside edge — force defender squatted and downhill, no cushion"
    read_category: cb-leverage
    flip_to: mirror-play
    why: "A toss into a set force defender is a loss; flipping the toss to the side with a soft, depth-aligned corner gives the perimeter the play needs."
    typical_against: ["cover-2 with hard corners", "cloud support"]
  - flip_id: alley-stacked-formation
    pre_snap_look: "Defense has stacked the alley to the formation's strength — an extra defender plus a rolled safety filling the strong-side perimeter"
    qb_key: "Check the strong-side alley — it is stacked while the weak alley is open"
    read_category: box-count
    flip_to: mirror-formation
    why: "Flipping the formation relocates the strength and the toss target away from the stacked alley; the defense must re-rotate or surrender the edge."
    typical_against: ["quarters with strong roll", "8-man fronts"]

common_uses:
  - 1st/2nd-and-medium when defense expects inside runs
  - Constraint to Power tendency
  - Setting up reverses and counter sweeps
  - Quick perimeter run to get the HB into space

philosophy: power-run
run_concept_ref: power
philosophy_ref: power-run

era: "1960s onward — universal sweep / toss concept across all eras."

famous_examples:
  - "1990s Cowboys (Emmitt Smith on toss sweeps)"
  - "Modern NFL teams using toss as perimeter constraint to power"
  - "USC under Pete Carroll (Reggie Bush era)"

tags:
  - run
  - power-run
  - toss
  - perimeter
  - sweep
  - any-level
  - high-school
  - college
  - nfl

notes: |
  Lead Toss to the strong side. RG pulls and leads through the perimeter;
  FB also leads. Z cracks back to help seal the alley. HB receives the
  toss on the move and gets to the corner. Mirror to "Lead Toss Weak" by
  reversing all coords.

verification_status: unverified
source_notes:
  - "Standard lead toss / pitch scheme; documented across coaching trees from Vince Lombardi sweep onward."
