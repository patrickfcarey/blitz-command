formation: shotgun-2x2-left
play_type: play-action
ball_carrier: QB
primary_read: TE
secondary_read: SLOT-W
checkdown: HB
motions: []
assignments:
- player: LT
  role: pass_block
  blocking_scheme: pa-power-protection
  notes: Fire out low showing the QB-Power down-block for a beat, then anchor and protect the backside.
- player: LG
  role: pass_block
  blocking_scheme: pull-around
  target: playside-edge
  path:
  - - 0
    - 0
  - - -2
    - -0.5
  - - -4
    - 0
  notes: PULL — identical pull track to QB Power for the first two steps to sell the run, then log and wall the playside edge
    rusher.
- player: C
  role: pass_block
  blocking_scheme: pa-power-protection
  notes: Show the gap block, then protect the A-gaps.
- player: RG
  role: pass_block
  blocking_scheme: pa-power-protection
  notes: Fire out showing the QB-Power down-block, then recover and protect.
- player: RT
  role: pass_block
  blocking_scheme: pa-power-protection
  notes: Show the down-block, then protect the playside edge.
- player: TE
  role: route
  route_name: drag
  depth_yd: 8
  is_primary: true
  notes: Show the kickout block on the EDGE for one beat to sell QB Power, then release across on the drag behind the run-flow
    linebackers — the bread-and-butter throw.
- player: X
  role: route
  route_name: post
  depth_yd: 18
  notes: Stalk-release to sell run, then stem to the post — the shot if the backside safety bites the QB-Power fake.
- player: Z
  role: route
  route_name: comeback
  depth_yd: 14
  notes: Stalk-release to sell run, then break the comeback — the playside-perimeter answer if the corner sits.
- player: SLOT-W
  role: route
  route_name: dig
  depth_yd: 12
  notes: Stalk-release for a beat, then stem to the dig as the intermediate weak-side window behind the linebackers.
- player: QB
  role: ball_carrier
  path:
  - - 0
    - 0
  - - -3
    - 3
  - - -3
    - 1
  - - -1
    - 0
  notes: First two waypoints IDENTICAL to QB Power — attack the off-tackle hole showing the designed QB run, then pull up,
    retreat off the run fake, and settle to throw. Eyes on the TE drag first.
- player: HB
  role: fake
  path:
  - - 0
    - 0
  - - 1
    - 1
  - - -3
    - 3
  - - -4
    - 5
  notes: Run the exact QB-Power lead-sweep track for the first two steps to sell the run action, then settle as a late checkdown
    only if pressure clears.
strengths:
- Identical pre-snap look and first-step QB action to QB Power — the defense cannot tell it from the run
- QB showing the run himself sells the fake harder than a backfield handoff fake
- Holds run-flow linebackers, opening the TE drag behind them
- Keeping the LG pull sells QB Power harder than a standard PA fake
- High completion percentage once QB Power has been established on tape
weaknesses:
- Needs QB Power on tape first — a cold PA fake holds no one
- QB attacking the line himself shortens the time before pressure arrives
- Vulnerable to interior pressure that does not honor the run fake
- Pulling the LG leaves a protection seam if the edge rush comes wide
- The QB must reset his feet quickly after showing the run to throw accurately
best_vs_defense:
- cover-3 with run-fit linebackers
- 4-3 with downhill, aggressive LB play
- any defense overcommitting to QB Power
- single-high coverages
worst_vs_defense:
- two-high shells with LBs at pass depth
- cover-1 robber sitting in the drag window
- interior twist / A-gap pressure
- any defense that has stopped QB Power and stopped respecting it
defensive_counters:
- counter_id: alert-zone-no-bite
  pre_snap_look: Linebackers aligned at full passing depth (5+ yards off the LOS) under a two-high safety shell, not crowding
    the box
  qb_key: Check the LB depth and safety shell — backers deep, two-high behind them
  read_category: lb-depth
  why: Linebackers already at pass depth under a two-high shell read pass first; they will not vacate on the QB-Power fake,
    so the TE drag arrives into a populated zone.
  typical_against:
  - cover-4
  - cover-3 alert
  - any defense after QB Power has been slowed
- counter_id: robber-middle
  pre_snap_look: A safety dropped to 8-10 yards, squared and stationed over the middle of the field, with a two-high shell
    rolled behind him
  qb_key: Check the middle of the field — a safety squatting at 8-10 yards over the ball
  read_category: safety-shell
  why: A robber sitting in the drag's window undercuts the primary read and brackets the crosser inside-out.
  typical_against:
  - cover-1 robber
  - cover-3 buzz
- counter_id: edge-overload
  pre_snap_look: Playside EDGE in a wide get-off stance with a second rusher — a LB or nickel — walked up and stacked just
    outside him
  qb_key: Scan the playside edge — EDGE in a sprinter's stance with a second defender stacked outside
  read_category: dl-alignment
  why: An overloaded playside edge outnumbers the protection — with the LG pulling, the rush gets home before the QB can reset
    his feet and throw.
  typical_against:
  - cover-1 with edge pressure
  - zone-pressure looks
common_uses:
- After establishing QB Power for 4+ yards
- 1st-and-10 play-action shot
- 2nd-and-medium
- Red-zone moving the linebackers with the QB-Power fake
