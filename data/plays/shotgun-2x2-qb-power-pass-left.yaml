  off-tackle hole, the HB lead-sweep track, the LG pull, and the OL

  down-block show are all IDENTICAL to QB Power — the defense reads the

  designed QB run. The QB then pulls up, retreats off the fake, and throws

  the TE drag behind the run-flow linebackers. Member of the Shotgun 2x2

  QB-Power disguise family (see data/play-families/).


