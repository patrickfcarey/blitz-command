  - 2x2 Stick

formation: shotgun-2x2
play_type: pass
ball_carrier: QB
primary_read: SLOT-W
secondary_read: Z
checkdown: HB

motions: []

assignments:
  - player: LT
    role: pass_block
    blocking_scheme: man-protection
  - player: LG
    role: pass_block
    blocking_scheme: man-protection
  - player: C
    role: pass_block
    blocking_scheme: man-protection
  - player: RG
    role: pass_block
    blocking_scheme: man-protection
  - player: RT
    role: pass_block
    blocking_scheme: man-protection
  - player: TE
    role: route
    route_name: clear-out-go
    depth_yd: 18
    notes: "Strong-side clear-out — vertical to remove strong-side help."
  - player: X
    role: route
    route_name: clear-out-go
    depth_yd: 18
    notes: "Weak-side clear-out — vertical to clear weak-side corner."
  - player: SLOT-W
    role: route
    route_name: stick
    depth_yd: 6
    is_primary: true
    notes: "Weak-side STICK option route — sit vs zone, break out vs man."
  - player: Z
    role: route
    route_name: stick
    depth_yd: 6
    notes: "Strong-side STICK option route — mirrors SLOT-W. Read whichever is uncovered."
  - player: QB
    role: ball_carrier
    path: [[0, 0], [0, -1], [0, -2]]
    notes: |
      3-step rhythm from shotgun depth. Mirrored 2x2 stick: pre-snap, look at
      MIKE / nickel positioning.
      - If weak-side LB walks out → SLOT-W stick is uncovered (throw weak)
      - If strong-side LB stays in box → Z stick is uncovered (throw strong)
  - player: HB
    role: pass_block
    blocking_scheme: man-protection
    notes: "Pass-pro; release as checkdown only if pressure clears."

strengths:
  - Mirrored concept — same call works either side based on coverage tells
  - Pre-snap read tells QB which side will be open (saves post-snap decision time)
  - Quick-game (3-step) — protection minimal
  - Wins vs zone (sit) and man (break out) on either side
  - Stretches both LBs horizontally — over-rotation kills the defense

weaknesses:
  - Limited big-play potential (6 yd stick)
  - Bracket on slot kills it
  - LB carry-and-cushion neutralizes the option
  - QB must commit to one side quickly — wrong read = no throw

best_vs_defense:
  - cover-2 zone (sit in soft spot, both sides)
  - cover-3 (between curl and flat defender)
  - cover-1 (break out vs man on either side)
  - any defense with uneven LB spacing between hash and sideline

worst_vs_defense:
  - bracket coverage on slots
  - banjo / pattern-match
  - cover-2 robber
  - aggressive nickel blitz

common_uses:
  - 3rd-and-short / 3rd-and-medium
  - 1st down chains
  - Hot read against blitz
  - Quick-game tempo

philosophy: pro-style

era: "1990s onward — modernized through every era of spread offense."

famous_examples:
  - "Patriots offense (multiple eras)"
  - "Andy Reid Eagles / Chiefs"
  - "Modern NFL 11-personnel rhythm calls"
  - "Air Raid college teams"

