notes: |
  Mirrored 2x2 lets the QB pick which side to throw based on pre-snap
  defensive alignment. Both slots run the same option route; the QB
  takes whichever LB has more space (i.e. is more likely to give up
  the stick). Pure decision-on-the-fly play.

verification_status: unverified
source_notes:
  - "Web validated 2026-04-29 — Throw Deep Publishing 'Stick Concept' (https://throwdeeppublishing.com/blogs/football-glossary/stick-concept); BreakdownSports '2x2 and Mirrored Passing Concepts' (http://breakdownsports.blogspot.com/2015/02/football-fundamentals-2x2-and-mirrored-passing-concepts-route-combinations.html); Wesley Ross 'Bill Walsh and the Stick Concept' (https://wesleyrossfootball.wordpress.com/2020/01/03/bill-walsh-the-stick-concept-and-the-constraint-theory-of-offense/). Mirrored 2x2 stick is the textbook decision-on-leverage call."
