secondary_read: TE
checkdown: HB
motions: []
assignments:
- player: LT
  role: pass_block
  blocking_scheme: man-protection
  notes: Five-man slide protection — hold up long enough for the deep post to develop.
- player: LG
  role: pass_block
  blocking_scheme: man-protection
- player: C
  role: pass_block
  blocking_scheme: man-protection
- player: RG
  role: pass_block
  blocking_scheme: man-protection
