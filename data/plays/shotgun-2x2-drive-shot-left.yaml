notes: 'A shot play off the Drive look. The base Drive''s shallow crosser is the

  primary throw; here the IDENTICAL TE drag becomes a clear-out that drags

  the robber and the middle defender across the field, vacating the window

  for the Z post — now the primary, deep read. The backside vertical removes

  post-side safety help. The empty motion block and the QB''s first two drop

  steps are IDENTICAL to the Drive base — the defense reads the shallow-cross

  concept until the post breaks behind them. Member of the Shotgun 2x2 West

  Coast Drive disguise family (see data/play-families/).


  Mirror to drive-shot-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- 'Web validated 2026-05-15 — Throw Deep Publishing ''Drive Concept'' and ''Dagger Concept'' (https://throwdeeppublishing.com/blogs/football-glossary/):
  a shallow crosser used as a clear-out beneath a deep in-breaking route is the standard structure of the dagger / shot family.
  Layering a deep shot off an established shallow-cross look is a documented West Coast constraint.'
- Authored as a disguise twin of shotgun-2x2-drive — empty motions block and the QB's first two drop waypoints deliberately
  mirror the base play; the TE drag is shared with the family's other plays and repurposed here as a clear-out.
- Mirror of shotgun-2x2-drive-shot.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
