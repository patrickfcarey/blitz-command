- player: X
  role: route
  route_name: switch-go
  depth_yd: 25
  notes: 'Weak side switch: X releases as if going outside, then bends INSIDE on a vertical (replaces SLOT-L''s vacated path).'
- player: Z
  role: route
  route_name: switch-go
  depth_yd: 25
  notes: 'Strong side switch: Z releases as if going outside, then bends INSIDE on a vertical (replaces SLOT-R''s vacated
    path).'
- player: SLOT-L
  role: route
  route_name: switch-out-go
  depth_yd: 22
  notes: 'Weak side switch: SLOT-L releases inside as if running a slant, then bends OUTSIDE up the seam (the outside / X
    path).'
- player: SLOT-R
  role: route
  route_name: switch-out-go
  depth_yd: 22
  is_primary: true
  notes: 'Strong side switch: SLOT-R releases inside as if running a slant, then bends OUTSIDE up the seam — the kill route.
    Creates a natural pick on press-man corners. Primary read.'
- player: QB
  role: ball_carrier
  path:
  - - 0
    - 0
  - - 0
    - -2
  - - 0
    - -4
  notes: '5-step drop — IDENTICAL first two waypoints to every play in the

    Run-and-Shoot family (this is the family''s shared QB drop). Switch

    concept creates rubs at 5-7 yds — the WRs and slots cross paths,

    picking off press-man corners. Read deep:

    - Single-high (cover-1 / cover-3) → SLOT-R outside seam (now uncovered after pick)

    - Two-high (cover-2 / cover-4) → Z bending inside (post-style) over the safety

    - Press man → SLOT-R wins on the rub

    - Zone → all 4 verticals stretch the deep coverage

    '
- player: HB
  role: route
  route_name: flat
  depth_yd: 3
  notes: HB releases to the strong-side flat — universal outlet.
strengths:
- Two natural picks at 5-7 yds — press-man corners get rubbed
- Confuses pattern-match coverage (corners and safeties have to switch responsibility)
- Vertical stretch on every snap — 4 deep threats
- Slot-back outside seam is the kill route vs single-high
- Hard for defense to communicate switch responsibility cleanly
weaknesses:
- Slow-developing — needs ~3.5 sec for verticals to develop
- Pass protection fragile (no extra blockers)
- Vulnerable to cover-2 invert (both safeties cover the seams)
- Wide splits required to make switch effective (defense can read formation)
- If picks miss, every WR is in 1-on-1 deep with no help
best_vs_defense:
- Press-man (the picks shred press technique)
- Cover-3 (single-high splits)
- Cover-1 (man-free with FS in the middle)
- Any defense with predictable coverage rotation
worst_vs_defense:
- Cover-2 invert (both safeties bracket the seams)
- Cover-4 with pattern-match
- Aggressive zero blitz (no time)
- Robber coverage (extra defender)
defensive_counters:
- counter_id: two-high-bracket-seams
  pre_snap_look: Two deep safeties at 12-14 yards, each cheated inside toward a hash — squared over the slots rather than
    splitting the field evenly
  qb_key: Check the safety shell — two-high, both narrowed over the slot seams
  read_category: safety-shell
  why: Two safeties already stationed over the seams cap both switch verticals; the inside-bending releases run straight into
    the bracket and the pick buys nothing downfield.
  typical_against:
  - cover-2
  - cover-4 with pattern-match
- counter_id: press-bail-banjo
  pre_snap_look: Both slot-side defenders pressed at the line, stacked tight over SLOT-R and Z, with no inside cushion
  qb_key: Scan the slot-side corners — both pressed and stacked with no leverage gap
  read_category: cb-leverage
  why: Defenders stacked tight in a banjo can pass the crossing receivers off cleanly, switching man responsibility with the
    offense and erasing the pick the concept is built on.
  typical_against:
  - cover-1 banjo
  - pattern-match press
- counter_id: interior-overload-blitz
  pre_snap_look: Both inside linebackers walked up over the guard-center gaps, showing five rushers against a five-man protection
    with no back to help
  qb_key: Count the box — five walked up over a five-man front, HB releasing
  read_category: box-count
  why: Five interior rushers against five linemen leaves a free runner; the deep switch verticals need ~3.5 seconds and the
    throw never gets out.
  typical_against:
  - zero blitz
  - double-A-gap mug
common_uses:
- Vs press-man tells (shotgun looks)
- 1st-and-10 deep shot
- 2-minute drill (4 deep threats forces deep coverage)
- Setting up underneath throws after defense backs off
- Hash-mark / sideline shot when defense is in single-high
