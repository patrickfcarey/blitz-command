notes: 'Switch verticals — slot-backs and outside WRs cross paths at 5-7 yds,

  creating natural rubs that disrupt press-man and confuse pattern-match

  coverage. The slot-back ends up on the outside seam (vacant after WR

  bends inside); the WR ends up on the inside seam (vacant after slot

  bends outside).


  This is the run-and-shoot''s deep-shot answer to press coverage — the

  picks neutralize press technique, and the 4 verticals stretch the deep

  field. Best paired with single-high coverage tells.


  BASE PLAY of the Run-and-Shoot disguise family (see data/play-families/

  run-and-shoot-family.yaml). The SLOT-R short-across motion and the QB''s

  first two drop waypoints are identical across switch, choice, go, screen,

  and draw — the defense sees one pre-snap picture for the whole family.


  Mirror by flipping all x.

  '
