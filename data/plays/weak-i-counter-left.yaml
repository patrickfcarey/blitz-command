strengths:
- Two pulling blockers (RG + RT) at the point of attack
- Weak-side FB pre-aligned for the lead block — natural fit
- Counter step misdirection holds backside defenders
- Punishes defenses overplaying Strong I tendency
weaknesses:
- Slow-developing — pullers need time to arrive
- Vulnerable to weak-side DE penetration before pulling RT arrives
- Weak-side run is naturally less common — defense may smell it
- HB must read the counter correctly
best_vs_defense:
- over-front overplaying strong
- cover-3 with predictable LB flow
- speed-flow defenses
worst_vs_defense:
- bear front
- 8-man fronts
- weak-side DE shooting upfield
common_uses:
- Counter to Strong I tendencies
- 1st/2nd-and-medium when defense expects strong-side
- Setting up weak-side bootleg
philosophy: power-run
philosophy_ref: power-run
era: Counter Trey lineage — Joe Gibbs Redskins onward; staple of pro-style power.
famous_examples:
- Joe Gibbs Washington Redskins counter-from-Weak-I packages
- Modern NFL teams using Counter as a Power complement
