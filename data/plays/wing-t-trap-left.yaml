notes: 'Trap punishes upfield rush. The playside guard (RG) intentionally lets

  his man rush past — the backside guard (LG) pulls across and traps

  that defender from the side. Quick-hitting; FB hits the resulting hole

  with momentum. One of the "big three" Wing-T plays per Wakefield and

  Raymond. Mirror by flipping all x.

  '
verification_status: unverified
source_notes:
- 'Web validated 2026-04-29 — Wing-T Youth Football Coach ''Lew Johnston Perfecting the Wing-T Fullback Trap'' (https://wingt-coach.com/lew-johnston-perfecting-the-wing-t-fullback-trap/);
  Glazier Drive ''Base Plays in Under-Center Wing-T'' (https://production.glazierdrive.com/library/base-plays-in-the-under-center-wing-t-offense-buck-sweep-trap-down-belly-jet-sweep-boot-waggle-belly-pass);
  Throw Deep Publishing ''Wing-T Offense'' (https://throwdeeppublishing.com/blogs/football-glossary/the-wing-t-offense-an-in-depth-guide).
  Confirmed: Trap is ''big three'' core, designed to punish penetration.'
- Mirror of wing-t-trap.yaml — path waypoints flipped on x; formation reference points to the mirror formation. Routes auto-mirror
  in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed look — coordinates
  and paths are the source of truth.
flip_reads:
- flip_id: front-overshift-callside
  pre_snap_look: Defensive front slid toward the called side — an extra down lineman or a walked-up
    linebacker puts +1 in the called-side box.
  qb_key: Count the box side to side — the called side has one more hat than the backside.
  read_category: box-count
  flip_to: mirror-play
  why: Running a gap scheme into the overshift is into the teeth; flipping the play attacks the
    lighter box with the same blocking math.
  typical_against:
  - over-front
  - shifted 4-3
- flip_id: strength-declared-to-formation
  pre_snap_look: Defense has fully declared to the formation's strength — an extra box defender
    to the strong side and a safety rolled down over it.
  qb_key: Check the strength side — both the box count and the safety roll are committed to it.
  read_category: safety-shell
  flip_to: mirror-formation
  why: When the defense keys the formation's strength, flipping the whole formation forces a re-declare
    and the run hits the side they vacated.
  typical_against:
  - cover-3 with strong roll
  - 8-man fronts
