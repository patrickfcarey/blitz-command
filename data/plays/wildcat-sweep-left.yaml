strengths:
- Direct snap to RB1 with two pulling guards = extreme numbers advantage at edge
- Multiple lead blockers (pulling LG + pulling RG + RB2 + SLOT crack)
- Speed advantage — RB1 already moving at the snap
- Surprise factor in modern football
weaknesses:
- Slow-developing perimeter run (~2.5 sec to corner)
- Wildcat formation tells defense run is coming
- Vulnerable to disciplined edge contain
- Defense knows pass is unlikely from this look
best_vs_defense:
- over-front
- cover-3 with stretched playside coverage
- speed-flow defenses
worst_vs_defense:
- cover-1 with EDGE squeezing
- blitz from playside
- disciplined edge defenders
common_uses:
- Perimeter alternative to Wildcat Power
- 1st-and-10 surprise sweep
- Setting up reverses
