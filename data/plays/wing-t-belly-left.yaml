strengths:
- Down-blocks create good angles on every defender at the point of attack
- HB sweep fake holds LBs from scraping playside
- FB gets downhill momentum hitting an outside-tackle gap
- Companion play to Buck Sweep — same look, attacks different spot
- High-percentage 3-5 yard gainer
weaknesses:
- Slow-developing — FB belly path takes time
- Vulnerable to playside DT shooting the gap before down-block sets
- Cutback options limited (committed to playside)
- Modern fast-flow defenses can outrun the misdirection
best_vs_defense:
- over-front (gives down-block angles)
- cover-3 with stretched playside LB
- 4-3 base
- defenses overplaying the sweep
worst_vs_defense:
- bear front
- 8-man fronts
- playside DT penetration
- cover-1 robber
common_uses:
- Constraint to Buck Sweep (when defense overplays sweep)
- 1st-and-10 base
- 3rd-and-short
- Setting up Trap (different hole, same family)
- Goal-line short yardage
