play_id: singleback-ace-inside-zone
name: Inside Zone
aliases: [IZ]

formation: singleback-ace
play_type: run
ball_carrier: HB
run_reads:
  - priority: 1
    read_key: backside defensive end / 4-technique
    run_to: if the DE closes playside, bend the run back to the cutback lane behind the center
    notes: "Zone key — the backside DE tells you whether to press or cut. If he's working playside, the cutback is wide open."
  - priority: 2
    read_key: playside linebacker (frontside)
    run_to: press the designed hole (A-gap / B-gap playside); if the LB fills hard, bounce slightly outside
    notes: "OL is zone-blocking to the playside — trust the double-team and hit the crease."
  - priority: 3
    read_key: safety / second level
    run_to: once past the linebackers, press directly toward the most space at the second level
    notes: "If both reads 1 and 2 are covered, the OL didn't win a double. Take what you can in the line of scrimmage."

motions: []

assignments:
  - { player: LT,   role: run_block, blocking_scheme: zone-step-playside }
  - { player: LG,   role: run_block, blocking_scheme: zone-combo }
  - { player: C,    role: run_block, blocking_scheme: zone-combo, target: 0-or-1-tech }
  - { player: RG,   role: run_block, blocking_scheme: zone-combo, target: 3-tech-then-PSLB }
  - { player: RT,   role: run_block, blocking_scheme: zone-combo }
  - { player: TE-L, role: run_block, blocking_scheme: backside-zone-step, notes: "Backside TE — zone step; helps seal cutback." }
  - { player: TE-R, role: run_block, blocking_scheme: zone-step-playside, target: edge-defender, notes: "Playside TE — seal the edge." }
  - { player: X,    role: run_block, blocking_scheme: stalk, target: cornerback }
  - { player: Z,    role: run_block, blocking_scheme: stalk, target: cornerback }
  - { player: QB,   role: handoff, path: [[0, 0], [-1, -1], [-2, -2]],
      notes: "Reverse-pivot handoff, then sell bootleg to backside." }
  - player: HB
    role: ball_carrier
    is_primary: true
    path: [[0, 0], [2, 3], [3, 8]]
    alt_paths:
      - priority: secondary
        path: [[0, 0], [1, 2], [-1, 6], [-2, 9]]
        notes: "Read 1 (backside DE closes playside): bend back to the cutback lane."
      - priority: tertiary
        path: [[0, 0], [2, 2], [4, 6], [5, 9]]
        notes: "Read 2 (playside LB fills hard): bounce slightly outside the numbers."
    notes: "BANG/BEND/BOUNCE per inside zone rules; aim point is playside A or B gap."

strengths:
  - "12 personnel singleback gives 7-blocker surface for inside zone"
  - "Both TEs in-line means defense has to honor both edges"
  - "Symmetric look — no run-direction tip pre-snap"
  - "Hardest run scheme in modern football to defend without a true run-stopper LB"

weaknesses:
  - "Slow developing relative to gap schemes"
  - "Vulnerable to playside DT shooting the gap before zone-combo sets"
  - "HB must read correctly — wrong choice = TFL"

best_vs_defense:
  - "over-front (gives natural combo angles)"
  - "cover-3 (LB drops away from playside)"
  - "any defense with stretched LBs"

worst_vs_defense:
  - "bear front"
  - "8-man fronts"
  - "cover-1 robber"

defensive_counters:
  - counter_id: backside-c-gap-pressure
    pre_snap_look: "Backside DE in a tight 5-technique with an inside shade, crowding the C-gap rather than aligned in his normal outside-eye spot"
    qb_key: "Scan the backside DE shade — inside eye of the tackle, squeezing the C-gap"
    read_category: dl-alignment
    why: "Inside Zone lives on the BEND read; an inside-shaded backside DE is set to close the C-gap, leaving the HB no cutback and forcing a BANG into a stacked playside front."
    typical_against: ["over-front", "4-3 base"]
  - counter_id: scrape-lb-over-top
    pre_snap_look: "Playside LB stacked directly behind the 3-tech at normal LB depth, shoulders square to the LOS"
    qb_key: "Check the playside LB — stacked square behind the 3-tech"
    read_category: lb-depth
    why: "A LB stacked square over the 3-tech is positioned to scrape over the zone-combo and beat the climbing OL to the front-side A/B gap before the combo can release."
    typical_against: ["over-front", "4-3 stack"]
  - counter_id: slant-dl-away
    pre_snap_look: "DL set in even alignment but visibly cocked and leaning away from the play call, weight on the away-side hand"
    qb_key: "Scan the interior DL stagger — tackles tilted and leaning backside"
    read_category: dl-alignment
    why: "A DL cocked away telegraphs a slant that defeats the playside reach before the OL can combo, forcing the HB to bend into a backside DT now sitting in the cutback lane."
    typical_against: ["over-front", "any 4-down front with movement calls"]

common_uses:
  - "1st-and-10 base run"
  - "2nd-and-medium"
  - "Setting up PA off the same look"

philosophy: zone-run
run_concept_ref: inside-zone
era: "1990s onward"
famous_examples:
  - "Modern NFL/college 12-personnel singleback teams"
tags: [zone-run, inside-zone, 12-personnel, singleback, any-level, high-school, college, nfl]

notes: |
  Inside Zone from the 12-personnel symmetric singleback. With 2 TEs flanking,
  both edges have a sealing blocker. HB reads playside DT/G combo and takes
  bang/bend/bounce per standard IZ rules.

verification_status: unverified
source_notes:
  - "Inside zone from 12-personnel singleback — standard modern run concept; same scheme as singleback-trio-inside-zone but with 2 TEs and no slot."
flip_reads:
- flip_id: three-tech-callside
  pre_snap_look: The 3-technique tackle and the playside linebacker are both set to the called
    side, loading the front-side gaps the zone is aiming for.
  qb_key: Find the 3-technique — it is aligned to the called side, in the zone's path.
  read_category: dl-alignment
  flip_to: mirror-play
  why: Zone run into the 3-technique blocks the penetrator head-on; flipping the zone away runs
    at the lighter shade and a cleaner front-side double.
  typical_against:
  - over-front
  - shifted 4-3
- flip_id: strength-declared-to-formation
  pre_snap_look: Defense has declared to the formation's strength — an extra box defender to the
    strong side with a safety rolled down to support it.
  qb_key: Check the strength side — the box count and the safety roll are both committed to it.
  read_category: safety-shell
  flip_to: mirror-formation
  why: Flipping the whole formation re-locates the strength call; a defense slow to re-set leaves
    the front-side gaps the zone wants unfilled.
  typical_against:
  - cover-3 with strong roll
  - quarters with strong roll
