notes: |
  Run-pass option off QB Power. The QB's first two steps attacking the
  off-tackle hole, the HB lead-sweep track, the LG pull, and the OL
  down-block show are all IDENTICAL to QB Power — the defense reads the
  designed QB run. The QB reads the weak-side conflict defender: keep and
  run QB Power, or pull up and throw the SLOT-W slant. Member of the
  Shotgun 2x2 QB-Power disguise family (see data/play-families/).

  Linemen must stay under the LOS on the read so the throw stays legal.
  Mirror to qb-power-keep-throw-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "Power-scheme RPO off the designed QB run is a universal modern constraint concept. Authored as a disguise twin of shotgun-2x2-qb-power — initial action (QB off-tackle attack, HB lead-sweep track, LG pull) deliberately mirrors the base play through the first two waypoints."
flip_reads:
- flip_id: box-overload-callside
  pre_snap_look: The box is overloaded to the run side — the defense has +1 to the run side while
    leaving the conflict defender's grass open.
  qb_key: Count the box to the run side — it is heavy, the give is no longer the answer.
  read_category: box-count
  flip_to: mirror-play
  why: Flipping the run portion away from the overload keeps the box count honest, so the give
    stays a live answer instead of a forced throw.
  typical_against:
  - over-front
  - 8-man fronts
- flip_id: strength-declared-to-formation
  pre_snap_look: Defense has declared fully to the formation's strength — an extra box defender
    and a safety rolled down over the passing strength.
  qb_key: Check the strength side — both the box count and the safety roll are set to it.
  read_category: safety-shell
  flip_to: mirror-formation
  why: Flipping the formation re-sets the defense's strength call and rebalances the RPO conflict
    so both the run and the throw stay viable.
  typical_against:
  - cover-3 with strong roll
  - quarters with strong roll
