play_id: i-formation-toss-counter-left
name: Toss Counter (Strong) (Mirror Left)
aliases:
- Toss Counter
- Counter off Toss
- Toss Reverse-Out Counter
formation: i-formation-left
play_type: run
ball_carrier: HB
run_reads:
- priority: 1
  read_key: kicking tackle (LT) — kickout block on the backside EDGE
  run_to: show the toss perimeter track, then plant and run BACKSIDE behind the pulling LT through the weak-side C-gap
  notes: HB sells the toss perimeter path for two steps, then redirects backside. Follow the LT's kickout.
- priority: 2
  read_key: backside linebacker (pulling guard's target)
  run_to: if the backside LB scrapes over the LG's wrap, cut underneath into the B-gap
  notes: LG pulls and wraps the backside LB. If the LB goes over the top, the B-gap opens behind him.
- priority: 3
  read_key: backside pursuit / cutback
  run_to: if the weak-side hole clogs, press the backside A-gap behind the down-blocks
  notes: The toss show flowed the defense hard to the perimeter; if the C-gap clogs, the inside cutback is there.
motions: []
