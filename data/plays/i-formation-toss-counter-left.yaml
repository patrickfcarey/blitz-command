strengths:
- Identical pre-snap look and first-step action to Lead Toss — the defense reads toss
- Two pulling blockers (LT and LG) arriving at the backside point of attack
- The toss show flows fast linebackers to the perimeter, away from where the ball goes
- Devastating against defenses over-pursuing the toss perimeter
- QB reverse-out and playside bootleg fake hold frontside defenders
weaknesses:
- Needs Lead Toss on tape first — a cold counter fake flows no one
- Slow-developing — the LT and LG pulls need ~2.5 seconds to arrive
- Vulnerable to a backside DE shooting upfield before the LT kickout lands
- HB must read the counter correctly or the play breaks
- Backside-shaded linebackers who don't chase the toss show kill the pull lane
best_vs_defense:
- over-front (gives the down-block and pull angles)
- cover-3 with fast-flowing linebackers
- any defense over-pursuing the toss perimeter
- speed-flow defenses that chase the toss show hard
worst_vs_defense:
- bear front (a DT in every gap)
- 8-man fronts / cover-1 robber (extra defender)
- backside DE shooting upfield
- disciplined defenses drilled against counter
defensive_counters:
- counter_id: spill-the-puller
  pre_snap_look: Backside EDGE in a tight 6/7-technique with his inside shoulder cocked down and a force defender (OLB or
    SS) cheated wide outside him
  qb_key: Scan the backside edge — EDGE hand and shoulder pointed inside, force defender widened
  read_category: dl-alignment
  why: An inside-cocked backside EDGE is set to wrong-arm the LT's kickout and spill the counter wide into the pre-widened
    force defender, where the pullers have no angle.
  typical_against:
  - over-front
  - 4-3 base
  - any defense coached to spill the counter
- counter_id: backside-stay-home
  pre_snap_look: Backside LB stacked square behind the line at normal depth with his eyes inside on the guards, not shaded
    or cheated to the toss strength
  qb_key: Check the backside LB — backer squared up and not honoring the toss show
  read_category: lb-depth
  why: A squared backside LB who does not chase the toss flow stays home over the weak-side hole and fills it before the LG
    wrap arrives.
  typical_against:
  - disciplined option-fit defenses
  - any defense drilled against counter
- counter_id: 8-man-front
  pre_snap_look: 8 defenders inside the tackle box — strong safety walked down to 4-5 yards, single-high shell behind it
  qb_key: Count the box — eight, with one high safety
  read_category: box-count
  why: There aren't enough blockers for the extra box defender; someone in the counter run fit comes free unblocked.
  typical_against:
  - cover-1 robber
  - quarters with SS rolled down
common_uses:
- Counter to an established Lead Toss tendency
- 1st/2nd-and-medium with the run game established
- Short-yardage when the defense over-pursues the perimeter
- Setting up the boot and PA pass off the same toss look
philosophy: power-run
