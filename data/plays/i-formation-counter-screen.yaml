notes: |
  Running-back screen off Counter Trey. The QB reverse-out, the HB counter
  step, the FB lead, the LG and LT pulls, and the OL down-block show are all
  IDENTICAL to Counter Trey through the first two waypoints — the defense
  reads the Counter run. The HB sells the counter, then slips back behind
  the LOS to the weak side; the LT, LG, C, and FB lead the screen the other
  way. Member of the I-Formation Counter disguise family (see
  data/play-families/).

  The counter step pulls pursuit strong-side so the screen springs back
  against the grain. Mirror to counter-screen-left by flipping all
  coordinates.

verification_status: unverified
source_notes:
  - "Running-back screens off run-game action are a universal constraint concept. Authored as a disguise twin of i-formation-counter-trey — initial action (QB reverse-out, HB counter step, FB track, LG/LT pulls) deliberately mirrors the base play through the first two waypoints, and all members carry the same empty motions block."
