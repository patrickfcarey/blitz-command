play_id: singleback-trio-zone-boot
name: Zone Boot (Strong)
aliases:
  - PA Zone Bootleg
  - Zone Waggle
  - Zone Naked

formation: singleback-trio
play_type: play-action
ball_carrier: QB
primary_read: X
secondary_read: SLOT
checkdown: HB

# Identical motions to Inside Zone — the base play runs no motion, so neither
# does this twin. The shared empty motions block keeps the static pre-snap
# picture identical across the family.
motions: []

assignments:
  - player: LT
    role: pass_block
    blocking_scheme: half-roll-protection
    notes: "Show the backside zone step, then hinge to protect the backside as the QB clears toward the boot."
  - player: LG
    role: pass_block
    blocking_scheme: half-roll-protection
    notes: "Show the zone-combo, then slide protection toward the boot side."
  - player: C
    role: pass_block
    blocking_scheme: half-roll-protection
    notes: "Show the zone-combo, then slide-protect toward the boot side."
  - player: RG
    role: pass_block
    blocking_scheme: half-roll-protection
    notes: "Fire out showing the zone-combo, then slide-protect away from the boot."
  - player: RT
    role: pass_block
    blocking_scheme: half-roll-protection
    notes: "Show the zone step, then seal the run-fake-side edge."
  - player: TE
    role: pass_block
    blocking_scheme: half-roll-protection
    notes: "Run-fake-side TE — sell the edge-seal zone block, then check the backside edge as the QB clears."
  - player: X
    role: route
    route_name: drag
    depth_yd: 9
    is_primary: true
    notes: "Boot-side X — stalk-release to sell the run for a beat, then cross underneath on the drag to the boot side. The bread-and-butter throw on the move."
  - player: SLOT
    role: route
    route_name: flat
    depth_yd: 4
    notes: "Boot-side flat — the low outlet that stretches the boot-side coverage under the drag."
  - player: Z
    role: route
    route_name: comeback
    depth_yd: 14
    notes: "Backside comeback — the deeper throwback shot if the drag and flat are walled off."
  - player: QB
    role: ball_carrier
    path: [[0, 0], [-1, -1], [-2, -2], [-5, -1], [-7, 0]]
    notes: "Reverse-pivot IDENTICAL to Inside Zone for the first two steps, ride the HB fake, then keep booting to the boot side off the zone fake. Eyes on the X drag first."
  - player: HB
    role: fake
    path: [[0, 0], [2, 3], [3, 6]]
    notes: "Run the exact Inside Zone bang track for the first two waypoints to sell the handoff, then continue as if finishing the run; release late to the boot-side flat as the checkdown."

strengths:
  - Identical pre-snap look and first-step action to Inside Zone — indistinguishable from the run early
  - QB on the move — easier throws, fewer pass-rush angles
  - The reverse-pivot already sells a backside boot fake, so the boot is the most natural twin
  - PA fake holds run-flow linebackers, opening the X drag
  - High completion percentage once the zone run is respected

weaknesses:
  - Needs Inside Zone on tape first — a cold fake holds no one
  - Boot-side EDGE defender is unblocked or chipped at best
  - Field cut in half — only the boot side is live
  - Slow-developing — needs ~4 seconds to reach the launch point
  - No FB or extra back to chip the boot-side edge

best_vs_defense:
  - cover-3 with run-fit linebackers
  - 4-3 with predictable LB flow
  - any defense overcommitting to the zone run
  - single-high coverages

worst_vs_defense:
  - two-high shells with LBs at pass depth
  - safety blitz from the boot side
  - cover-2 with a corner playing edge contain
  - any defense not biting the zone fake

defensive_counters:
  - counter_id: alert-zone-no-bite
    pre_snap_look: "Linebackers aligned at full passing depth (5+ yards off the LOS) under a two-high safety shell, not crowding the box"
    qb_key: "Check the LB depth and safety shell — backers deep, two-high behind them"
    read_category: lb-depth
    why: "Linebackers already at pass depth read pass first; they will not vacate on the zone fake, so the X drag arrives into a populated zone."
    typical_against: ["cover-4", "cover-3 alert", "any defense after the zone run has been slowed"]
  - counter_id: rush-the-boot-edge
    pre_snap_look: "Boot-side EDGE in a wide-9 sprinter's stance with no blocker assigned to him"
    qb_key: "Scan the boot-side edge — EDGE flared wide-9, weight forward, uncovered"
    read_category: dl-alignment
    why: "A wide-9 EDGE in a get-off stance with no blocker crashes upfield and flushes the QB before the rollout reaches its launch point."
    typical_against: ["cover-1 with edge pressure", "any defense with a free runner off the boot side"]
  - counter_id: squat-flat-corner
    pre_snap_look: "Boot-side CB aligned tight at 5-6 yards with inside leverage and a safety capped over the top of him"
    qb_key: "Check the boot-side corner — CB squatted low and inside with a safety overlapping above"
    read_category: cb-leverage
    why: "A low, inside-leverage corner with deep safety help is free to trigger down on the SLOT flat, removing the rolling QB's safety-valve outlet."
    typical_against: ["cover-2 with hard corners", "quarters with cloud rotation"]

common_uses:
  - After establishing Inside Zone for 4+ yards
  - 1st-and-10 play-action shot
  - 3rd-and-medium moving-pocket throw
  - Red-zone moving-target passing

philosophy: zone-run
pass_concept_ref: sail
run_concept_ref: inside-zone
philosophy_ref: zone-run

era: "Universal — the bootleg off the inside-zone run is a staple of every zone-running era, modernized continuously through the Shanahan tree."

famous_examples:
  - "Mike Shanahan / Gary Kubiak bootleg game off the zone run"
  - "Kyle Shanahan-tree play-action boot packages"

