notes: |
  Play-action bootleg off Inside Zone. The QB reverse-pivot, the HB bang-track
  fake, and the OL zone-step show are all IDENTICAL to singleback-trio-inside-
  zone — and the reverse-pivot already sells a backside boot fake, so the boot
  is the most natural disguise twin of the run. The QB keeps it and boots to
  the boot side with a three-level read (X drag / SLOT flat / Z comeback).
  Member of the Singleback Trio Zone disguise family (see data/play-families/).

  Mirror to zone-boot-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "Bootleg off the inside-zone run is a universal constraint concept. Authored as a disguise twin of singleback-trio-inside-zone — initial action (QB reverse-pivot, HB bang track) deliberately mirrors the base play for the first two path waypoints."
