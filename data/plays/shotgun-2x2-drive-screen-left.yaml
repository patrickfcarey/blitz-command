strengths:
- Identical empty-motion look and identical QB first-two-step drop to the Drive base — the defense cannot pre-snap key it
- Punishes an aggressive rush by using its own upfield charge against it
- The C and RG release out front to give the TE a convoy on the catch
- Clear-out routes vacate the strong side, opening grass for the screen
- Slows a hot pass rush and changes pace against a fast-flow front
weaknesses:
- Needs the Drive concept on tape first — a cold dropback look does not pull the rush
- Timing-dependent — a mistimed release lets defenders read and sit on the screen
- Dead against a defense that rushes under control or spies the TE
- Loses yardage badly if a strong-side defender sniffs the screen and beats the linemen out
- The QB must hold the rush without taking a sack
best_vs_defense:
- aggressive four-man rushes that get upfield fast
- blitz-heavy fronts vacating the underneath
- any defense overcommitting to the Drive dropback
- man coverage with the secondary chasing the clear-out routes
worst_vs_defense:
- zone defenses with linebackers reading the QB and sitting underneath
- a spy assigned to the TE or the HB
- disciplined four-man rushes that stay in their lanes
- any defense that has stopped the screen and stopped respecting the dropback look
defensive_counters:
- counter_id: lb-spot-drop-read-screen
  pre_snap_look: Linebackers aligned at pass depth (5+ yards) squared to the QB with eyes in the backfield, not crowding the
    box
  qb_key: Check the LB depth and eyes — backers deep, squared up, reading the QB
  read_category: lb-depth
  why: Linebackers already at depth reading the QB spot-drop and pass off the clear-outs, leaving them free to trigger on
    the screen the moment the TE slips out.
  typical_against:
  - cover-3 zone
  - cover-4
  - any screen-aware defense
- counter_id: contain-rush-no-upfield
  pre_snap_look: Both EDGE defenders in square two-point stances playing contain, hands free, not in get-off sprinter's stances
  qb_key: Scan the edges — both EDGEs squared and squatting, playing contain rather than rushing
  read_category: dl-alignment
  why: A contain rush that does not sell out upfield never vacates the screen lane, so the strong-side EDGE is in position
    to beat the releasing linemen to the TE.
  typical_against:
  - bend-don't-break zone
  - any defense playing the screen
- counter_id: strongside-screen-spy
  pre_snap_look: A linebacker or safety walked into the strong-side underneath, shaded to the TE with no clear coverage or
    run-fit responsibility
  qb_key: Check the strong-side underneath — a defender shaded to the TE with no other job
  read_category: lb-depth
  why: A defender spying the TE mirrors him out of the formation and arrives at the screen catch point before the convoy of
    linemen can set up.
  typical_against:
  - cover-1 with a spy
  - screen-alert game-plans
common_uses:
- After establishing the Drive concept for completions
- 2nd-and-long / 3rd-and-long against an aggressive rush
- Slowing a hot pass rush
- Catching a blitz-heavy defense vacating the underneath
- Changing pace against a fast-flow front
