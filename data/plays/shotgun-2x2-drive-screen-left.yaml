notes: 'A tight-end screen off the Drive dropback look. The TE shows the

  shallow-cross release for one beat — identical to the Drive base''s first

  step — then settles and slips behind the LOS to the strong-side screen

  lane; the C and RG release to lead. The empty motion block and the QB''s

  first two drop steps are IDENTICAL to the Drive base, so the defense reads

  the Drive concept until the screen springs. The dropback action and the

  clear-out routes pull the rush and the coverage upfield so the screen

  releases into vacated grass. Member of the Shotgun 2x2 West Coast Drive

  disguise family (see data/play-families/).


  Mirror to drive-screen-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- Screens layered off a recognizable dropback passing concept are a universal modern constraint. Authored as a disguise twin
  of shotgun-2x2-drive — empty motions block and the QB's first two drop waypoints deliberately mirror the base play.
- Mirror of shotgun-2x2-drive-screen.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
