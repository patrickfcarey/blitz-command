notes: |
  Go / seam-read — the run-and-shoot four-verticals. The two outside WRs run
  true go routes to isolate the corners; the two slots run seam-read benders
  that adjust off the deep-middle picture (bend into the hole vs single-high,
  stay vertical vs two-high). SLOT-R's bending seam is the primary read and
  the kill shot against cover-3.

  Companion in the Run-and-Shoot disguise family (base: run-and-shoot-switch).
  The SLOT-R short-across motion and the QB's first two drop waypoints are
  identical to switch, choice, screen, and draw — to the defense, Go shows the
  same pre-snap picture as the Switch base and the Choice companion. Only the
  receivers' deep stems diverge, and by then the ball is already coming out.

  Mirror by flipping all x.

verification_status: unverified
