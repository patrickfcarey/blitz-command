play_id: run-and-shoot-go
name: Go (Strong)
aliases:
  - Run-and-Shoot Go
  - Seam Read
  - Streak Read
  - Four Verts

formation: run-and-shoot
play_type: pass
ball_carrier: QB
primary_read: SLOT-R
secondary_read: SLOT-L
tertiary_read: Z
checkdown: HB

# SLOT-R short across motion — identical to the rest of the Run-and-Shoot
# disguise family (base play: run-and-shoot-switch). The run-and-shoot
# motions a receiver every snap; the SAME motion family-wide means the
# defense cannot key it. Mandatory.
motions:
  - player: SLOT-R
    type: mandatory
    motion_type: short-across
    end_position: { x: 5.0, y: -1.0 }
    notes: "SLOT-R tightens his split with a short inside motion — identical across the whole Run-and-Shoot family so motion is never a tell."

assignments:
  - player: LT
    role: pass_block
    blocking_scheme: man-protection
    notes: "Five-man slide-less protection — pure man. Backside edge; no help, set hard."
  - player: LG
    role: pass_block
    blocking_scheme: man-protection
    notes: "Man-protect the backside A/B gap."
  - player: C
    role: pass_block
    blocking_scheme: man-protection
    notes: "Identify the Mike, protect the play-side A-gap; slide help to the most-threatened guard."
  - player: RG
    role: pass_block
    blocking_scheme: man-protection
    notes: "Man-protect the play-side B-gap."
  - player: RT
    role: pass_block
    blocking_scheme: man-protection
    notes: "Anchor the play-side edge — the throw goes deep, hold the pocket ~3.5 seconds."
  - player: X
    role: route
    route_name: go
    depth_yd: 25
    beats_coverage: both
    notes: "Outside vertical — release on the corner's outside shoulder and stack him. Lane-keeper that widens the field and isolates the corner one-on-one; the back-shoulder shot if the corner trails."
  - player: Z
    role: route
    route_name: go
    depth_yd: 25
    beats_coverage: both
    notes: "Outside vertical, strong side. Stack the corner; tertiary read on the back-shoulder if the safety has spun to the middle."
  - player: SLOT-L
    role: route
    route_name: seam
    depth_yd: 8
    beats_coverage: zone
    notes: |
      Weak-side seam-read bender. Push vertical and read the deep middle:
      - Single-high (cover-1 / cover-3) → bend into the vacated seam past the LB,
        split the hash and the numbers — uncapped down the middle.
      - Two-high (cover-2 / cover-4) → keep the seam vertical and run the safety
        out of the throwing lane (clear-out for X).
      Secondary read.
  - player: SLOT-R
    role: route
    route_name: seam
    depth_yd: 8
    is_primary: true
    beats_coverage: zone
    notes: |
      Strong-side seam-read bender — the kill route vs single-high. After the
      short motion, push vertical off the snap and read the deep middle:
      - Single-high → bend to the post-hole the FS vacated; this is the throw.
      - Two-high → stay vertical up the seam, threaten the inside shoulder of
        the strong safety.
      Primary read. The signature run-and-shoot seam.
  - player: QB
    role: ball_carrier
    path: [[0, 0], [0, -2], [0, -4]]
    notes: |
      5-step drop — IDENTICAL first two waypoints to every play in the
      Run-and-Shoot family (this is the family's shared QB drop). This is a
      seam-read four-verticals: hit the back foot and let it rip on rhythm.
      - Single-high → SLOT-R bending seam (split the safety); the primary.
      - Two-high → work the seams vertical, then the X back-shoulder go away
        from the safety rotation.
      - Pressure → HB checkdown to the strong flat (built-in outlet).
      No second-reaction hitch — the verticals are a timing throw.
  - player: HB
    role: route
    route_name: flat
    depth_yd: 3
    beats_coverage: man
    notes: "Check-release: scan for the interior blitzer first, then leak to the strong-side flat as the universal outlet if no one shows."

strengths:
  - "Pure vertical stretch — four receivers attack deep on every snap"
  - "Seam-read benders punish single-high coverage down the middle"
  - "Rhythm throw off the shared drop — ball is out fast for a deep concept"
  - "Outside go routes isolate the corners and open back-shoulder shots"
  - "Looks identical to Switch and Choice pre-snap — defense cannot pre-rotate"
  - "HB check-release gives a built-in answer to the extra rusher"

weaknesses:
  - "Five-man protection only — no chip help, fragile vs the overload"
  - "All routes are deep — nothing underneath if the verticals are capped"
  - "Two-high coverage with disciplined safeties shrinks the seam windows"
  - "QB must trust the seam-read timing — a late ball gets the slot killed"
  - "If the seam-read is wrong vs the coverage, the throw has no window"

best_vs_defense:
  - "Cover-3 (single-high — the seam-read benders split the middle)"
  - "Cover-1 (slot seam wins vs a linebacker or safety in trail)"
  - "Cover-0 / blitz (verticals beat man with no deep help, if protection holds)"
  - "Any defense that spins to single-high late"

worst_vs_defense:
  - "Cover-2 invert with safeties capping the seams"
  - "Cover-4 quarters pattern-matching the verticals"
  - "Tampa-2 (the Mike carries the inside seam deep)"
  - "Six-man pressure that beats the five-man protection"

defensive_counters:
  - counter_id: two-high-static
    pre_snap_look: "Two deep safeties at 12-14 yards, square and even over the hashes, showing no rotation"
    qb_key: "Check the safety shell — two-high and even, no spin"
    read_category: safety-shell
    why: "Two static safeties cap both seam-read benders; with no single-high hole to bend into, the primary read never uncovers and the concept has no middle-of-field answer."
    typical_against: ["cover-4", "cover-2"]
  - counter_id: tampa-mike-deep
    pre_snap_look: "The middle linebacker aligned at 6-7 yards and stacked directly over the ball, deeper than the play-side backers"
    qb_key: "Check the Mike — depth and stacked over the center, not at box depth"
    read_category: lb-depth
    why: "A deep-dropping Mike runs the inside seam vertical himself in Tampa-2, taking away the bending seam-read before the safety help is even needed."
    typical_against: ["tampa-2", "cover-2 with a deep Mike"]
  - counter_id: edge-overload
    pre_snap_look: "An extra rusher — LB or strong safety — walked up and stacked just outside the play-side edge defender, both in get-off stances"
    qb_key: "Scan the play-side edge — two defenders stacked outside the tackle"
    read_category: dl-alignment
    why: "An overloaded edge outnumbers the five-man protection; the deep verticals need ~3.5 seconds and the rush gets home before the seam-read clears."
    typical_against: ["zone-pressure looks", "cover-1 with edge pressure"]

common_uses:
  - "1st-and-10 deep shot in the run-and-shoot"
  - "2nd-and-long"
  - "2-minute drill — four verticals force the deep coverage to declare"
  - "Vs a defense showing single-high pre-snap"
  - "Hash-mark shot when the field-side seam is open"

philosophy: spread-pass
pass_concept_ref: four-verticals
philosophy_ref: run-and-shoot

era: "1980s-90s — Mouse Davis / June Jones run-and-shoot; the seam-read four-verticals is also the heart of the modern Air Raid vertical game."

famous_examples:
  - "Houston Oilers (Warren Moon hitting the seam-read benders)"
  - "Hawaii Warriors (June Jones / Colt Brennan four-verticals)"
  - "Atlanta Falcons (June Jones era)"

