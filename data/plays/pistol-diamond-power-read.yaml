notes: |
  Power Read (Inverted Veer) flips the standard zone-read mechanic — the
  HB takes the OUTSIDE path while the QB takes the INSIDE path. This
  means power-scheme blocking (down + pull) sets up the QB keeper, and
  outside-zone sets up the HB sweep.

  Best with mobile QB who's a credible runner. Cam Newton's 2010 Auburn
  season was the foundational use case.

  Mirror by flipping all x.

verification_status: unverified
