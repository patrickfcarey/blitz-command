play_id: pistol-diamond-power-read
name: Power Read (Strong)
aliases:
  - Inverted Veer
  - Power Option
  - Diamond Power-Read

formation: pistol-diamond
play_type: run
ball_carrier: QB
primary_read: HB

motions: []

assignments:
  - player: LT
    role: run_block
    blocking_scheme: down-block
    target: backside-DT
  - player: LG
    role: run_block
    blocking_scheme: pull-around
    target: playside-LB
    path: [[0, 0], [2, -0.5], [4, 0], [5, 4]]
    notes: "PULL — backside guard pulls around C, leads into the playside hole on the LB."
  - player: C
    role: run_block
    blocking_scheme: gap-block
    target: backside-A-gap
  - player: RG
    role: run_block
    blocking_scheme: down-block
    target: playside-3-tech
  - player: RT
    role: run_block
    blocking_scheme: down-block
    target: playside-DT
    notes: "PLAYSIDE EDGE IS UNBLOCKED — he is the read defender."
  - player: TE
    role: run_block
    blocking_scheme: down-block
    target: playside-LB
  - player: SE
    role: run_block
    blocking_scheme: stalk
    target: backside-cornerback
  - player: QB
    role: ball_carrier
    is_primary: true
    path: [[0, 0], [1, 1], [3, 4], [4, 8]]
    notes: |
      Power-read mechanic — INVERTED veer (read the EDGE, but HB takes the
      OUTSIDE path while QB takes the INSIDE path):
      1. READ playside EDGE.
         - EDGE plays QB / sits inside → GIVE to HB on outside-zone sweep
         - EDGE follows HB outside → KEEP and run inside through the off-tackle hole
                                    behind the pulling LG
      QB reads at the mesh point — give or keep based on EDGE's reaction.
  - player: HB
    role: ball_carrier
    path: [[0, 0], [4, 1], [7, 3], [10, 5]]
    notes: "Outside-zone sweep path — receive QB read, attack the perimeter playside."
  - player: FB-L
    role: lead_block
    target: backside-edge
    path: [[0, 0], [2, 1], [3, 1]]
    notes: "Backside FB cuts off the backside DE — secures the QB-keep cutback path."
  - player: FB-R
    role: lead_block
    target: playside-safety
    path: [[0, 0], [5, 2], [9, 5]]
    notes: "Strong FB leads through the perimeter, kicks out playside corner / SS for HB sweep."

strengths:
  - "Inverted-veer mechanic — defense must commit a defender to each option phase"
  - "Power scheme on the QB-keep path (down-blocks + pulling guard)"
  - "Outside-zone sweep on the HB path"
  - "Two ball-carrier threats from one read"
  - "Modern hybrid concept used by mobile QB offenses"

weaknesses:
  - "Requires QB who's a credible runner"
  - "Slow-developing relative to base power"
  - "EDGE who plays catch-and-release neutralizes the read"
  - "Vulnerable to scrape-exchange (LB scraping for QB on keeper)"
  - "Predictable when HB takes outside path repeatedly"

best_vs_defense:
  - "4-3 base with predictable EDGE play"
  - "cover-3 with run-fit LBs"
  - "any defense over-pursuing the run perimeter"
  - "speed-flow defenses"

worst_vs_defense:
  - "scrape-exchange (LB taking QB)"
  - "cover-1 robber (extra defender)"
  - "8-man fronts"
  - "EDGE who plays catch-and-release"

common_uses:
  - "1st-and-10 base run with mobile QB"
  - "Constraint to base inside-zone-read (different read = different look)"
  - "Red-zone scoring concept (HB sweep or QB power)"
  - "Modern spread-option base"

philosophy: spread-option
run_concept_ref: power
philosophy_ref: spread-option

era: "Early 2010s onward — Auburn under Gus Malzahn / Cam Newton popularized; widespread modern college / NFL spread."

famous_examples:
  - "Auburn under Gus Malzahn (Cam Newton 2010 NC season)"
  - "Modern NFL teams with mobile QBs (Eagles / Hurts, Ravens / Lamar)"
  - "Power 5 spread college programs"

