  notes: "Triple-option mechanic — TWO reads in sequence:\n1. DIVE READ: Read the playside DT/3-tech (or first defender outside\
    \ the down-block).\n   - DT crashes inside on FB → PULL the ball, attack the corner with HBR\n   - DT plays QB / contains\
    \ → GIVE to FB on dive (FB hits inside)\n2. PITCH READ (only if QB pulled): Read the playside EDGE / pitch defender.\n\
    \   - Defender plays QB → PITCH to HBR trailing\n   - Defender plays the pitch → KEEP the ball, turn upfield\n"
