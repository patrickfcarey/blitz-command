strengths:
- Triple threat in one play — defense must commit a defender to each option phase
- 'Numbers advantage when option works: 1 ball-carrier vs every defender'
- FB dive is hard to stop without a true 0-tech / 1-tech NT
- Pitch sweep can break for huge yardage if defense over-commits
- Misdirection built in — no pre-snap tell of which option fires
weaknesses:
- Slow-developing — needs ~2.5 sec for option to develop
- Requires QB who's a credible runner AND can pitch accurately
- Modern fast defenses with disciplined option-fits neutralize triple threat
- Vulnerable to disciplined safety in run support
- Predictable as a run-only call from this formation
best_vs_defense:
- 4-3 base with predictable EDGE play
- any defense unprepared for option football
- speed-flow defenses that over-pursue
- cover-3 with run-fit LBs
worst_vs_defense:
- disciplined option-fit defenses (academies, coach prep matters)
- cover-1 robber (safety in run support)
- scrape-exchange from playside LB
- 8-man fronts
common_uses:
- Wishbone base play — most-called concept
- 1st-and-10 base run vs 4-3 / 3-4 base defenses
- Setting up counter / midline option from same look
- Goal-line / red-zone (FB dive becomes the run)
- Triple-option base offense (Texas / Oklahoma / Alabama tradition)
philosophy: option
