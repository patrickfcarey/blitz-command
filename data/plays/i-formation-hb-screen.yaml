play_id: i-formation-hb-screen
name: HB Screen Strong
aliases:
  - HB Screen
  - Halfback Screen
  - Slip Screen

formation: i-formation
play_type: screen
ball_carrier: HB
primary_read: HB

motions: []

assignments:
  - player: LT
    role: pass_block
    blocking_scheme: invite-rusher
    notes: "Sell the rush, release downfield after a 2-count to lead the screen."
  - player: LG
    role: pass_block
    blocking_scheme: invite-rusher
    notes: "Same as LT — sell, then release as a screen blocker."
  - player: C
    role: pass_block
    blocking_scheme: invite-rusher
    notes: "Hold the rusher, then release downfield."
  - player: RG
    role: pass_block
    blocking_scheme: man-protection
    notes: "Stays in to give QB time to set up the screen."
  - player: RT
    role: pass_block
    blocking_scheme: man-protection
  - player: TE
    role: pass_block
    blocking_scheme: chip-and-release
    notes: "Chip the EDGE, then release as a window-dressing pass route."
  - player: X
    role: route
    route_name: clear-out-fly
    depth_yd: 25
    notes: "Run a fly route to clear the playside corner out of the screen area."
  - player: Z
    role: route
    route_name: clear-out-fly
    depth_yd: 25
  - player: QB
    role: ball_carrier
    path: [[0, 0], [0, -3], [0, -5]]
    notes: "5-step drop from under center to sell pass; find the LBs, deliver to HB on the screen behind LT/LG/C wall."
  - player: FB
    role: pass_block
    blocking_scheme: man-protection
    notes: "Stays in to pick up any blitzers."
  - player: HB
    role: ball_carrier
    is_primary: true
    path: [[0, 0], [1, 1], [3, 6], [5, 12]]
    notes: "Sell pass-pro for one count, drift right, then leak out and set up behind the LT/LG/C wall just behind the LOS; explode upfield with blockers after catch."

strengths:
  - Devastating against aggressive pass-rushing defenses
  - Constraint play that slows down the rush
  - Big-play potential when the wall sets up cleanly
  - Catches LBs in pass drop, opening the second level
  - WR clear-outs remove the playside corner from the screen area

weaknesses:
  - Telegraphed if QB takes a deep drop without setting up the play
  - Screen pass timing is fragile — a late HB release kills it
  - Vulnerable to zone defenders staying flat (no rush bite, no second-level bite)
  - Drop-in protection and blitzers can chase HB before the catch
  - QB-to-HB distance must be exact

best_vs_defense:
  - aggressive 4-man rush with no spy
  - cover-3 zone (LBs deep, leaves underneath)
  - any defense with a predictable pass rush
  - over-front with stretched DEs

worst_vs_defense:
  - LB blitzes from the screen side
  - cover-2 with corners squatting
  - zone-with-spy
  - any defense reading screen tells (LT/LG release timing)

defensive_counters:
  - counter_id: dl-screen-read
    pre_snap_look: "Playside DT/DE in a loose, upright, off-the-ball stance with hands ready rather than a low get-off sprinter's stance"
    qb_key: "Scan the playside DL stance — lineman upright and loose, no get-off lean"
    read_category: dl-alignment
    why: "A DL aligned upright and patient is set to read the 'happy' OL invite, peel into the screen lane, and bat the throw or meet the HB at the catch."
    typical_against: ["screen-aware defenses", "any DL coached to read 'happy' OL"]
  - counter_id: lb-flow-to-screen
    pre_snap_look: "LBs aligned shallow and shaded toward the HB's release side, tilted that way rather than squared at hook depth"
    qb_key: "Check the LB depth — backers shallow and shaded to the HB release side"
    read_category: lb-depth
    why: "LBs pre-shaded to the screen side are positioned to flow flat on the HB's leak-out and outnumber the OL wall before it can seal the second level."
    typical_against: ["screen-alert cover-3", "any defense that pattern-matches RB releases"]
  - counter_id: blitz-away-from-screen
    pre_snap_look: "Backside LB or nickel walked up tight to the LOS on the side away from the HB, with defenders overloaded to that opposite side"
    qb_key: "Count the box away from the HB — extra defender walked up on the backside"
    read_category: box-count
    why: "A walked-up overload on the side away from the screen signals a fast backside pressure that forces the throw before the HB and OL wall get into position."
    typical_against: ["fire-zone weak-side pressure", "any pressure scheme on obvious pass downs"]

common_uses:
  - 2nd-and-long / 3rd-and-long
  - After 2–3 plays of obvious passing
  - Slowing down a hot-blitzing defense
  - Constraint play after PA pass success

philosophy: any

era: "Every era — football staple."

famous_examples:
  - "Patriots screen game (Belichick / Brady era)"
  - "49ers / Mike Shanahan-tree screens"
  - "Old-school Steelers screen packages"

tags:
  - screen
  - constraint
  - high-school
  - college
  - nfl
  - any-level

notes: |
  Screen to the strong side (toward the TE; opposite the FB lead direction
  on a normal Power look). Mirror for HB Screen Weak. Timing window: HB
  releases on count 2–3 of QB's drop; LT/LG/C hold pass-pro for a 1–2
  count, then release downfield to form the wall (per standard NFL screen
  coaching). Gets blown up if any of those counts are off.

verification_status: unverified
source_notes:
  - "Standard NFL/college screen concept; documented across multiple coaching trees."
  - "Web validated 2026-04-29 — Youth Football Online 'RB Slip Screen' (https://youthfootballonline.com/running-back-screen-pass-play-rb-slip-screen/); ESPN 'Football 101: The screen package' (https://www.espn.com/college-football/columns/story?columnist=davie&page=davie10104week5); CougCenter 'Air Raid RB Screen' (https://www.cougcenter.com/air-raid-offense-playbook-mike-leach/2016/4/12/11398068/air-raid-playbook-running-back-rb-screen). Corrected OL release timing to 1–2 count (was 3–4 in earlier draft)."
