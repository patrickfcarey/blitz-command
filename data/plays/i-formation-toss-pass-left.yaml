strengths:
- Identical pre-snap look and first-step action to Lead Toss — the defense cannot tell it from the run
- Toss flow pulls linebackers to the perimeter, opening the TE drag behind them
- Keeping the RG pull sells the toss harder than a standard PA fake
- QB stays at modest depth — quicker to the throw than a full bootleg
- Attacks defenses that have over-committed to stopping the toss perimeter
weaknesses:
- Needs Lead Toss on tape first — a cold PA fake holds no one
- Pulling the RG opens a protection seam if the playside edge rush is wide
- Vulnerable to interior pressure that doesn't honor the run fake
- Field stays full-width — reads are more demanding than a half-field boot
- Slower to the throw than a quick game pass against pure pass defenses
best_vs_defense:
- cover-3 with run-fit linebackers
- 4-3 with fast-flowing, aggressive LB play
- any defense over-pursuing the toss perimeter
- single-high coverages
worst_vs_defense:
- two-high shells with LBs at pass depth
- cover-1 robber sitting in the drag window
- interior twist / A-gap pressure
- any defense that has stopped the toss and stopped respecting it
defensive_counters:
- counter_id: alert-zone-no-bite
  pre_snap_look: Linebackers aligned at full passing depth (5+ yards off the LOS) under a two-high safety shell, not crowding
    the box or cheating to the toss strength
  qb_key: Check the LB depth and safety shell — backers deep, two-high behind them
  read_category: lb-depth
  why: Linebackers already at pass depth under a two-high shell read pass first; they will not flow on the toss fake, so the
    TE drag arrives into a populated zone.
  typical_against:
  - cover-4
  - cover-3 alert
  - any defense after the toss has been slowed
- counter_id: robber-middle
  pre_snap_look: A safety dropped to 8-10 yards, squared and stationed over the middle of the field, with a two-high shell
    rolled behind him
  qb_key: Check the middle of the field — a safety squatting at 8-10 yards over the ball
  read_category: safety-shell
  why: A robber sitting in the drag's window undercuts the primary read and brackets the crosser inside-out.
  typical_against:
  - cover-1 robber
  - cover-3 buzz
- counter_id: edge-overload
  pre_snap_look: Playside EDGE in a wide get-off stance with a second rusher — a LB or strong safety — walked up and stacked
    just outside him
  qb_key: Scan the playside edge — EDGE in a sprinter's stance with a second defender stacked outside
  read_category: dl-alignment
  why: An overloaded playside edge outnumbers the protection — with the RG pulling, the rush gets home before the pocket PA's
    drop completes.
  typical_against:
  - cover-1 with edge pressure
  - zone-pressure looks
common_uses:
- After establishing Lead Toss for 4+ yards
- 1st-and-10 play-action shot
- 2nd-and-medium
- Moving the linebackers with the toss fake to open the middle
