  - college
  - nfl

notes: |
  The "run" in run-and-shoot. An HB draw off the dropback look — the SLOT-R
  motion, the QB's drop start, and the OL pass-set all show the same dropback
  picture as Switch, Choice, and Go. The OL invites the rush upfield, the QB
  sells the pass and hands off late, and the HB presses the strong-side B-gap
  through whatever crease the pass-rush lean has created. The four-wide set
  pulls defenders out of the box, so the draw hunts a light front.

  Companion in the Run-and-Shoot disguise family (base: run-and-shoot-switch).
  The SLOT-R short-across motion and the QB's first two drop waypoints are
  identical to switch, choice, go, and screen — to the defense, the draw is
  indistinguishable from the vertical passing game until the late mesh.

  Mirror by flipping all x.

verification_status: unverified
source_notes:
  - "Draw is a universal pass-game constraint; named in the draw run-concept file (data/concepts/run-concepts/draw.yaml) and listed as a canonical run-and-shoot run concept in the run-and-shoot philosophy file. The pass-set-then-drive blocking and delayed handoff follow that concept's read tree."
  - "Authored 2026-05-15 as a companion of the Run-and-Shoot disguise family — SLOT-R motion and QB drop first two waypoints deliberately mirror run-and-shoot-switch. The draw has no lead blocker (no FB/TE in 10 personnel); the run_reads reflect a one-cut interior draw read off the displaced 3-technique."
flip_reads:
- flip_id: front-overshift-callside
  pre_snap_look: Defensive front slid toward the called side — an extra down lineman or a walked-up
    linebacker puts +1 in the called-side box.
  qb_key: Count the box side to side — the called side has one more hat than the backside.
  read_category: box-count
  flip_to: mirror-play
  why: Running a gap scheme into the overshift is into the teeth; flipping the play attacks the
    lighter box with the same blocking math.
  typical_against:
  - over-front
  - shifted 4-3
- flip_id: strength-declared-to-formation
  pre_snap_look: Defense has fully declared to the formation's strength — an extra box defender
    to the strong side and a safety rolled down over it.
  qb_key: Check the strength side — both the box count and the safety roll are committed to it.
  read_category: safety-shell
  flip_to: mirror-formation
  why: When the defense keys the formation's strength, flipping the whole formation forces a re-declare
    and the run hits the side they vacated.
  typical_against:
  - cover-3 with strong roll
  - 8-man fronts
