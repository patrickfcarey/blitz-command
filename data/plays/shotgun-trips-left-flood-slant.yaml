    backside Slant-Flat.

    '
strengths:
- Two complete concepts — Flood beats zone, Slant-Flat beats man, the QB picks pre-snap
- The three-level Flood stretches a single-high zone vertically and horizontally at once
- Backside Slant-Flat is a built-in pressure outlet — the ball can come out hot
- Trips alignment forces the defense to declare its coverage and rotation
- WR3 flat is a true hot read against the blitz
weaknesses:
- Five-man protection — against a six-man pressure the ball must come out now
- Flood is a one-side concept; a defense that matches the trips with bodies removes it
- Backside Slant-Flat is only two receivers — limited if the QB hangs on it
- The deep WR1 go is mostly a clear-out — low-percentage as a primary target
- QB must diagnose the trips-side rotation correctly pre-snap
best_vs_defense:
- cover-3 (the Flood stretches the deep-third and curl-flat defender vertically)
- cover-2 (WR2 sail splits the corner and the half-field safety)
- man-free (backside Slant-Flat rub on the isolated TE)
- zone-blitz (WR3 flat is the immediate hot answer)
worst_vs_defense:
- quarters with a trips-side bracket that matches the Flood man-to-man
- cover-1 robber sitting in the backside slant window
- six-man pressure that beats the five-man protection
- any disciplined zone that does not over-rotate to the trips
defensive_counters:
- counter_id: trips-bracket-rotation
  pre_snap_look: Two-high shell rotated to the trips side — an extra underneath defender bracketing the trips with the safety
    capping it
  qb_key: Count the trips-side underneath defenders — the defense has bodies to match all three flood routes
  read_category: safety-shell
  why: The Flood must out-number the zone defenders to that side; a trips-rotated bracket matches the three-level stretch
    and removes the sail window.
  typical_against:
  - quarters with a trips check
  - cover-2 trips roll
- counter_id: backside-press-man
  pre_snap_look: Backside corner pressed hard with inside leverage on the lone TE, no safety help over the top
  qb_key: Check the backside corner — pressed and inside, sitting the slant
  read_category: cb-leverage
  why: Inside-leverage press takes away the TE slant, so the man-coverage answer to the backside is covered before the snap.
  typical_against:
  - cover-1 press
  - cover-0
- counter_id: interior-overload-pressure
  pre_snap_look: Defenders walked up over both guards and the center with a single-high look — more rushers than the five-man
    protection accounts for
  qb_key: Count the rush threats against five blockers — the box shows a free runner
  read_category: box-count
  why: Five-man protection cannot pick up a six-man interior overload; the free runner arrives before the Flood develops.
  typical_against:
  - cover-1 pressure
  - zone pressure from depth
common_uses:
- 1st-and-10 vs a known zone tendency
- 3rd-and-medium chain-mover
- Two-minute / hurry-up from a spread look
- Anytime the defense over-rotates to the trips
philosophy: pro-style
philosophy_ref: pro-style
era: Modern — the trips Flood paired with a backside quick concept is a staple of pro and college spread passing games, built
  on the Erhardt-Perkins package-of-concepts model.
