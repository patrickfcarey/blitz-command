strengths:
- Classic high-low read for the QB — beats cover-2 by design
- Two-receiver concept = simple QB read tree
- Pairs well with PA fake to amplify
- Works at any level
- Big-play potential on the corner route
weaknesses:
- Requires accurate corner-route throw (sideline + depth + air)
- Vulnerable to cover-3 (corner carries SLOT, but flat defender takes hitch)
- Limited to one side of the field
- Slow developing for the corner route (needs ~3.5 sec)
- Bracket on slot crushes it
best_vs_defense:
- cover-2 (the textbook beater)
- cover-2 invert
- cover-1 with weak-side corner playing soft
- any defense with a flat-zone corner
worst_vs_defense:
- cover-3 with hard flat defender
- cover-2 robber
- bracket coverage on slot
- quarters with poach
common_uses:
- 1st-and-10 vs cover-2 tendency
- 2nd-and-medium
- Red-zone (corner becomes a back-of-end-zone fade)
- PA shot pairing
philosophy: pro-style
era: 1980s onward — Don Coryell / Bill Walsh staple; modernized continuously.
famous_examples:
