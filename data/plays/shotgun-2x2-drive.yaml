notes: |
  The Drive concept — a Bill Walsh West Coast staple. A shallow crossing
  route (the TE drag) runs underneath a deep in-cut (the Z dig), giving the
  QB a hi-lo read on a single defender: throw the dig over him if he sits,
  the drag under him if he bails. Walsh called the hi-lo option the
  "linchpin" of the West Coast offense. Anchor of the Shotgun 2x2 West Coast
  Drive disguise family (see data/play-families/) — its empty motion block
  and the QB's three-step drop are shared by every companion.

  Mirror to drive-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "Web validated 2026-05-15 — Throw Deep Publishing 'Drive Concept' (https://throwdeeppublishing.com/blogs/football-glossary/): the Drive is a shallow cross paired with a dig forming a hi-lo read. Wikipedia 'West Coast offense' (https://en.wikipedia.org/wiki/West_Coast_offense): confirmed Bill Walsh origin and the short-timing-route emphasis. Hi-lo option routes as the West Coast 'linchpin' is standard Walsh-tree coaching material."
