  - - -5
    - -0.5
  - - -7
    - 2
  notes: PULL — identical pull track to Counter Read for the first two steps to sell the run, then log and wall the playside
    edge rusher.
- player: LG
  role: pass_block
  blocking_scheme: pull-around
  target: playside-edge
  path:
  - - 0
    - 0
  - - -2
    - -0.5
  - - -4
    - 0
  notes: PULL — identical pull track to Counter Read for the first two steps to sell the run, then wall the inside edge of
    the rush.
- player: C
  role: pass_block
  blocking_scheme: pa-counter-protection
  notes: Show the gap block, then protect the A-gaps.
- player: RG
  role: pass_block
  blocking_scheme: pa-counter-protection
  notes: Fire out showing the Counter down-block, then recover and protect the playside.
- player: RT
  role: pass_block
  blocking_scheme: pa-counter-protection
  notes: Show the down-block, then protect the playside edge.
- player: TE
  role: route
  route_name: drag
  depth_yd: 8
  notes: Show the down-block on the backside LB for one beat to sell Counter, then release across on the drag behind the run-flow
