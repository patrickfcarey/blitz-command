notes: 'Play-action pass off Counter Read. The QB counter step, the HB

  outside-zone sweep fake, the LT and LG pulls, and the OL down-block show

  are all IDENTICAL to Counter Read through the first two waypoints — the

  defense reads the Counter run. The QB then drifts away from the run

  action and throws the WR3 corner route into the void left by the

  run-flow secondary. Member of the Shotgun Trips Counter disguise family

  (see data/play-families/).


  Mirror to counter-pass-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- Play-action off the QB counter-read run is a universal constraint concept. Authored as a disguise twin of shotgun-trips-right-counter-read
  — initial action (QB counter step, HB outside-zone sweep track, LT and LG pulls) deliberately mirrors the base play through
  the first two waypoints.
- Mirror of shotgun-trips-right-counter-pass.yaml — path waypoints flipped on x; formation reference points to the mirror
  formation. Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original
  right-handed look — coordinates and paths are the source of truth.
