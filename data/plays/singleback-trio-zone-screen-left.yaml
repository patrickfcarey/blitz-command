notes: 'Slip screen off Inside Zone from the 11-personnel singleback trio set.

  The QB reverse-pivot and the HB bang track are IDENTICAL to singleback-

  trio-inside-zone for the first two path waypoints — the defense reads

  the zone run and rushes. The interior OL invites the rush; the HB sells

  the bang track, then slips back toward the LOS and catches the screen

  behind the C, LG, and RG convoy, with all three receivers clearing the

  second level. Member of the Singleback Trio Zone disguise family (see

  data/play-families/).


  Mirror to zone-screen-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- The running-back screen off run-game action is a universal modern constraint concept. Authored as a disguise twin of singleback-trio-inside-zone
  — the QB reverse-pivot and HB bang track deliberately mirror the base play's first two path waypoints exactly; the OL switch
  from zone blocking to invite-rusher / screen-release / pull is the structural change that builds the screen.
- Mirror of singleback-trio-zone-screen.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
