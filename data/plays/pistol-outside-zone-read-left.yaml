strengths:
- Combines outside zone's perimeter-stretch with read-option's free numbers advantage
- QB keeper opens the entire backside as a counter
- Stresses defensive edge discipline both sides
- HB has full outside-zone read tree
- Big-play potential when EDGE gets reached AND backside is unaccounted for
weaknesses:
- Requires QB who's a credible perimeter runner
- Slow-developing — needs ~2.5 sec to reach playside hole
- Vulnerable to scrape-exchange
- Backside DE who plays QB pinches HB's cutback option
best_vs_defense:
- 4-3 with crashing backside DE
- cover-3 with run-fit LBs
- speed-flow defenses that over-pursue
- over-front
worst_vs_defense:
- scrape-exchange
- cover-1 robber
- bear / 8-man fronts
- disciplined gap-control with edge-set DEs
common_uses:
- 1st-and-10 base call vs defenses respecting the QB run
- Setting up backside throws and bootlegs off the look
- Two-minute / hurry-up base
- College spread option base run
philosophy: spread-option
