play_id: shotgun-2x2-rpo-slant-left
name: RPO Slant (Strong) (Mirror Left)
aliases:
- Slant RPO
- Inside Zone Slant RPO
- Glance RPO
formation: shotgun-2x2-left
play_type: rpo
ball_carrier: QB
primary_read: Z
motions: []
assignments:
- player: LT
  role: run_block
  blocking_scheme: zone-step-playside
  notes: 'Run block — OL stays at LOS (RPO: no downfield release).'
- player: LG
  role: run_block
  blocking_scheme: zone-combo
- player: C
  role: run_block
  blocking_scheme: zone-combo
- player: RG
  role: run_block
  blocking_scheme: zone-combo
- player: RT
  role: run_block
  blocking_scheme: zone-combo
- player: TE
  role: run_block
  blocking_scheme: zone-step-playside
  target: edge-defender
- player: X
  role: route
  route_name: clear-out-go
  depth_yd: 18
  notes: Backside clear-out — pull weak-side corner deep.
- player: SLOT-W
  role: run_block
  blocking_scheme: stalk
  notes: Weak-side slot stalk-blocks if QB hands off; otherwise becomes outlet.
- player: Z
  role: route
  route_name: slant
  depth_yd: 5
  is_primary: true
  notes: Strong-side slant — RPO primary throw. Breaks at 5 yds, runs through the soft spot.
- player: QB
  role: ball_carrier
  path:
  - - 0
    - 0
  - - -1
    - -1
  - - 0
    - -2
  notes: 'Mesh point with HB at (1, -1), then snap back to throwing posture if pulling.

    Read the strong-side LB / nickel defender:

    - LB drops in coverage / sits → GIVE to HB on inside zone

    - LB attacks the run / vacates throwing window → PULL + throw slant to Z

    Decision at the mesh point. OL is run-blocking.

    '
- player: HB
  role: ball_carrier
  path:
  - - 0
    - 0
  - - 1
    - -1
  - - 1
    - 1
  - - 0
    - 5
  notes: Step to mesh at (-1,-1), take handoff, attack playside A/B gap. If QB pulls and throws, HB has executed his fake.
strengths:
- Defensive conflict — strong-side LB CAN'T cover both run and slant
- Quick-rhythm throw (slant breaks at 5 yds — fast release)
- Easy first-down RPO concept
- Modern foundational concept across HS/college/NFL
- Pairs with downhill inside zone for run-game balance
weaknesses:
- Requires QB read accuracy at the mesh point
- OL must NOT release downfield (penalty risk if they push past 1-3 yds)
- Defenses with disciplined LB read-keys neutralize the conflict
- Slant can be jumped by aggressive corner
- NFL ineligible-downfield rules are stricter than NCAA — limits how far OL can push
best_vs_defense:
- cover-3 with run-fit LBs
- 4-3 with crashing strong-side LB
- any defense with apex/box LB conflict on RPO reads
worst_vs_defense:
- cover-2 with squatting nickel on slant
- cover-4 with disciplined LB read-keys
- bracket on Z
- blitz from the slant side
common_uses:
- 1st-and-10 base RPO call
- 2nd-and-medium
- College spread base
- High school spread offenses (RPO has trickled down rapidly)
- Setting up vertical shots when defense over-rotates to slant
philosophy: spread-option
philosophy_ref: spread-option
era: Mid-2010s onward — RPO trend made this a base call across all levels.
famous_examples:
- Eagles under Doug Pederson / Nick Sirianni
- Chiefs under Andy Reid (Mahomes era)
- Modern Power 5 college (Alabama, Ohio State, Auburn)
- HS spread programs across the country
