- player: C
  role: pass_block
  blocking_scheme: invite-rusher
  notes: Show the gap block, hold the interior rusher, then release downfield as a screen blocker.
- player: RG
  role: pass_block
  blocking_scheme: man-protection
  notes: Show the Power down-block, then stay in to give the QB time to set up the screen.
- player: RT
  role: pass_block
  blocking_scheme: man-protection
  notes: Show the down-block, then anchor and protect the playside edge.
- player: TE
  role: pass_block
  blocking_scheme: chip-and-release
  notes: Show the kickout on the EDGE for one beat to sell Power, chip the rusher, then release as a window-dressing route.
- player: X
  role: route
  route_name: clear-out-fly
  depth_yd: 25
  notes: Stalk-release to sell run, then run a fly route to clear the playside corner out of the screen area.
- player: Z
  role: route
  route_name: clear-out-fly
  depth_yd: 25
  notes: Clear-out fly to pull the backside corner away from the screen lane.
