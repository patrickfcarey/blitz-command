notes: 'HB screen off Power-O. The QB reverse-out, the HB off-tackle track, the FB

  lead, and the LG pull are all IDENTICAL to Power-O for the first two steps

  — the defense reads Power and crashes the run fit. The HB then slips back

  behind the LOS and settles into the screen pocket behind the LT/LG/C wall.

  Member of the I-Formation Power disguise family (see data/play-families/).


  Timing window: HB slips on count 2 of the QB''s settle; LT/LG/C hold for a

  1-2 count, then release downfield to form the wall. Mirror to

  power-screen-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- Screen off the power run is a universal constraint concept. Authored as a disguise twin of i-formation-power-o — initial
  action (QB reverse-out, HB/FB tracks, LG pull) deliberately mirrors the base play's first two waypoints exactly.
- Screen OL release timing (1-2 count) follows standard NFL/college screen coaching, consistent with i-formation-hb-screen.
- Mirror of i-formation-power-screen.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
