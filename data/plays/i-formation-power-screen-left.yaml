  - - 0
    - 0
  - - -3
    - 3
  - - -4
    - 1
  - - -6
    - 6
  - - -8
    - 12
  notes: 'Run the exact Power-O off-tackle track for the first two steps to sell

    the handoff, then slip back behind the LOS and settle into the screen

    pocket behind the LT/LG/C wall; explode upfield with blockers after the

    catch.

    '
strengths:
- Identical pre-snap look and first-step action to Power-O — the defense reads Power
- Devastating against aggressive fronts that crash hard on the Power show
- The Power fake sucks linebackers downhill, vacating the screen's second level
- Pulling the LG sells Power harder than a standard screen drop
- Big-play potential when the LT/LG/C wall sets up cleanly
weaknesses:
- Needs Power-O on tape first — a cold screen fake holds no rushers
- Screen timing is fragile — a late HB slip kills the play
- Vulnerable to DL who read the 'happy' OL release and peel into the screen lane
- Drop-in protection and backside pressure can chase the HB before the catch
- QB-to-HB distance and timing must be exact
best_vs_defense:
- aggressive 4-man rush crashing on the Power show
- cover-3 zone (LBs flow downhill, leaves underneath)
- any defense overcommitting to the Power run fit
- over-front with stretched, upfield DEs
worst_vs_defense:
- LB blitzes from the screen side
- cover-2 with corners squatting in the flat
- zone-with-spy
- screen-aware defenses reading the OL release tells
defensive_counters:
- counter_id: dl-screen-read
  pre_snap_look: Playside DT/DE in a loose, upright, off-the-ball stance with hands ready rather than a low get-off sprinter's
    stance
  qb_key: Scan the playside DL stance — lineman upright and loose, no get-off lean
  read_category: dl-alignment
  why: A DL aligned upright and patient is set to read the 'happy' OL invite, peel into the screen lane, and bat the throw
    or meet the HB at the catch.
  typical_against:
  - screen-aware defenses
  - any DL coached to read 'happy' OL
- counter_id: alert-lb-no-bite
  pre_snap_look: Linebackers aligned at full passing depth (5+ yards off the LOS) under a two-high safety shell, not crowding
    the box or honoring the Power strength
  qb_key: Check the LB depth and safety shell — backers deep, two-high behind them
  read_category: lb-depth
  why: Linebackers already at pass depth read pass first; they do not flow downhill on the Power fake, so they stay over the
    screen and outnumber the OL wall.
  typical_against:
  - cover-4
  - screen-alert cover-3
  - any defense after Power has been slowed
- counter_id: blitz-away-from-screen
  pre_snap_look: Backside LB or nickel walked up tight to the LOS on the side away from the HB screen, with defenders overloaded
    to that opposite side
  qb_key: Count the box away from the HB — extra defender walked up on the backside
  read_category: box-count
  why: A walked-up overload on the side away from the screen signals a fast backside pressure that forces the throw before
    the HB and OL wall get into position.
  typical_against:
  - fire-zone weak-side pressure
  - any pressure scheme on obvious pass downs
common_uses:
- After establishing Power-O for 4+ yards
- 2nd-and-long / 3rd-and-medium
- Slowing down a defense crashing hard on Power
- Constraint play after PA pass success off the same look
philosophy: power-run
