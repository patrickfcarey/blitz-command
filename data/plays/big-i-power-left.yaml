strengths:
- Maximum blocker advantage — 7 in-line + FB lead = 8-man surface
- Both edges sealed (TE-L cuts backside, TE-R kicks out playside)
- Pulling LG + FB through the same hole = devastating point of attack
- Heavy 22 personnel forces defense into base — fewer pass-defense bodies
- Setup for PA shots off the same heavy look
weaknesses:
- Single WR limits passing constraint
- Telegraphs run intent (22 personnel)
- Vulnerable to 8-man fronts that bring extra safety
- Slow vs modern speed defenses
best_vs_defense:
- over-front
- cover-3
- 4-3 base
- single-high
worst_vs_defense:
- bear front
