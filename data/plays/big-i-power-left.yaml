- cover-1 robber
- penetrating playside DT
common_uses:
- Short-yardage and 4-minute offense
- Goal-line / red-zone power
- 1st/2nd-and-short
- Setting up PA shots from heavy
philosophy: power-run
era: Universal — heavy power has been a short-yardage staple forever.
