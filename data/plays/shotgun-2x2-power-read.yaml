play_id: shotgun-2x2-power-read
name: Power Read (Strong)
aliases:
  - Inverted Veer
  - Dash Read
  - QB Power Option

formation: shotgun-2x2
play_type: run
ball_carrier: QB
primary_read: HB

motions: []

assignments:
  - player: LT
    role: run_block
    blocking_scheme: down-block
    target: backside-DT
  - player: LG
    role: run_block
    blocking_scheme: pull-around
    target: playside-LB
    path: [[0, 0], [2, -0.5], [4, 0], [5, 4]]
    notes: "PULL — backside guard pulls around C, leads through the off-tackle hole on the playside ILB."
  - player: C
    role: run_block
    blocking_scheme: gap-block
    target: backside-A-gap
  - player: RG
    role: run_block
    blocking_scheme: down-block
    target: playside-3-tech
  - player: RT
    role: run_block
    blocking_scheme: down-block
    target: playside-DT
    notes: "PLAYSIDE EDGE IS UNBLOCKED — he is the read defender."
  - player: TE
    role: run_block
    blocking_scheme: down-block
    target: playside-LB
  - player: X
    role: run_block
    blocking_scheme: stalk
    target: backside-cornerback
  - player: Z
    role: run_block
    blocking_scheme: crack
    target: playside-safety
    notes: "Z cracks back inside on the playside safety — opens the perimeter for the HB sweep path."
  - player: SLOT-W
    role: run_block
    blocking_scheme: stalk
    target: nickel-defender
  - player: QB
    role: ball_carrier
    is_primary: true
    path: [[0, 0], [1, 1], [3, 4], [4, 8]]
    notes: |
      INVERTED-VEER mechanic — read playside EDGE:
      - EDGE plays QB / sits inside → GIVE to HB on outside-zone sweep path
      - EDGE follows HB outside → KEEP and run inside through the off-tackle hole
                                  behind the pulling LG (power-scheme blocking)
      Decision at the mesh point. QB takes the INSIDE path; HB takes the OUTSIDE.
  - player: HB
    role: ball_carrier
    path: [[0, 0], [4, 1], [7, 3], [10, 5]]
    notes: "Outside sweep path — receive QB read, attack the perimeter playside if QB gives."

strengths:
  - "Inverted-veer mechanic — defense must commit a defender to each option phase"
  - "Power scheme on QB-keep path (down-blocks + pulling guard)"
  - "Outside-zone sweep on HB path"
  - "Z crack block opens perimeter for HB sweep"
  - "Two ball-carrier threats from one read"
  - "Modern hybrid concept — used by mobile-QB offenses"

weaknesses:
  - "Requires QB who's a credible runner"
  - "Slow-developing relative to base power (LG pull needs ~2 sec)"
  - "EDGE who plays catch-and-release neutralizes the read"
  - "Vulnerable to scrape-exchange (LB scraping for QB on keeper)"
  - "Predictable when HB takes outside path repeatedly"

best_vs_defense:
  - "4-3 base with predictable EDGE play"
  - "cover-3 with run-fit LBs"
  - "any defense over-pursuing the run perimeter"
  - "speed-flow defenses"

worst_vs_defense:
  - "scrape-exchange (LB taking QB)"
  - "cover-1 robber (extra defender)"
  - "8-man fronts"
  - "EDGE who plays catch-and-release"

common_uses:
  - "1st-and-10 base run with mobile QB"
  - "Constraint to base inside-zone-read (different read = different look)"
  - "Red-zone scoring concept (HB sweep or QB power)"
  - "Modern spread-option base"

philosophy: spread-option

era: "Early 2010s onward — Auburn under Gus Malzahn / Cam Newton popularized; widespread modern college and NFL with mobile QBs."

famous_examples:
  - "Auburn under Gus Malzahn (Cam Newton 2010 NC season)"
  - "Eagles under Doug Pederson / Nick Sirianni (Jalen Hurts era)"
  - "Ravens under John Harbaugh (Lamar Jackson)"
  - "Power 5 spread college programs"

tags:
  - run
  - option
  - power-read
  - inverted-veer
  - shotgun
  - 2x2
  - 11-personnel
  - rpo-friendly
  - modern
  - college
  - nfl
  - high-school
  - spread-option

notes: |
  Power Read (a.k.a. Inverted Veer) — the modern spread-option staple.
  HB takes the OUTSIDE path (sweep) while QB takes the INSIDE path
  (power scheme with pulling guard). QB reads the playside EDGE: if
  he plays QB, give to HB outside; if he chases HB, keep inside.

  Best with mobile QB. Mirror by flipping all x.

verification_status: unverified
source_notes:
  - "Standard power-read / inverted-veer scheme; documented widely in spread-option coaching texts (Gus Malzahn lineage)."
  - "Built 2026-04-30 to round out the option family in the play library."
