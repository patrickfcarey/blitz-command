strengths:
- Heavy 22 personnel + simple man-block scheme = predictable but hard to stop
- FB ISO creates 1-on-1 vs playside LB
- Quick-hitting — ball in LB's lap in <1 sec
- Reliable for 1-3 yards in short-yardage
weaknesses:
- Won't break for big yardage vs disciplined fronts
- Vulnerable to 1-tech shooting A-gap
- Telegraphs run from 22 personnel
best_vs_defense:
- 4-3 with stretched LB
- cover-2 (no extra safety in box)
- 3-4 with under-tackle
worst_vs_defense:
- bear front
- cover-1 robber
- MIKE blitz
common_uses:
- 3rd-and-1, 3rd-and-2
- Red-zone short yardage
- 4-minute offense
