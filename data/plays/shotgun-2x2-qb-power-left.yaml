notes: 'QB Power is the modern designed-QB-power run — same down-block + pull

  blocking as I-Form Power, but with QB as the ball-carrier. HB sweeps

  to the strong side as a lead blocker (often selling a jet-fake before

  cutting up to lead). No counter step, straight downhill.


  Tush Push variant: HB and TE align behind QB and push him forward at the

  snap. Highest-percentage short-yardage play in modern football

  (Eagles ~90%+ on Tush Push 2022-).


  Mirror by flipping all x.

  '
verification_status: unverified
