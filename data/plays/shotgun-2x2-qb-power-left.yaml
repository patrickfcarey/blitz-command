strengths:
- Power-scheme blocking (down + pull) for the QB run
- TE kickout opens off-tackle hole reliably
- HB lead block adds a 7th playside blocker
- Quick-hitting — no counter step or read delay
- Simple install — same as HB Power but with QB carrying
- Goal-line / short-yardage answer with mobile QB
- 'Tush Push variant: HB+TE push QB forward (Eagles innovation)'
weaknesses:
- QB injury risk on every snap
- Slow-developing relative to QB sneak (LG pull needs ~1.5 sec)
- Predictable in goal-line / short-yardage looks
- Vulnerable to playside DT penetration before down-blocks set
- Defense knows QB is the ball-carrier if HB sweeps and doesn't fake
best_vs_defense:
- any defense over-rotating to HB (jet-action sells it)
- 4-3 over-front (gives down-block angles)
- cover-3 with single safety
- 8-man fronts where down-blocks have angles
- goal-line short-yardage situations
worst_vs_defense:
- bear front (DT in every gap)
- scrape-exchange (LB taking QB)
- cover-1 robber (extra defender in box)
- playside DT penetration
- defenses keying on QB
common_uses:
- Goal-line / short-yardage with mobile QB
- 1st-and-Goal from the 1-3 yard line
- 3rd-and-1 / 3rd-and-2 conversion
- Modern NFL Tush Push variant
- 4-minute offense with mobile QB
philosophy: power-run
era: Mid-2010s onward — designed QB power became universal in mobile-QB offenses; Tush Push variant since 2022 (Eagles).
famous_examples:
- Eagles Tush Push (Jalen Hurts era) — near-automatic in short-yardage
- Ravens (Lamar Jackson) goal-line packages
- Bills (Josh Allen) short-yardage
- Modern Power 5 college spread-option programs
