notes: 'Outside Zone from the 12-personnel symmetric singleback. The perimeter

  complement to singleback-ace-inside-zone — same personnel and flow, but

  the OL reaches playside and the back stretches the edge before making

  one cut. TE-R''s reach of the EMOL is the make-or-break block.


  Mirror to outside-zone-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- Outside / wide zone is a standard modern run concept; same scheme family as singleback-trio-outside-zone, adapted to the
  2-TE singleback-ace personnel.
- Mirror of singleback-ace-outside-zone.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
flip_reads:
- flip_id: three-tech-callside
  pre_snap_look: The 3-technique tackle and the playside linebacker are both set to the called
    side, loading the front-side gaps the zone is aiming for.
  qb_key: Find the 3-technique — it is aligned to the called side, in the zone's path.
  read_category: dl-alignment
  flip_to: mirror-play
  why: Zone run into the 3-technique blocks the penetrator head-on; flipping the zone away runs
    at the lighter shade and a cleaner front-side double.
  typical_against:
  - over-front
  - shifted 4-3
- flip_id: strength-declared-to-formation
  pre_snap_look: Defense has declared to the formation's strength — an extra box defender to the
    strong side with a safety rolled down to support it.
  qb_key: Check the strength side — the box count and the safety roll are both committed to it.
  read_category: safety-shell
  flip_to: mirror-formation
  why: Flipping the whole formation re-locates the strength call; a defense slow to re-set leaves
    the front-side gaps the zone wants unfilled.
  typical_against:
  - cover-3 with strong roll
  - quarters with strong roll
