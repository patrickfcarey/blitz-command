notes: |
  Multi-concept play: rather than a single pass_concept_ref, this play
  carries a `concepts` array — Spacing to the field (TE/SLOT-R/Z) and Dagger
  to the boundary (X/SLOT-L). The QB declares a side pre-snap; Spacing is the
  rhythm chain-mover, Dagger is the shot. Erhardt-Perkins model: a play is a
  package of concepts, each occupying part of the formation.

  Mirror to empty-left by flipping all coordinates.

