notes: |
  Slip screen off Inside Zone from the 12-personnel symmetric singleback.
  The QB reverse-pivot and the HB bang track are IDENTICAL to singleback-
  ace-inside-zone for the first two path waypoints — the defense reads the
  zone run and rushes. The interior OL invites the rush; the HB sells the
  bang track, then slips back toward the LOS and catches the screen behind
  the C, LG, and RG convoy. Member of the Singleback Ace Zone disguise
  family (see data/play-families/).

  Mirror to zone-screen-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "The running-back screen off run-game action is a universal modern constraint concept. Authored as a disguise twin of singleback-ace-inside-zone — the QB reverse-pivot and HB bang track deliberately mirror the base play's first two path waypoints exactly; the OL switch from zone blocking to invite-rusher / screen-release / pull is the structural change that builds the screen."
