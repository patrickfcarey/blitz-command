strengths:
  - "Quick-hitting downhill run (FB at 4.5 yd, ball in his hands in <1 sec)"
  - "Triple-option fake action (HBL, HBR sweeping) holds defenders"
  - "Constraint to triple-option threat (defense respects pitch, opens dive)"
  - "Reliable 3-5 yard gainer when defense over-rotates to option"
  - "Goal-line / short-yardage workhorse from wishbone"

weaknesses:
  - "Slow-developing for a true power look (FB starts 4.5 yd back)"
  - "Vulnerable to playside DT penetration before drive-blocks set"
  - "Predictable in heavy run-down situations"
  - "Won't break for big plays — straight-ahead grinder"

best_vs_defense:
  - "any defense over-rotating to the pitch threat"
  - "4-3 with stretched LBs"
  - "cover-3 with playside LB scraping for pitch"
  - "8-man fronts where FB can find a gap"

worst_vs_defense:
  - "bear front (DT in every gap)"
  - "disciplined option-fit defenses"
  - "cover-1 robber"
  - "playside DT penetration"

common_uses:
  - "Constraint to triple option (when defense overplays pitch)"
  - "Goal-line / short-yardage"
  - "3rd-and-1 / 3rd-and-2"
  - "1st-and-10 base run setup"
  - "Drive-extender on the goal line"

