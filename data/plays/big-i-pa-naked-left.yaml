strengths:
- 22 personnel sells PA aggressively (defense expects run from heavy)
- TE-R deep cross attacks the seam between safety and inside LBs
- Naked boot = no rolling pocket = QB on the move = easier throws
- Multiple outlets (TE-L drag, FB chip-release) if primary covered
weaknesses:
- QB exposed if PA fake doesn't hold defenders
- Slow-developing — needs 4 sec for TE-R to arrive
- Naked boot side has unblocked EDGE — vulnerable to chase
- Defense playing pass keys (no PA bite) makes it predictable
best_vs_defense:
- cover-3 with run-fit LBs
- cover-2 (TE attacks safety hole)
- any defense biting on PA from 22
worst_vs_defense:
- cover-2 robber
- zero blitz
- pattern-match cover-4
- backside DE chasing
common_uses:
- After 2-3 power runs from Big I (defense biting)
- 1st-and-10 setup play
- Red-zone PA shot
