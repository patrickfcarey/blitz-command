notes: 'Screen to the strong side (toward the TE; opposite the FB lead direction

  on a normal Power look). Mirror for HB Screen Weak. Timing window: HB

  releases on count 2–3 of QB''s drop; LT/LG/C hold pass-pro for a 1–2

  count, then release downfield to form the wall (per standard NFL screen

  coaching). Gets blown up if any of those counts are off.

  '
verification_status: unverified
source_notes:
- Standard NFL/college screen concept; documented across multiple coaching trees.
- 'Web validated 2026-04-29 — Youth Football Online ''RB Slip Screen'' (https://youthfootballonline.com/running-back-screen-pass-play-rb-slip-screen/);
  ESPN ''Football 101: The screen package'' (https://www.espn.com/college-football/columns/story?columnist=davie&page=davie10104week5);
  CougCenter ''Air Raid RB Screen'' (https://www.cougcenter.com/air-raid-offense-playbook-mike-leach/2016/4/12/11398068/air-raid-playbook-running-back-rb-screen).
  Corrected OL release timing to 1–2 count (was 3–4 in earlier draft).'
