play_id: i-formation-power-pass
name: Power Pass (Strong)
aliases:
  - PA Power
  - Power Play-Action
  - Power Pop Pass

formation: i-formation
play_type: play-action
ball_carrier: QB
primary_read: TE
secondary_read: FB

# Identical Z motion to Power-O — part of the family's shared pre-snap look.
# Run the motion on every member of the Power family, or on none; it must
# match across the family so the defense cannot key it.
motions:
  - player: Z
    type: optional
    motion_type: short-across
    end_position: { x: -8.0, y: -1.0 }
    notes: "Same Z shift as Power-O — keeps the pre-snap look identical across the Power family."

assignments:
  - player: LT
    role: pass_block
    blocking_scheme: pa-power-protection
    notes: "Fire out low showing the Power down-block for a beat, then anchor and protect the backside."
  - player: LG
    role: pass_block
    blocking_scheme: pull-around
    target: playside-edge
    path: [[0, 0], [2, -0.5], [4, 0]]
    notes: "PULL — identical pull track to Power-O for the first two steps to sell the run, then log and wall the playside edge rusher."
  - player: C
    role: pass_block
    blocking_scheme: pa-power-protection
    notes: "Show the gap block, then protect the A-gaps."
  - player: RG
    role: pass_block
    blocking_scheme: pa-power-protection
    notes: "Fire out showing the Power down-block, then recover and protect."
  - player: RT
    role: pass_block
    blocking_scheme: pa-power-protection
    notes: "Show the down-block, then protect the playside edge."
  - player: TE
    role: route
    route_name: drag
    depth_yd: 8
    is_primary: true
    notes: "Show the kickout block on the EDGE for one beat to sell Power, then release across on the drag — the bread-and-butter throw."
  - player: X
    role: route
    route_name: post
    depth_yd: 18
    notes: "Stalk-release to sell run, then stem to the post — the shot if the safety bites the Power fake."
  - player: QB
    role: ball_carrier
    path: [[0, 0], [-1, -1], [-2, -1], [-2, -3]]
    notes: "Reverse-out IDENTICAL to Power-O, ride the HB fake through the mesh, then settle at depth and throw. Eyes on the TE drag first."
  - player: FB
    role: route
    route_name: flat
    depth_yd: 3
    path: [[0, 0], [3, 3], [5, 3]]
    notes: "Lead through the hole exactly like Power-O for the first two steps, then leak to the playside flat as the underneath outlet."
  - player: HB
    role: fake
    path: [[0, 0], [3, 3], [4, 5]]
    notes: "Run the exact Power-O off-tackle track to sell the handoff; settle as a late outlet only if pressure clears."

strengths:
  - Identical pre-snap look and first-step action to Power-O — the defense cannot tell it from the run
  - Holds run-flow linebackers, opening the TE drag behind them
  - Keeping the LG pull sells Power harder than a standard PA fake
  - QB stays in the pocket — no edge given up, unlike a boot
  - High completion percentage once Power has been established

weaknesses:
  - Needs Power-O on tape first — a cold PA fake holds no one
  - The deeper pocket set takes longer than a boot to reach the throw
  - Vulnerable to interior pressure that doesn't honor the run fake
  - Field stays full-width — reads are more demanding than a half-field boot
  - Pulling the LG leaves a protection seam if the edge rush is wide

best_vs_defense:
  - cover-3 with run-fit linebackers
  - 4-3 with downhill, aggressive LB play
  - any defense overcommitting to Power
  - single-high coverages

worst_vs_defense:
  - two-high shells with LBs at pass depth
  - cover-1 robber sitting in the drag window
  - interior twist / A-gap pressure
  - any defense that has stopped Power and stopped respecting it

defensive_counters:
  - counter_id: alert-zone-no-bite
    pre_snap_look: "Linebackers aligned at full passing depth (5+ yards off the LOS) under a two-high safety shell, not crowding the box"
    qb_key: "Check the LB depth and safety shell — backers deep, two-high behind them"
    read_category: lb-depth
    why: "Linebackers already at pass depth under a two-high shell read pass first; they will not vacate on the Power fake, so the TE drag arrives into a populated zone."
    typical_against: ["cover-4", "cover-3 alert", "any defense after Power has been slowed"]
  - counter_id: robber-middle
    pre_snap_look: "A safety dropped to 8-10 yards, squared and stationed over the middle of the field, with a two-high shell rolled behind him"
    qb_key: "Check the middle of the field — a safety squatting at 8-10 yards over the ball"
    read_category: safety-shell
    why: "A robber sitting in the drag's window undercuts the primary read and brackets the crosser inside-out."
    typical_against: ["cover-1 robber", "cover-3 buzz"]
  - counter_id: edge-overload
    pre_snap_look: "Playside EDGE in a wide get-off stance with a second rusher — a LB or strong safety — walked up and stacked just outside him"
    qb_key: "Scan the playside edge — EDGE in a sprinter's stance with a second defender stacked outside"
    read_category: dl-alignment
    why: "An overloaded playside edge outnumbers the protection — with the LG pulling, the rush gets home before the pocket PA's deeper drop completes."
    typical_against: ["cover-1 with edge pressure", "zone-pressure looks"]

common_uses:
  - After establishing Power-O for 4+ yards
  - 1st-and-10 play-action shot
  - 2nd-and-medium
  - Red-zone moving the linebackers with the Power fake

philosophy: power-run
pass_concept_ref: sail
philosophy_ref: power-run

era: "Universal — play-action off the power run is as old as the power running game itself; every era runs a Power Pass."

famous_examples:
  - "Vince Lombardi's Packers (play-pass off the Power sweep)"
  - "Stanford under Harbaugh (PA shots off the 12-personnel power game)"

tags:
  - pa
  - play-action
  - power-run
  - pocket-pass
  - high-school
  - college
  - nfl

notes: |
  Play-action pass off Power-O. The QB reverse-out, the HB off-tackle fake,
  the FB lead, the LG pull, and the OL down-block show are all IDENTICAL to
  Power-O through the mesh — the defense reads Power. The QB then settles in
  the pocket and throws the TE drag behind the run-flow linebackers. Member
  of the I-Formation Power disguise family (see data/play-families/).

  Mirror to power-pass-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "Play-action off the power run is a universal constraint concept. Authored as a disguise twin of i-formation-power-o — initial action (QB reverse-out, HB/FB tracks, LG pull) deliberately mirrors the base play."
