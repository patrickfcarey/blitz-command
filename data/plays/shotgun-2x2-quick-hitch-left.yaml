strengths:
- Identical pre-snap look, QB drop, and early receiver releases to Stick — the defense cannot tell it apart
- All-hitch quick game punishes soft / off corners — the easiest completion in football
- Built-in hitch-seam answer — if the corner squats the hitch, the seam runs behind him
- Mirrored — the QB takes whichever hitch the leverage gives him
- Ball out on the 3-step rhythm — minimal protection exposure
weaknesses:
- Hitch is dead versus press man — no room to settle
- Limited big-play potential unless the seam hits versus single-high
- A corner who reads the QB and drives the hitch can jump it
- Cover-2 with squat corners shrinks the hitch window
- QB must confirm leverage pre-snap — a wrong read is a no-throw
best_vs_defense:
- cover-3 (hitch in front of the bailing corner, seam behind the dropping defender)
- cover-4 / quarters (hitch underneath the off corner)
- any single-high coverage — the seam is the kill shot
- off-coverage corners giving cushion to the outside WRs
worst_vs_defense:
- press man on the outside WRs
- cover-2 with corners squatting on the hitch
- bracket coverage on the outside receivers
- a disciplined robber sitting in the seam window
defensive_counters:
- counter_id: press-the-hitch
  pre_snap_look: Both outside corners pressed at the LOS on the X and Z, jammed inside leverage, no cushion
  qb_key: Check the corners — pressed at the line on the outside WRs with no cushion
  read_category: cb-leverage
  why: Press man removes the cushion the hitch needs to settle into; the receiver cannot separate at 6 yards, taking the primary
    away on the 3-step rhythm.
  typical_against:
  - cover-1
  - cover-0
  - press-quarters
- counter_id: squat-corner-trap
  pre_snap_look: Outside corners squatted at 5-7 yards depth, eyes on the QB, with two safeties capping over the top
  qb_key: Check the corner depth and eyes — squatted short, reading the QB, two-high behind
  read_category: cb-leverage
  why: A squatted corner reading the QB is set to trap and drive the hitch; with two-high safeties the seam is also capped,
    taking both legs of the hitch-seam answer.
  typical_against:
  - cover-2
  - cover-2 trap
  - quarters with squat corners
- counter_id: seam-robber
  pre_snap_look: A safety dropped to 8-10 yards, squared and stationed over the middle, with a single-high shell behind him
  qb_key: Check the middle of the field — a safety squatting at 8-10 yards over the ball
  read_category: safety-shell
  why: A robber in the middle sits in the hitch-seam window and undercuts the seam, removing the answer to a squatted corner
    and forcing the QB off rhythm.
  typical_against:
  - cover-1 robber
  - cover-3 buzz
common_uses:
- 3rd-and-short / 3rd-and-medium
- 1st-down chains versus off coverage
- Quick-game tempo
- Beating a soft-corner zone shell
- Changing the picture after Stick has been on tape
