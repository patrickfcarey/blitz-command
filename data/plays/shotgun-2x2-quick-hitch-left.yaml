notes: 'West Coast hitch / hitch-seam quick-game play disguised off Stick. The QB''s

  3-step drop is IDENTICAL to Stick, and the receivers take the same early

  vertical releases (X and Z stem vertical exactly like the base clear-out

  and option routes, TE pushes vertical exactly like the base clear-out, the

  slot seams stem vertical exactly like the base option route) before the

  routes branch — the outside WRs settle into hitches, the slots bend into

  seams. The defense reads the same picture as Stick. Member of the Shotgun

  2x2 Quick-Game disguise family (see data/play-families/).


  Mirror to quick-hitch-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- The hitch and hitch-seam quick game are textbook West Coast answers to soft coverage — an easy completion versus off corners
  with a built-in seam answer versus a squatted corner. Authored as a disguise twin of shotgun-2x2-stick — the QB drop's first
  two waypoints are identical to the base play, all members carry the same empty motions block, and the receivers' early release
  waypoints match the base play's vertical stems before the routes branch.
- Mirror of shotgun-2x2-quick-hitch.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
