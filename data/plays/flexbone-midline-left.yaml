  - - 0
    - 5
  - - 0
    - 8
  notes: MIDLINE dive — straight-ahead path through the A-gap, NOT angled. The 0-tech/1-tech NT is the read; if he stays home,
    FB hits A-gap; if he crashes, QB pulls.
- player: SLOT-L
  role: run_block
  blocking_scheme: arc-block
  target: backside-safety
- player: SLOT-R
