strengths:
- Reads the NT instead of the EDGE — defeats 3-4 / odd fronts where EDGE is elusive
- Constraint to inside-veer (when defense moves NT to read EDGE, midline punishes)
- Same triple-option mechanic, different read defender
- Hard for defense to scout — looks identical to inside-veer pre-snap
- FB dive is straight ahead — quicker hitting than inside-veer
weaknesses:
- Requires QB to read the NT accurately — different sight picture than EDGE read
- Vulnerable to disciplined NT play (sits and plays catch-and-release)
- Slow-developing for the pitch phase
- Won't work without a credible run-FB
best_vs_defense:
- 3-4 base with 0-tech NT (NT is the read)
- any front with a stout 0-tech / 1-tech NT
- defenses that have shown EDGE-read scrape on inside-veer
- cover-3 with run-fit ILBs
worst_vs_defense:
- 4-3 with 1-tech / 3-tech alignment (no true 0-tech NT to read)
- disciplined NT play (sits and reads)
- scrape-exchange from ILBs
- cover-1 robber
common_uses:
- Constraint to inside-veer (different read = different look)
- vs 3-4 base defenses
- 1st/2nd-and-medium when NT shows aggression
- Flexbone constraint package
philosophy: option
era: 1980s onward — Air Force / Navy systems; modernized in service-academy football.
famous_examples:
- Air Force Falcons (Fisher DeBerry / Troy Calhoun)
- Navy Midshipmen (Paul Johnson)
- Georgia Tech under Paul Johnson
