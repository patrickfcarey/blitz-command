notes: 'Midline Triple changes the dive read from the EDGE (inside-veer) to the

  NT (midline). Same option mechanic — FB dive, QB read, pitch to SLOT-R —

  but the read defender is the inside DL instead of the outside one.


  Best vs 3-4 / odd fronts with a true 0-tech NT. Pairs with inside-veer

  as a constraint (defense that scrapes EDGE on inside-veer can''t also

  scrape NT on midline — they''re different motions).


  Mirror by flipping all x.

  '
verification_status: unverified
