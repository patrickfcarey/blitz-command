  notes: "TWO READS sequence — but the dive read is the NT (not the EDGE):\n1. DIVE READ: Read the playside 0-tech / 1-tech\
    \ NT (the unblocked DT).\n   - NT crashes on FB / squeezes A-gap → PULL, attack the playside corner with SLOT-R\n   -\
    \ NT plays QB / sits → GIVE to FB on midline dive (FB hits A-gap)\n2. PITCH READ (only if QB pulled): Read the playside\
    \ force defender.\n   - Defender plays QB → PITCH to SLOT-R\n   - Defender plays the pitch → KEEP and turn upfield\n"
