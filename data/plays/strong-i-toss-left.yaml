strengths:
- FB pre-aligned strong = shorter path to perimeter lead block
- Speed advantage with HB receiving the ball on the move
- Multiple lead blockers (FB + pulling RG)
- Forces defense to honor the perimeter — opens cutbacks if defense overflows
weaknesses:
- Slow-developing — needs ~2.5 sec for HB to reach the corner
- Vulnerable to playside DE shooting upfield
- Cornerback who avoids crack-block can chase HB down
- Predictable from Strong I tendency
best_vs_defense:
- 4-3 with predictable EDGE
- cover-3 with stretched playside
- cover-2 with squatting corners
worst_vs_defense:
- cover-1 with EDGE squeezing
- bear front
- playside blitz
common_uses:
- 1st/2nd-and-medium perimeter run
- Setting up reverses and counters
- Quick HB-to-space concept
