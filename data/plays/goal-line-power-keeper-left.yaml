notes: 'QB keep off the Goal Line Power action. The QB reverse-out, the HB

  off-tackle fake, the FB lead, the LG pull, and the playside OL

  down-block / TE-R kickout are all IDENTICAL to Goal Line Power — the

  defense reads Power and flows to the HB. The one structural change is

  TE-L: instead of down-blocking the backside edge, he kicks it out to

  open the QB keeper lane around the backside corner. Keeping the QB adds

  a ball-carrier and leaves the defense one fitter short. Member of the

  Goal Line Power disguise family (see data/play-families/).


  Mirror to goal-line-power-keeper-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- The QB keep off a power fake is a universal short-yardage constraint concept. Authored as a disguise twin of goal-line-power
  — the QB/HB/FB initial action (reverse-out, off-tackle track, FB lead, LG pull) deliberately mirrors the base play's first
  two waypoints exactly; only TE-L's assignment changes (down-block to kickout) to open the keeper lane.
- Mirror of goal-line-power-keeper.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
flip_reads:
- flip_id: front-overshift-callside
  pre_snap_look: Defensive front slid toward the called side — an extra down lineman or a walked-up
    linebacker puts +1 in the called-side box.
  qb_key: Count the box side to side — the called side has one more hat than the backside.
  read_category: box-count
  flip_to: mirror-play
  why: Running a gap scheme into the overshift is into the teeth; flipping the play attacks the
    lighter box with the same blocking math.
  typical_against:
  - over-front
  - shifted 4-3
- flip_id: strength-declared-to-formation
  pre_snap_look: Defense has fully declared to the formation's strength — an extra box defender
    to the strong side and a safety rolled down over it.
  qb_key: Check the strength side — both the box count and the safety roll are committed to it.
  read_category: safety-shell
  flip_to: mirror-formation
  why: When the defense keys the formation's strength, flipping the whole formation forces a re-declare
    and the run hits the side they vacated.
  typical_against:
  - cover-3 with strong roll
  - 8-man fronts
