  notes: '3-step rhythm from shotgun depth. Triangle read on the trips side:

    corner (HI) / snag (MID) / flat (LO).

    Pre-snap leverage tells you which leg is open.

    - Flat defender squats on flat → throw corner over the top

    - Flat defender expands to corner → throw snag underneath

    - Both bracket the snag → throw the flat for easy yards

    '
