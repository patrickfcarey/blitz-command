  role: pass_block
  blocking_scheme: man-protection
  notes: Pass-protect against weak-side blitz; stays in unless pressure clears.
strengths:
- Three-on-two horizontal stretch on the trips-side underneath defenders
- Always one open against any single coverage
- Quick 3-5 step rhythm — ball out fast
- WR3 flat is a safe outlet for easy first downs
- Pairs naturally with backside drag or checkdown if trips covered
- Bunch variant creates natural picks vs man — even harder to defend
weaknesses:
- Bracket coverage on snag receiver shuts down the primary
- Limited big-play potential (corner route maxes ~12 yds)
- Banjo / pattern-match coverage can disrupt the triangle
- Backside (TE drag) is slow developing if QB has to work weak
- Defense playing zero blitz to the trips side neutralizes timing
best_vs_defense:
- cover-3 (snag sits in soft spot, corner over flat)
- cover-2 (corner over flat-zone defender, snag underneath)
- cover-1 man (rubs available between WR2 and WR3)
- any defense with a single flat defender
worst_vs_defense:
- bracket coverage on the snag receiver
- banjo / pattern-match
- cover-2 robber
- blitz from the trips side
common_uses:
- 3rd-and-medium (4–7 yards)
- 1st down rhythm play
- Anti-blitz hot read
- Red-zone short-corner option
- 2-minute drill
