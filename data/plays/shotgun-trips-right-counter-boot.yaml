notes: |
  Play-action bootleg off Counter Read. The QB counter step, the HB
  outside-zone sweep fake, and the LT and LG pulls are all IDENTICAL to
  Counter Read through the first two waypoints — the defense reads the
  Counter run. Counter Read already sells a backside boot fake, so the
  boot is the most natural disguise twin of the run. The QB keeps it and
  boots backside (away from the trips side) with a three-level read (TE
  drag / WR3 corner / HB checkdown). Member of the Shotgun Trips Counter
  disguise family (see data/play-families/).

  Mirror to counter-boot-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "Bootleg off the QB counter-read run is a universal constraint concept. Authored as a disguise twin of shotgun-trips-right-counter-read — initial action (QB counter step, HB outside-zone sweep track, LT and LG pulls) deliberately mirrors the base play through the first two waypoints."
