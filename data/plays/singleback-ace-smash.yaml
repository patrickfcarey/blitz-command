notes: |
  Smash from the 12-personnel singleback — a hi-lo on the strong-side
  corner: Z hitch at 6 yards beneath TE-R's corner route at 12. The QB
  reads the corner and throws the route he leaves open. Running the corner
  from an in-line TE gives a tighter, quicker break than a slot WR. The
  5-step-drop pass-game answer for the singleback-ace section.

  Mirror to smash-weak by flipping all coordinates.

