notes: 'HB slip screen off the run-and-shoot dropback look. The SLOT-R motion, the

  QB''s drop start, and the OL pass-set all show the defense the same dropback

  picture as Switch, Choice, and Go — the rush teed up for the vertical game

  is exactly what this play punishes. The HB sells protection, slips to the

  strong flat, and catches it behind the LT/LG/C wall while the outside go

  routes clear both corners.


  Companion in the Run-and-Shoot disguise family (base: run-and-shoot-switch).

  Timing window: HB slips on the QB''s 1-count downfield hold; LT/LG/C invite

  the rush for a 1-count, then release to form the wall.


  Mirror by flipping all x.

  '
verification_status: unverified
source_notes:
- Screen off a dropback pass game is a universal constraint concept; the run-and-shoot screen is named in the run-and-shoot
  philosophy file (data/concepts/philosophies/run-and-shoot.yaml) as a canonical run/constraint concept.
- Authored 2026-05-15 as a companion of the Run-and-Shoot disguise family — SLOT-R motion and QB drop first two waypoints
  deliberately mirror run-and-shoot-switch. OL invite-and-release timing (1-count) follows standard screen coaching, consistent
  with i-formation-power-screen.
- Mirror of run-and-shoot-screen.yaml — path waypoints flipped on x; formation reference points to the mirror formation. Routes
  auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed look
  — coordinates and paths are the source of truth.
