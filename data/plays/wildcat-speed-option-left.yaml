strengths:
- Two ball-carrier threats from one direct-snap look
- EDGE defender forced into impossible read
- Extra blocker advantage (no QB intermediary)
- Heritage option-football mechanic
weaknesses:
- Pitch timing is fragile — late pitch = TFL
- Defense knows it's a run from Wildcat
- Modern fast EDGE play forces tough RB1 reads
- Predictable in any non-short-yardage situation
best_vs_defense:
- over-front with crashing playside DE
- speed-flow defenses
- defenses unprepared for option
worst_vs_defense:
- disciplined option-aware defenses (academy programs)
- cover-1 robber
- 8-man fronts
common_uses:
- Constraint to Wildcat Power
- 1st-and-medium surprise option
- Setting up future passing
philosophy: speed-option
era: Modern Wildcat option — speed option mechanic dates to 1960s, applied to direct-snap variant.
famous_examples:
- Air Force / Navy option packages (with Wildcat-style direct snap)
- HS option offenses
