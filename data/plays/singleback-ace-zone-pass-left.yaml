source_notes:
- Play-action off the inside-zone run is a universal constraint concept. Authored as a disguise twin of singleback-ace-inside-zone
  — initial action (QB reverse-pivot, HB bang track) deliberately mirrors the base play for the first two path waypoints.
- Mirror of singleback-ace-zone-pass.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
