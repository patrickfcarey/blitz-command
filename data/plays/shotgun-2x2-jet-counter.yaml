play_id: shotgun-2x2-jet-counter
name: Jet Counter (Strong)
aliases:
  - Jet Fake Counter
  - QB Counter off Jet
  - Fly Sweep Counter

formation: shotgun-2x2
play_type: run
ball_carrier: QB

# Jet motion block — BYTE-IDENTICAL across every member of the Jet family
# (shotgun-2x2-jet-sweep base + jet-counter + jet-pop-pass + jet-boot). SLOT-W
# motions full-speed across the formation and the ball is snapped while she
# is still moving. This is the disguise thread: the defense sees the exact
# same jet motion on the sweep, the counter, the pop pass, and the boot.
motions:
  - player: SLOT-W
    type: mandatory
    motion_type: jet
    end_position: { x: 6.0, y: -2.0 }
    snap_on_motion: true
    notes: |
      SLOT-W motions full-speed across the formation. Ball is snapped to QB
      just as SLOT-W reaches the snap point. QB hands off to SLOT-W in
      flight — the runner is already at full speed.

run_reads:
  - priority: 1
    read_key: pulling RG (backside puller)
    run_to: follow the RG's kickout on the backside edge, then bend up off his hip
    notes: "The QB fakes the jet handoff to SLOT-W, then plants and works behind the RG pulling the other way."
  - priority: 2
    read_key: backside linebacker
    run_to: if the backside LB scrapes over the top, cut underneath him inside the kickout
    notes: "If the backside LB fast-flows with the jet, the counter hole stays clean; if he stays home, bend inside his block."
  - priority: 3
    read_key: frontside cutback (strong A-gap)
    run_to: if the backside is walled off, cut back behind the center into the strong A-gap
    notes: "Last resort — only hit the cutback if the entire backside is collapsed."

assignments:
  - player: LT
    role: run_block
    blocking_scheme: down-block
    target: backside-3-tech
    notes: "Down block — the PLAYSIDE tackle for the counter. Seal the 3-tech inside; the counter goes off your edge."
  - player: LG
    role: run_block
    blocking_scheme: down-block
    target: backside-DT
    notes: "Down block on the backside DT — counter blocking seals the interior toward the counter side."
  - player: C
    role: run_block
    blocking_scheme: gap-block
    target: strong-A-gap
    notes: "Backside scoop toward the strong side, then climb to the frontside LB."
  - player: RG
    role: run_block
    blocking_scheme: pull-around
    target: backside-edge
    path: [[0, 0], [-2, -0.5], [-4, 0], [-5, 2]]
    notes: "PULL — strong-side guard pulls and kicks out the weak-side EDGE, opening the counter hole away from the jet motion."
  - player: RT
    role: run_block
    blocking_scheme: zone-reach-playside
    notes: "Reach-step playside for a beat to sell the jet-sweep flow, then hinge down to wall the strong-side pursuit chasing the jet."
  - player: TE
    role: run_block
    blocking_scheme: reach-block
    target: strong-edge
    notes: "Reach the strong EDGE for one beat to sell the Jet Sweep, then hinge down to wall the strong-side EDGE off the counter."
  - player: X
    role: run_block
    blocking_scheme: stalk
    target: backside-cornerback
    notes: "Stalk the weak-side corner — the playside corner for the counter."
  - player: Z
    role: run_block
    blocking_scheme: stalk
    target: strong-cornerback
    notes: "Stalk the strong corner — occupies him as the jet flow runs his way."
  - player: SLOT-W
    role: fake
    notes: "Take the jet motion full-speed and run the Jet Sweep path as a pure fake — sell the sweep to pull the strong-side pursuit."
  - player: QB
    role: ball_carrier
    is_primary: true
    path: [[0, 0], [-2, -1], [-4, 2], [-6, 6]]
    notes: |
      DESIGNED QB COUNTER off the jet fake — first two waypoints IDENTICAL
      to Jet Sweep. Catch the snap and ride the jet mesh exactly like the
      handoff on Jet Sweep, then pull it, plant, and counter back to the
      weak side behind the pulling RG, bending up off his kickout. No read
      — the QB is the ball-carrier the whole way.
  - player: HB
    role: fake
    notes: "Fake an inside-zone path opposite the jet — IDENTICAL to the Jet Sweep HB fake — holding the backside LBs and DE before the counter hits behind them."

strengths:
  - Identical jet motion and first-step QB action to Jet Sweep — the defense cannot tell it from the sweep
  - The jet motion plus the sweep fake pulls fast-flow defenders away from the counter hole
  - Pulling RG kickout gives the QB a defined backside edge
  - Punishes a defense that chases the jet motion hard
  - Hits behind the over-pursuit a productive jet sweep creates

weaknesses:
  - Needs Jet Sweep on tape first — a cold jet fake holds no one
  - Mandatory motion = fragile timing; mistime the snap and the play breaks
  - Slow-developing — the RG pull and the QB plant-and-go take time
  - QB injury risk on every snap as the designed ball-carrier
  - Vulnerable to a backside EDGE who ignores the jet and squeezes the counter

best_vs_defense:
  - fast-flow zone defenses that chase the jet motion
  - 4-3 with aggressive, motion-keying linebackers
  - cover-3 with run-fit linebackers flowing to the sweep
  - any defense over-pursuing the jet sweep

worst_vs_defense:
  - disciplined gap-sound fronts that do not over-pursue the motion
  - bear front with a defender in every gap
  - scrape-exchange taking the QB on the counter
  - 8-man fronts with no backside counter room

defensive_counters:
  - counter_id: backside-edge-squeeze
    pre_snap_look: "Weak-side EDGE squeezed down in a tight inside shade with a square two-point stance, hands free, not flared wide"
    qb_key: "Scan the weak-side EDGE — squeezed inside, squared up, feet quiet"
    read_category: dl-alignment
    why: "A squeezed weak-side EDGE ignores the jet flow and crashes flat under the RG kickout, closing the counter hole before the puller defines an edge."
    typical_against: ["over-front", "4-3 base", "any defense with counter-game rules"]
  - counter_id: motion-disciplined-lb
    pre_snap_look: "Backside linebacker stays squared with quiet feet as SLOT-W motions, not flowing — and is cheated outside toward the counter edge"
    qb_key: "Check the backside LB as the jet motions — feet quiet, not flowing, shaded outside"
    read_category: lb-depth
    why: "A backside LB who does not chase the jet and is already shaded to the counter edge fills the counter hole unblocked instead of being pulled away by the motion."
    typical_against: ["motion-key zone defenses", "stack 4-3", "QB-run game-plan defenses"]
  - counter_id: extra-box-defender
    pre_snap_look: "8 defenders inside the tackle box — a safety walked down to 6-8 yards, single-high shell behind it"
    qb_key: "Count the box — eight, with one high safety"
    read_category: box-count
    why: "The QB is the runner, so the offense gains no number — the extra box defender comes free unblocked at the counter point of attack."
    typical_against: ["cover-1 robber", "quarters with a safety rolled down", "8-man fronts"]

common_uses:
  - Constraint to Jet Sweep once the defense fast-flows the motion
  - 1st-and-10 base run with a mobile QB
  - 2nd-and-medium changeup against a motion-chasing defense
  - Red-zone backside scoring concept
  - Modern spread-option base from a 2x2 look

philosophy: speed-option
run_concept_ref: counter
philosophy_ref: spread-option

era: "Mid-2010s onward — counters off jet motion grew with the spread perimeter run game as a constraint on the jet sweep."

famous_examples:
  - "Modern Power 5 spread offenses pairing jet sweep with QB counter (Auburn, Ole Miss)"
  - "49ers under Kyle Shanahan — counter action off the jet/fly-sweep motion"

