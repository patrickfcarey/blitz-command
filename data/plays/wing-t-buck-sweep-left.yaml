    - 1
  - - -7
    - 4
  - - -10
    - 9
  notes: Take the handoff, follow the two pulling guards around the playside edge — get to the corner.
strengths:
- Two pulling guards = numbers advantage at the corner
- Triple-threat fake (FB belly + bootleg-side QB) holds backside defenders
- Misdirection makes the play look identical to Belly and Trap pre-snap
- Edge angles are devastating with WING kicking out
- Wing-T signature play — defines the offense
weaknesses:
- Slow-developing — needs ~2.5-3 sec to reach the corner
- Requires two guards who can pull (athletic OL)
- Vulnerable to playside DE / EDGE shooting upfield
- Modern speed defenses with disciplined edge fits neutralize
- HB depth and timing must be exact with the pullers
best_vs_defense:
- 4-3 with predictable LB flow
- cover-3 with run-fit LBs
- over-front
- defenses unprepared for misdirection
worst_vs_defense:
- 4-6 / bear front
- cover-1 with safety in the box
- aggressive playside DE penetration
- any defense with film prep on Wing-T tendencies
common_uses:
- Base outside run in Wing-T offense
- Setting up Trap / Belly / Waggle off the same look
- Short-yardage perimeter run
- 1st-and-10 base call
- HS / youth football base run
