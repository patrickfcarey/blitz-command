notes: 'Wing-T''s signature play. Two pulling guards (LG and RG) is unusual for any

  modern run scheme but is the defining feature here. The QB reverse-out and

  FB belly fake are critical — without them, the LBs scrape and kill the

  play. Mirror to "Buck Sweep Left" by flipping all x; the play swaps which

  guard pulls first and which side gets the WING.

  '
verification_status: unverified
source_notes:
- 'Web validated 2026-04-29 — Youth Football Online ''Wing T Buck Sweep'' (https://youthfootballonline.com/wing-t-formation-buck-sweep-play/);
  Throw Deep Publishing ''Wing-T Offense In-Depth'' (https://throwdeeppublishing.com/blogs/football-glossary/the-wing-t-offense-an-in-depth-guide);
  USA Football ''Reflections from a Wing T guru'' (https://blogs.usafootball.com/blog/6633/reflections-from-a-wing-t-guru-part-1).
  Confirmed: two pulling guards, FB belly fake, QB reverse-out, HB follows pullers around playside edge.'
- Mirror of wing-t-buck-sweep.yaml — path waypoints flipped on x; formation reference points to the mirror formation. Routes
  auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed look
  — coordinates and paths are the source of truth.
flip_reads:
- flip_id: force-set-callside
  pre_snap_look: The playside force defender (corner or outside linebacker) is aligned tight and
    downhill with run support set hard to the called side.
  qb_key: Check the playside edge — force defender squatted and downhill, no cushion.
  read_category: cb-leverage
  flip_to: mirror-play
  why: A perimeter run into a set force defender has no edge; flipping to the side with a soft,
    depth-aligned corner gives the play the room it needs.
  typical_against:
  - cover-2 with hard corners
  - cloud support
- flip_id: alley-stacked-formation
  pre_snap_look: Defense has stacked the alley to the formation's strength — an extra defender
    plus a rolled safety filling the strong-side perimeter.
  qb_key: Check the strong-side alley — it is stacked while the backside alley is open.
  read_category: box-count
  flip_to: mirror-formation
  why: Flipping the formation relocates the strength and the run target away from the stacked
    alley, forcing the defense to re-rotate or surrender the edge.
  typical_against:
  - quarters with strong roll
  - 8-man fronts
