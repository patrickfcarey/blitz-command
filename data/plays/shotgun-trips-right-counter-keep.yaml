notes: |
  Designed QB counter keep off Counter Read. The QB counter step, the HB
  outside-zone sweep fake, the LT and LG pulls, and the OL down-block show
  are all IDENTICAL to Counter Read through the first two waypoints — the
  defense reads the counter option. The difference is that the playside
  EDGE is BLOCKED by the LT kickout (not left as a read), the QB keeps
  every time, and the HB sweep is a pure fake. Member of the Shotgun Trips
  Counter disguise family (see data/play-families/).

  This is the answer to a defense that scrape-exchanges the Counter Read —
  the QB no longer has to read the EDGE. Mirror to counter-keep-left by
  flipping all coordinates.

verification_status: unverified
source_notes:
  - "The designed QB counter keep off a counter-read option is a universal modern constraint concept. Authored as a disguise twin of shotgun-trips-right-counter-read — initial action (QB counter step, HB outside-zone sweep track, LT and LG pulls) deliberately mirrors the base play through the first two waypoints."
flip_reads:
- flip_id: keys-set-callside
  pre_snap_look: The dive key and the pitch key (first two defenders outside the tackle) are both
    aligned hard and downhill to the called side.
  qb_key: Scan the called-side edge — both option keys are squatted and committed, no width left
    to read.
  read_category: dl-alignment
  flip_to: mirror-play
  why: An option into keys that are already set gives the QB no honest read; flipping the option
    attacks the side where the keys still have to choose.
  typical_against:
  - over-front
  - cover-1 with edge pressure
- flip_id: strength-declared-to-formation
  pre_snap_look: Defense has declared to the formation's strength — an extra perimeter defender
    and a safety rolled down to the strong side.
  qb_key: Check the strength side — the extra hat and the safety roll are committed to it.
  read_category: safety-shell
  flip_to: mirror-formation
  why: Flipping the formation moves the option away from the loaded perimeter and forces the defense
    to re-declare its keys.
  typical_against:
  - cover-3 with strong roll
  - 8-man fronts
