notes: |
  Running-back screen off Counter Read. The QB counter step, the HB
  outside-zone sweep release, the LT and LG pulls, and the OL down-block
  show are all IDENTICAL to Counter Read through the first two waypoints —
  the defense reads the Counter run. The HB sells the sweep, then slips
  back behind the LOS to the backside; the LT, LG, and C lead the screen
  the other way. Member of the Shotgun Trips Counter disguise family (see
  data/play-families/).

  The counter action pulls pursuit toward the sweep so the screen springs
  back against the grain. Mirror to counter-screen-left by flipping all
  coordinates.

verification_status: unverified
source_notes:
  - "Running-back screens off run-game action are a universal modern constraint concept. Authored as a disguise twin of shotgun-trips-right-counter-read — initial action (QB counter step, HB outside-zone sweep release, LT and LG pulls) deliberately mirrors the base play through the first two waypoints."
