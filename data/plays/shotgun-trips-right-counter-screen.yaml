play_id: shotgun-trips-right-counter-screen
name: Counter Screen (Trips Right)
aliases:
  - Counter-Q Screen
  - Counter Read Throwback Screen
  - Trips Counter HB Screen

formation: shotgun-trips-right
play_type: screen
ball_carrier: HB
primary_read: HB
checkdown: TE

# Identical motion to Counter Read — the base play carries an empty motions
# block, so this twin does too. Running no motion on every member of the
# Counter family keeps the pre-snap look identical so the defense cannot
# key it.
motions: []

assignments:
  - player: LT
    role: pass_block
    blocking_scheme: pull-around
    target: screen-alley
    path: [[0, 0], [3, -0.5], [5, -0.5], [4, 2]]
    notes: "PULL — identical pull track to Counter Read for the first two steps to sell the run, then peel back and lead the screen, walling the first defender in the backside alley."
  - player: LG
    role: pass_block
    blocking_scheme: pull-around
    target: screen-alley
    path: [[0, 0], [2, -0.5], [4, 0], [2, 3]]
    notes: "PULL — identical pull track to Counter Read for the first two steps to sell the run, then turn back and lead the screen on the second alley defender."
  - player: C
    role: pass_block
    blocking_scheme: screen-release
    target: screen-alley
    notes: "Show the gap block, sell the protection for a beat, then release flat to the backside as the point blocker out front of the screen."
  - player: RG
    role: pass_block
    blocking_scheme: invite-rusher
    notes: "Show the Counter down-block, set the protection, then deliberately let the rusher upfield past the screen — sell the pass-set."
  - player: RT
    role: pass_block
    blocking_scheme: invite-rusher
    notes: "Show the down-block, set the protection, then invite the playside rusher upfield away from the screen."
  - player: TE
    role: route
    route_name: drag
    depth_yd: 6
    notes: "Show the down-block on the backside LB for one beat to sell Counter, then release across as the outlet if the screen is read and blown up."
  - player: WR1
    role: route
    route_name: clearout-go
    depth_yd: 20
    notes: "Release vertically to clear the playside corner and safety away from the screen side."
  - player: WR2
    role: route
    route_name: clearout-go
    depth_yd: 20
    notes: "Release vertically to clear coverage and pull defenders away from the backside screen."
  - player: WR3
    role: route
    route_name: clearout-slant
    depth_yd: 6
    notes: "Crack-release to sell Counter for a beat, then run a clearing slant to drag the nickel away from the screen lane."
  - player: QB
    role: ball_carrier
    path: [[0, 0], [-1, 0], [-3, -2], [-5, -1]]
    notes: "First two waypoints IDENTICAL to Counter Read — counter step left selling the give, then drop and drift away from the run action, letting the rush come, before flipping the screen back to the HB. Eyes downfield to hold the rush."
  - player: HB
    role: ball_carrier
    is_primary: true
    path: [[0, 0], [4, 1], [2, -1], [-2, -1]]
    notes: "First two waypoints IDENTICAL to Counter Read — start the outside-zone sweep track to sell the give, then plant and slip back behind the LOS to the backside, settle, catch the screen, and follow the LT and LG."

strengths:
  - Identical pre-snap look and first-step action to Counter Read — the defense cannot tell it from the run
  - The counter step plus an HB sweep fake pulls the pursuit one way before the screen goes back the other
  - Three pulling/releasing linemen out front give the HB a convoy on the catch
  - Punishes an aggressive, hard-rushing front by using its own momentum against it
  - Clearout routes vacate the backside, opening grass for the screen

weaknesses:
  - Needs Counter Read on tape first — a cold fake does not pull the pursuit
  - Timing-dependent — a mistimed release lets defenders read and sit on the screen
  - Dead against a defense that does not rush hard or that spies the HB
  - Loses yardage badly if a backside defender sniffs the screen and beats the linemen out
  - The QB must hold the rush long enough without taking a sack

best_vs_defense:
  - aggressive four-man rushes that get upfield fast
  - blitz-heavy fronts vacating the underneath
  - any defense overcommitting to the Counter run
  - man coverage with the secondary chasing the clearout routes

worst_vs_defense:
  - zone defenses with linebackers reading the QB and sitting underneath
  - a spy assigned to the HB
  - disciplined four-man rushes that stay in lanes
  - any defense that has stopped Counter Read and stopped respecting it

defensive_counters:
  - counter_id: lb-spot-drop-read-screen
    pre_snap_look: "Linebackers aligned at pass depth (5+ yards) squared to the QB with eyes in the backfield, not crowding the box"
    qb_key: "Check the LB depth and eyes — backers deep, squared up, reading the QB"
    read_category: lb-depth
    why: "Linebackers already at depth reading the QB will spot-drop and pass off the clearouts, leaving them free to trigger on the screen the moment the HB slips out."
    typical_against: ["cover-3 zone", "cover-4", "any screen-aware defense"]
  - counter_id: contain-rush-no-upfield
    pre_snap_look: "Both EDGE defenders in square two-point stances playing contain, hands free, not in get-off sprinter's stances"
    qb_key: "Scan the edges — both EDGEs squared and squatting, playing contain rather than rushing"
    read_category: dl-alignment
    why: "A contain rush that does not sell out upfield never vacates the screen lane, so the backside EDGE is in position to beat the pulling linemen to the HB."
    typical_against: ["bend-don't-break zone", "any defense playing the screen"]
  - counter_id: backside-spy
    pre_snap_look: "A linebacker or safety walked into the backside underneath, shaded to the HB with no clear coverage or run-fit responsibility"
    qb_key: "Check the backside underneath — a defender shaded to the HB with no other job"
    read_category: lb-depth
    why: "A defender spying the HB mirrors him out of the backfield and arrives at the screen catch point before the convoy of linemen can set up."
    typical_against: ["cover-1 with a back spy", "QB/RB spy game-plans"]

common_uses:
  - After establishing Counter Read for 4+ yards
  - 2nd-and-long / 3rd-and-long vs an aggressive rush
  - Slowing a hot pass rush
  - Catching a blitz-heavy defense vacating the underneath
  - Changing pace against a fast-flow front

philosophy: spread-option
run_concept_ref: counter
pass_concept_ref: hb-screen
pass_protection_ref: screen-protection
philosophy_ref: spread-option

era: "Modern — pairing a running-back screen with QB-run-game action is a staple of mobile-QB spread offenses."

