notes: |
  Play-action pass off Inside Zone. The QB reverse-pivot, the HB bang-track
  fake, and the OL zone-step show are all IDENTICAL to singleback-trio-inside-
  zone through the mesh — the defense reads the zone run. The QB then settles
  in the pocket and throws the TE drag behind the run-flow linebackers, with
  the X deep cross and Z post stressing the safety. Member of the Singleback
  Trio Zone disguise family (see data/play-families/).

  Mirror to zone-pass-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "Play-action off the inside-zone run is a universal constraint concept. Authored as a disguise twin of singleback-trio-inside-zone — initial action (QB reverse-pivot, HB bang track) deliberately mirrors the base play for the first two path waypoints."
