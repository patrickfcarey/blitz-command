play_id: singleback-trio-zone-pass
name: Zone Pass (Strong)
aliases:
  - PA Inside Zone
  - Zone Play-Action
  - IZ Pop Pass

formation: singleback-trio
play_type: play-action
ball_carrier: QB
primary_read: TE
secondary_read: X
tertiary_read: Z
checkdown: SLOT

# Identical motions to Inside Zone — the base play runs no motion, so neither
# does this twin. The shared empty motions block keeps the static pre-snap
# picture identical across the family so the defense cannot key it.
motions: []

assignments:
  - player: LT
    role: pass_block
    blocking_scheme: pa-zone-protection
    notes: "Fire out low showing the backside zone step for a beat, then anchor and protect the backside edge."
  - player: LG
    role: pass_block
    blocking_scheme: pa-zone-protection
    notes: "Show the zone-combo for one count, then settle and protect the backside A-gap."
  - player: C
    role: pass_block
    blocking_scheme: pa-zone-protection
    notes: "Show the zone-combo, then protect the A-gaps."
  - player: RG
    role: pass_block
    blocking_scheme: pa-zone-protection
    notes: "Fire out showing the zone-combo, then recover and protect the playside B-gap."
  - player: RT
    role: pass_block
    blocking_scheme: pa-zone-protection
    notes: "Show the zone step, then protect the playside edge."
  - player: TE
    role: route
    route_name: drag
    depth_yd: 8
    is_primary: true
    notes: "Show the edge-seal zone block for one beat to sell the run, then release across on the drag behind the run-flow linebackers. The bread-and-butter throw on PA."
  - player: X
    role: route
    route_name: deep-cross
    depth_yd: 18
    notes: "Backside X runs the deep cross — secondary read; opens late if the free safety bites the TE drag."
  - player: Z
    role: route
    route_name: post
    depth_yd: 16
    notes: "Strong-side Z post — pulls the free safety away from the middle so the X cross can clear."
  - player: SLOT
    role: route
    route_name: flat
    depth_yd: 4
    notes: "Stalk-release to sell the run, then break to the flat — the checkdown / hot read vs blitz."
  - player: QB
    role: ball_carrier
    path: [[0, 0], [-1, -1], [-2, -2], [-2, -4]]
    notes: "Reverse-pivot IDENTICAL to Inside Zone for the first two steps, ride the HB fake through the mesh, then settle at depth in the pocket and throw. Eyes on the TE drag first."
  - player: HB
    role: fake
    path: [[0, 0], [2, 3], [3, 6]]
    notes: "Run the exact Inside Zone bang track for the first two waypoints to sell the handoff, then hold up as a late outlet only if pressure clears."

strengths:
  - Identical pre-snap look and first-step action to Inside Zone — the defense cannot tell it from the run
  - Holds run-flow linebackers, opening the TE drag behind them
  - QB stays in the pocket — no edge given up, unlike a boot
  - 3-WR spread stretches the coverage full-width once the linebackers freeze
  - High completion percentage once the zone run has been established

weaknesses:
  - Needs Inside Zone on tape first — a cold PA fake holds no one
  - The deeper pocket set takes longer than a boot to reach the throw
  - Pass protection is fragile if the HB releases — no extra blockers
  - Field stays full-width — reads are more demanding than a half-field boot
  - Vulnerable to interior pressure that doesn't honor the run fake

best_vs_defense:
  - cover-3 with run-fit linebackers
  - 4-3 with downhill, aggressive LB play
  - 8-man fronts (vacates deep coverage)
  - single-high coverages

worst_vs_defense:
  - two-high shells with LBs at pass depth
  - cover-1 robber sitting in the drag window
  - cover-4 quarters with disciplined deep coverage
  - any defense that has stopped the zone run and stopped respecting it

defensive_counters:
  - counter_id: alert-zone-no-bite
    pre_snap_look: "Linebackers aligned at full passing depth (5+ yards off the LOS) under a two-high safety shell, not crowding the box"
    qb_key: "Check the LB depth and safety shell — backers deep, two-high behind them"
    read_category: lb-depth
    why: "Linebackers already at pass depth under a two-high shell read pass first; they will not vacate on the zone fake, so the TE drag arrives into a populated zone."
    typical_against: ["cover-4", "cover-3 alert", "any defense after the zone run has been slowed"]
  - counter_id: robber-fs
    pre_snap_look: "A single safety dropped to 8-10 yards inside the hash over the middle, with the other safety bailed deep — a disguised one-high robber shell"
    qb_key: "Check the safety shell — one safety sunk to 8-10 yards over the middle"
    read_category: safety-shell
    why: "A robber sitting in the drag's window undercuts the primary read and takes away the X cross at its breaking point, leaving the QB nothing in the middle."
    typical_against: ["cover-1 robber", "cover-3 buzz"]
  - counter_id: interior-a-gap-pressure
    pre_snap_look: "Both inside linebackers walked up and stacked over the A-gaps on the guards' inside eyes, showing a double-A look"
    qb_key: "Scan the interior — both LBs creeping into the A-gaps over the guards"
    read_category: lb-depth
    why: "A double-A pressure that ignores the run fake collapses the pocket up the middle before the pocket PA's deeper drop completes, with no HB free to pick it up."
    typical_against: ["cover-1 with double-A", "zone-pressure looks"]

common_uses:
  - After establishing Inside Zone for 4+ yards
  - 1st-and-10 play-action shot
  - 2nd-and-medium
  - Red-zone moving the linebackers with the zone fake

philosophy: zone-run
pass_concept_ref: drive
run_concept_ref: inside-zone
philosophy_ref: zone-run

era: "Universal — play-action off the inside-zone run is as old as the zone running game itself; every modern offense runs a zone PA pass."

famous_examples:
  - "Mike Shanahan / Gary Kubiak play-action off the zone run"
  - "Modern NFL 11-personnel singleback PA shots (Rams, 49ers under Shanahan/McVay)"

