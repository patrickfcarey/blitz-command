play_id: shotgun-2x2-qb-power
name: QB Power (Strong)
aliases:
  - Power Q
  - Q-Power
  - QB Sneak Power

formation: shotgun-2x2
play_type: run
ball_carrier: QB

motions: []

assignments:
  - player: LT
    role: run_block
    blocking_scheme: down-block
    target: backside-DT
  - player: LG
    role: run_block
    blocking_scheme: pull-around
    target: playside-LB
    path: [[0, 0], [2, -0.5], [4, 0], [5, 4]]
    notes: "PULL — backside guard pulls around C, leads through the off-tackle hole on the playside ILB."
  - player: C
    role: run_block
    blocking_scheme: gap-block
    target: backside-A-gap
  - player: RG
    role: run_block
    blocking_scheme: down-block
    target: playside-3-tech
  - player: RT
    role: run_block
    blocking_scheme: down-block
    target: playside-DT
  - player: TE
    role: run_block
    blocking_scheme: kickout
    target: edge-defender
    notes: "Kicks out playside EDGE — opens the off-tackle hole."
  - player: X
    role: run_block
    blocking_scheme: stalk
    target: backside-cornerback
  - player: Z
    role: run_block
    blocking_scheme: stalk
    target: playside-cornerback
  - player: SLOT-W
    role: run_block
    blocking_scheme: stalk
    target: nickel-defender
  - player: QB
    role: ball_carrier
    is_primary: true
    path: [[0, 0], [3, 3], [4, 8]]
    notes: |
      DESIGNED QB RUN — power scheme. QB is the ball carrier (no read).
      Take snap, immediately attack the off-tackle hole between RT and TE,
      follow the pulling LG through to the second level. No counter step —
      straight downhill power.
  - player: HB
    role: lead_block
    target: alley-defender
    path: [[0, 0], [-1, 1], [3, 3], [4, 6]]
    notes: "HB sweeps to the strong side as a lead blocker — picks off the alley defender or playside safety. Sells a possible jet-action fake."

strengths:
  - "Power-scheme blocking (down + pull) for the QB run"
  - "TE kickout opens off-tackle hole reliably"
  - "HB lead block adds a 7th playside blocker"
  - "Quick-hitting — no counter step or read delay"
  - "Simple install — same as HB Power but with QB carrying"
  - "Goal-line / short-yardage answer with mobile QB"
  - "Tush Push variant: HB+TE push QB forward (Eagles innovation)"

weaknesses:
  - "QB injury risk on every snap"
  - "Slow-developing relative to QB sneak (LG pull needs ~1.5 sec)"
  - "Predictable in goal-line / short-yardage looks"
  - "Vulnerable to playside DT penetration before down-blocks set"
  - "Defense knows QB is the ball-carrier if HB sweeps and doesn't fake"

best_vs_defense:
  - "any defense over-rotating to HB (jet-action sells it)"
  - "4-3 over-front (gives down-block angles)"
  - "cover-3 with single safety"
  - "8-man fronts where down-blocks have angles"
  - "goal-line short-yardage situations"

worst_vs_defense:
  - "bear front (DT in every gap)"
  - "scrape-exchange (LB taking QB)"
  - "cover-1 robber (extra defender in box)"
  - "playside DT penetration"
  - "defenses keying on QB"

defensive_counters:
  - counter_id: extra-box-defender
    pre_snap_look: "8 defenders inside the tackle box — strong safety walked down to 6-8 yds inside the playside hash, single-high shell behind it"
    qb_key: "Count the box — eight, with one high safety"
    read_category: box-count
    why: "QB is the runner, so the offense doesn't gain a number — the extra box defender comes free unblocked at the point of attack."
    typical_against: ["cover-1 robber", "quarters with SS rolled down", "8-man fronts"]
  - counter_id: scrape-exchange
    pre_snap_look: "Playside EDGE squeezed down inside in a heavy tight shade, with the MIKE/SAM walked up and cheated outside his normal alignment"
    qb_key: "Scan the playside EDGE — squeezed inside with a LB cheated outside him"
    read_category: dl-alignment
    why: "An EDGE already squeezed inside is set to crash the off-tackle hole so the cheated-out LB scrapes over the top and meets the QB unblocked where the puller expected a static defender."
    typical_against: ["over-front", "4-3 base", "any defense with a QB-run game-plan"]
  - counter_id: pinch-dl
    pre_snap_look: "Both DTs in tight inside shades — 1-tech / inside-eye 3-techniques crowding the A and B gaps"
    qb_key: "Scan the interior DL shade — tackles crowding the inside gaps"
    read_category: dl-alignment
    why: "Inside-shaded tackles give the down-blocks nothing to push; the off-tackle hole closes before the pulling LG clears the center and the TE kickout has no edge to define."
    typical_against: ["over-front", "4-3 base"]

flip_reads:
  - flip_id: front-overshift-callside
    pre_snap_look: "Front slid toward the called side — the 3-technique and a walked-up LB put the extra hat in the called-side box"
    qb_key: "Count the box side to side — the called side is heavier"
    read_category: box-count
    flip_to: mirror-play
    why: "QB Power into the overshift gives the puller no room; flipping the play runs the same scheme at the lighter box."
    typical_against: ["over-front", "shifted 4-3"]
  - flip_id: pressure-declared-callside
    pre_snap_look: "A nickel or LB is walked up and bracketed outside the called-side tackle, showing edge pressure to that side"
    qb_key: "Scan the called-side edge — a second defender stacked outside, pressure look"
    read_category: lb-depth
    flip_to: mirror-play
    why: "Flipping away from the shown pressure runs QB Power at the edge the defense just vacated, before the pressure can redirect."
    typical_against: ["nickel pressure", "cover-1 with edge blitz"]

common_uses:
  - "Goal-line / short-yardage with mobile QB"
  - "1st-and-Goal from the 1-3 yard line"
  - "3rd-and-1 / 3rd-and-2 conversion"
  - "Modern NFL Tush Push variant"
  - "4-minute offense with mobile QB"

philosophy: power-run
run_concept_ref: power
philosophy_ref: power-run

era: "Mid-2010s onward — designed QB power became universal in mobile-QB offenses; Tush Push variant since 2022 (Eagles)."

famous_examples:
  - "Eagles Tush Push (Jalen Hurts era) — near-automatic in short-yardage"
  - "Ravens (Lamar Jackson) goal-line packages"
  - "Bills (Josh Allen) short-yardage"
  - "Modern Power 5 college spread-option programs"

