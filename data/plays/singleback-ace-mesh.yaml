play_id: singleback-ace-mesh
name: Mesh
aliases:
  - Mesh Concept
  - Drive
  - Crossers

formation: singleback-ace
play_type: pass
ball_carrier: QB
primary_read: TE
secondary_read: SLOT
checkdown: HB

# Optional motion: SLOT shifts toward TE to bunch the mesh point. Defaults
# to no motion — the natural cross at the C is enough.
motions:
  - player: SLOT
    type: optional
    motion_type: short-across
    end_position: { x: 5.0, y: -1.0 }
    notes: "Optional: tighten the mesh point by motioning SLOT toward strong side."

assignments:
  - player: LT
    role: pass_block
    blocking_scheme: man-protection
  - player: LG
    role: pass_block
    blocking_scheme: man-protection
  - player: C
    role: pass_block
    blocking_scheme: man-protection
  - player: RG
    role: pass_block
    blocking_scheme: man-protection
  - player: RT
    role: pass_block
    blocking_scheme: man-protection
  - player: TE
    role: route
    route_name: drag
    depth_yd: 6
    is_primary: true
    notes: "Drag from strong-to-weak at 6 yards; meets SLOT around the C — that's the mesh point. BYU/Leach tradition emphasizes exactly 6 yards 'where the receivers can high-five.'"
  - player: X
    role: route
    route_name: comeback
    depth_yd: 14
    notes: "Backside comeback — opens late if mesh is covered."
  - player: Z
    role: route
    route_name: clear-out-go
    depth_yd: 25
    notes: "Vertical clear-out to remove the playside corner from the mesh window."
  - player: SLOT
    role: route
    route_name: drag
    depth_yd: 6
    notes: "Drag from weak-to-strong at 6 yards; passes underneath TE at the mesh point."
  - player: QB
    role: ball_carrier
    notes: "5-step drop. Read TE first (he's coming open into your face), then SLOT, then check Z post-mesh, then HB."
  - player: HB
    role: pass_block
    blocking_scheme: man-protection
    notes: "Pass-protect first; release as a checkdown if pressure clears."

strengths:
  - Devastating against man coverage — natural rubs at the mesh point
  - Two underneath options always crossing — one will be open vs zone
  - QB-friendly read tree (TE first, then SLOT, then deeper)
  - Easy outlet with HB checkdown
  - Hard to defend without giving up ground somewhere
  - Works against multiple coverages

weaknesses:
  - Vulnerable to true zone with disciplined LB drops carrying crossers
  - Catches under traffic — drops are common
  - Needs a short field if playing for first downs (8-yd route in a 5-yd hole)
  - Easy for safeties to come down on
  - LBs that bracket the mesh shut down both crossers

best_vs_defense:
  - cover-1 (man on receivers, free safety high — picks happen at mesh)
  - cover-1 robber (robber gets crossed up)
  - cover-0 / man-free
  - any man coverage where rubs are legal

worst_vs_defense:
  - cover-2 trap (corner squats on drag)
  - cover-4 (pattern-match rules carry crossers)
  - banjo / bracket coverage
  - aggressive LB carry-and-cushion

common_uses:
  - 3rd-and-medium
  - 2-minute drill
  - Vs man-coverage tells
  - First-down rhythm play
  - Anti-blitz hot read

philosophy: air-raid

era: "1990s onward — Mike Leach / Hal Mumme popularized as an Air Raid signature."

famous_examples:
  - "Mike Leach (Texas Tech, Wazzu) — career-defining call"
  - "Hal Mumme Kentucky"
  - "Modern NFL (49ers, Rams use mesh variations)"
  - "Sonny Dykes-tree college offenses"

tags:
  - pass
  - spread
  - mesh
  - anti-man
  - air-raid
  - any-level
  - high-school
  - college
  - nfl

notes: |
  Two drag routes from opposite sides cross at the same depth (~5 yds) in
  the middle of the field — the "mesh point." Crossing receivers can rub
  each other (legal pick) or pass close enough to act as a natural pick on
  man defenders. Read tree puts TE first because he's coming open into the
  QB's face from the strong side.

verification_status: unverified
