play_id: singleback-ace-pa-boot
name: PA Boot
aliases:
  - Play-Action Bootleg
  - Zone Boot
  - Naked Boot

formation: singleback-ace
play_type: play-action
ball_carrier: QB
primary_read: TE-L
secondary_read: X
checkdown: HB

motions: []

assignments:
  - player: LT
    role: pass_block
    blocking_scheme: half-roll-protection
    notes: "Slide protection toward the bootleg side (LEFT)."
  - player: LG
    role: pass_block
    blocking_scheme: half-roll-protection
  - player: C
    role: pass_block
    blocking_scheme: half-roll-protection
  - player: RG
    role: pass_block
    blocking_scheme: half-roll-protection
  - player: RT
    role: pass_block
    blocking_scheme: half-roll-protection
  - player: TE-R
    role: pass_block
    blocking_scheme: half-roll-protection
    notes: "Run-fake side TE — sell the zone block, then check the backside edge as the QB clears."
  - player: TE-L
    role: route
    route_name: drag
    depth_yd: 9
    is_primary: true
    notes: "Boot-side TE crosses at 9-10 yards — the bread-and-butter throw on the move."
  - player: X
    role: route
    route_name: comeback
    depth_yd: 14
    notes: "Boot-side comeback — the intermediate shot if the drag is walled off."
  - player: Z
    role: route
    route_name: deep-cross
    depth_yd: 18
    notes: "Deep cross strong-to-weak — the kill shot if the safety bites the run fake."
  - player: QB
    role: ball_carrier
    path: [[0, 0], [-3, -1], [-5, -1], [-7, 0]]
    notes: "Fake the zone handoff to the HB, boot to the LEFT (opposite the run fake). Eyes on the TE-L drag first."
  - player: HB
    role: route
    route_name: flat
    depth_yd: 3
    notes: "Fake carrying the zone, then leak to the boot-side flat as the checkdown outlet."

strengths:
  - QB throws on the move — easier throws, fewer pass-rush angles
  - PA fake holds run-flow linebackers, opening the underneath drag window
  - Clean three-level read tree (flat / drag / comeback)
  - Built directly off the inside- and outside-zone run action
  - High completion percentage once the defense respects the zone run

weaknesses:
  - Boot-side edge defender is chipped at best — can come free
  - Field is cut in half — only the bootleg side is live
  - Slow-developing — needs ~4 seconds to reach the launch point
  - Predictable once defenders stop biting on the run fake
  - Throwing back across the field is high-risk

best_vs_defense:
  - cover-3 with run-fit linebackers
  - 4-3 with predictable LB flow
  - any defense overcommitting to the zone run
  - single-high coverages

worst_vs_defense:
  - any defense not biting on play-action
  - safety blitz from the bootleg side
  - cover-2 with a corner playing edge contain
  - cover-0 / man-free with a QB spy

defensive_counters:
  - counter_id: alert-zone-no-bite
    pre_snap_look: "Linebackers aligned at full passing depth (5+ yards off the LOS) under a two-high safety shell, not crowding the box"
    qb_key: "Check the LB depth and safety shell — backers deep, two-high behind them"
    read_category: lb-depth
    why: "Linebackers already at pass depth under a two-high shell are reading pass first; they will not vacate on the fake, so the TE drag arrives into a populated zone."
    typical_against: ["cover-3 alert", "cover-4", "any defense after the run game has been slowed"]
  - counter_id: rush-the-boot-edge
    pre_snap_look: "Boot-side EDGE in a wide-9 sprinter's stance with the chip blocker left uncovered to bait the speed rush"
    qb_key: "Scan the boot-side edge — EDGE flared wide-9, weight forward, no blocker on him"
    read_category: dl-alignment
    why: "A wide-9 EDGE in a get-off stance with no blocker on him crashes upfield and flushes the QB before the rollout reaches its launch point."
    typical_against: ["any defense with a free runner off the boot side", "cover-1 with edge pressure"]
  - counter_id: squat-flat-corner
    pre_snap_look: "Boot-side CB aligned tight at 5-6 yards with inside leverage and a safety capped over the top of him"
    qb_key: "Check the boot-side corner — CB squatted low and inside with a safety overlapping above"
    read_category: cb-leverage
    why: "A low, inside-leverage corner with deep safety help is free to trigger down on the HB flat, removing the rolling QB's safety-valve outlet."
    typical_against: ["cover-2 with hard corners", "quarters with cloud rotation"]

common_uses:
  - After establishing inside or outside zone for 4+ yards
  - 1st-and-10 play-action shot
  - 3rd-and-medium moving-pocket throw
  - Red-zone moving-target passing

philosophy: west-coast
pass_concept_ref: sail
philosophy_ref: west-coast

era: "1980s onward — a Bill Walsh / zone-running staple, modernized continuously through the Shanahan tree."

famous_examples:
