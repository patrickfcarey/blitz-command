notes: |
  Play-action boot off the singleback-ace zone run action. The QB fakes the
  zone handoff and boots away from the fake, attacking the boot side with a
  three-level read: HB flat (low), TE-L drag (primary), X comeback (high).
  The Z deep cross is the kill shot when the safety bites the fake. The
  direct constraint to singleback-ace-inside-zone and -outside-zone — call
  it once those runs have linebackers flowing hard.

  Mirror to pa-boot-right by flipping all coordinates.

verification_status: unverified
source_notes:
  - "West Coast / Shanahan-tree play-action boot; standard constraint off the zone run game. Same concept family as i-formation-bootleg-flat, adapted to singleback-ace 12-personnel."
