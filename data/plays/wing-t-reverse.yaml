strengths:
  - "Two-fake misdirection (HB sweep + FB belly) holds defense"
  - "Two pulling guards now LEAD the reverse direction"
  - "Punishes defenses overpursuing Buck Sweep"
  - "Big-play potential when defense overcommits"
weaknesses:
