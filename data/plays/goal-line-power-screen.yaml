notes: |
  Slip screen off Goal Line Power. The QB reverse-out, the HB off-tackle
  Power track, and the LG pull are all IDENTICAL to Goal Line Power for
  the first two path waypoints — the defense reads Power and crashes the
  run. The interior OL invites the rush; the HB sells the off-tackle
  track, then slips back toward the LOS and catches the screen behind the
  LG, C, and TE-L convoy. A goal-line screen is unusual but legal — kept
  as a quick HS-realistic slip screen, not a deep developing screen.
  Member of the Goal Line Power disguise family (see data/play-families/).

  Mirror to goal-line-power-screen-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "The running-back screen off run-game action is a universal constraint concept; a goal-line slip-screen application is rarer but legal HS football. Authored as a disguise twin of goal-line-power — the QB/HB/LG initial action deliberately mirrors the base play's first two path waypoints exactly; the interior OL switch from down-block to invite-rusher/screen-release, and TE-L from down-block to chip-and-release, are the structural changes that build the screen."
