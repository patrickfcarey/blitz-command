formation: double-slot-left
play_type: pass
ball_carrier: QB
primary_read: SLOT-R
secondary_read: Z
checkdown: HB
motions:
- player: SLOT-R
  type: mandatory
  motion_type: short-across
  end_position:
    x: -5.0
    y: -1.0
  notes: SLOT-R tightens his split with a short inside motion — identical across the whole Run-and-Shoot family so motion
    is never a tell.
assignments:
- player: LT
  role: pass_block
  blocking_scheme: man-protection
- player: LG
  role: pass_block
  blocking_scheme: man-protection
- player: C
  role: pass_block
  blocking_scheme: man-protection
- player: RG
  role: pass_block
  blocking_scheme: man-protection
- player: RT
  role: pass_block
  blocking_scheme: man-protection
- player: X
  role: route
  route_name: choice
  depth_yd: 12
  notes: 'X choice route — 12 yds, then read the corner:

    - Outside leverage / press → break IN (post / dig)

    - Inside leverage / soft → break OUT (comeback / out)

    - Cover-2 trap → fade vertical

    '
- player: Z
  role: route
  route_name: choice
  depth_yd: 12
  notes: 'Z choice route — 12 yds, then read the corner (same rules as X).

    Secondary read.

    '
- player: SLOT-L
  role: route
  route_name: choice-seam
  depth_yd: 12
  notes: 'SLOT-L weak-side seam-choice — 12 yds, then read the safety:

    - Single-high (FS) → run past on a seam

    - Two-high → settle in the soft spot between safety and inside LB

    '
- player: SLOT-R
  role: route
  route_name: choice-seam
  depth_yd: 12
  is_primary: true
  notes: 'SLOT-R strong-side seam-choice — 12 yds, then read the safety.

    Primary read against single-high. The signature run-and-shoot route.

    '
- player: QB
  role: ball_carrier
  path:
  - - 0
    - 0
  - - 0
    - -2
  - - 0
    - -4
  notes: '5-step drop — IDENTICAL first two waypoints to every play in the

    Run-and-Shoot family (this is the family''s shared QB drop). Read the

    deep coverage:

    - Single-high (cover-1 / cover-3) → SLOT-R seam (the signature R&S read)

    - Two-high (cover-2 / cover-4) → outside choice route (whichever side has more space)

    - Pressure / blitz → HB checkdown (built-in outlet)

    Every receiver is reading coverage. QB has to anticipate which route each receiver will pick.

    '
- player: HB
  role: route
  route_name: flat
  depth_yd: 3
  notes: HB releases to the strong-side flat as the universal outlet — no pass-pro on choice concept (every receiver is a
    target).
strengths:
- Every receiver reads coverage — defense can't predict route distribution
- Single-high coverage is the kill shot — slot-seam splits the deep middle
- Two-high coverage opens outside choice routes (out / comeback / fade)
- Run-and-shoot signature concept — defines the offense
- QB has 4 receivers + checkdown = always something open
- Hard to scout — same call looks different every snap based on coverage
weaknesses:
- QB and receivers must read coverage simultaneously — high cognitive load
- Modern pattern-match coverage neutralizes choice routes
- Pass protection fragile (5 OL only)
- No pass-pro from HB makes blitzing tougher to handle
- Wrong reads = no separation, sack risk
best_vs_defense:
- Cover-3 (single-high gets split by SLOT seam)
- Cover-1 (single-high man — slot wins on seam vs LB)
- Any defense with predictable coverage (no pattern-match)
- Cover-2 with squatting corners (X / Z choice goes outside)
worst_vs_defense:
- Cover-4 / quarters with pattern-match (carries every choice)
- Robber coverage (extra defender ruins seam read)
- Disciplined banjo coverage on slot
- Aggressive zero blitz (no time to read)
defensive_counters:
- counter_id: middle-robber
  pre_snap_look: A safety dropped to 8-10 yards squared over the ball, with a two-high shell rotating behind him
  qb_key: Check the middle of the field — a safety squatting at 8-10 yards over the hash
  read_category: safety-shell
  why: A robber parked in the slot-seam window undercuts the primary choice-seam read; the slot has no clean window and the
    QB's first read is dead.
  typical_against:
  - cover-1 robber
  - cover-3 buzz
- counter_id: quarters-carry-slot
  pre_snap_look: Two safeties at 10-12 yards, each squared and triggered down toward the slot — apex alignment splitting the
    slot and the tackle
  qb_key: Check the safeties — two-high, both apexed down over the slots
  read_category: safety-shell
  why: Quarters safeties pattern-match and carry the slot vertical man-to-man, so the choice-seam never uncovers and the receiver's
    read produces no separation.
  typical_against:
  - cover-4
  - quarters pattern-match
- counter_id: nickel-press-no-cushion
  pre_snap_look: All four coverage defenders pressed tight on the WRs and slots with no cushion, single-high safety behind
  qb_key: Scan the corners and nickel — every cover defender jammed at the line, no cushion
  read_category: cb-leverage
  why: Press with no cushion removes the leverage cue the receivers read; the choice break is a guess, and a missed beat leaves
    every option route covered with the protection already stressed.
  typical_against:
  - cover-1 press
  - press-bail disguise
common_uses:
- 1st-and-10 base call in run-and-shoot offense
- 3rd-and-medium / 3rd-and-long
- 2-minute drill / hurry-up
- Tempo offense (everyone knows the rules)
- Vs defenses showing single-high pre-snap
philosophy: spread-pass
