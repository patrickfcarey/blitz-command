notes: 'Choice is the foundational run-and-shoot concept — every receiver runs

  the same option route, choosing his break based on the defender''s

  leverage. SLOT-R seam-choice is the primary read against single-high

  coverage (the route that makes the run-and-shoot famous).


  This is harder to install than fixed-route concepts because every

  receiver and the QB must read the SAME coverage and anticipate each

  other''s choices. June Jones / Mouse Davis spent years drilling the

  read keys.


  Companion in the Run-and-Shoot disguise family (base: run-and-shoot-switch).

  The SLOT-R short-across motion and the QB''s first two drop waypoints are

  identical to switch, go, screen, and draw — to the defense, Choice and the

  Switch base look the same from the huddle break through the QB''s drop.


  Mirror by flipping all x.

  '
