notes: |
  West Coast quick-out / speed-out quick-game play disguised off Stick. The
  QB's 3-step drop is IDENTICAL to Stick, and the receivers take the same
  early vertical releases (TE and X push vertical exactly like the base
  clear-outs, the slots stem vertical exactly like the base option routes)
  before the routes branch — the outside WRs run the vertical clear-out, the
  slots snap a 6-yard speed-out into the vacated grass. The defense reads the
  same picture as Stick. Member of the Shotgun 2x2 Quick-Game disguise family
  (see data/play-families/).

  Mirror to quick-out-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "The quick-out / speed-out paired with a vertical clear-out is a textbook West Coast timing concept — the outside WR carries the corner, defining grass for the slot's out-cut. Authored as a disguise twin of shotgun-2x2-stick — the QB drop's first two waypoints are identical to the base play, all members carry the same empty motions block, and the receivers' early release waypoints match the base play's vertical stems before the routes branch."
