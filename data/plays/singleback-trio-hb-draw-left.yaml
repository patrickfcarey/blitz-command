strengths:
- Constraint to spread passing — punishes aggressive pass rushers
- Catches LBs in pass drop
- QB sells pass via deep drop
- Big-play potential when LBs vacate the box
weaknesses:
- Telegraphed if QB doesn't sell pass
- LB blitzes break the play
- Won't work against zone-heavy LBs that don't vacate
- Requires accurate handoff timing
best_vs_defense:
- aggressive 4-man rushers
- cover-2/3 with LBs in deep drops
- pass-rushing 4-3
worst_vs_defense:
- LB blitzes
- cover-1 with spy
- 8-man fronts
common_uses:
- 2nd-and-long / 3rd-and-long
- After 2-3 obvious passes
- Pass-rushing-defense constraint
philosophy: any
era: Universal — every era has the HB draw as a constraint to passing.
