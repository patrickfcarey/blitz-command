notes: |
  This is the modern evolution of the triple option — instead of FB-dive /
  QB-keep / HB-pitch (Wishbone) or HB-give / QB-keep / SLOT-pitch (Flexbone),
  it's HB-give (run) / QB-keep (run) / Z-slant (pass). Three ball-carrier
  outcomes from one snap.

  Decision tree:
    pre-snap → box count → bias toward give or pull
    post-snap mesh → backside DE → give or pull
    post-pull → playside LB → keep run or throw slant

  Mirror by flipping all x (Z slant goes to weak side; bubble works
  similarly — substitute SLOT bubble for Z slant if you want a wider throw).

verification_status: unverified
source_notes:
  - "Triple-option-RPO with zone-read mechanic + slant pass option; documented widely in modern spread-option coaching texts (Gus Malzahn / Chip Kelly / Lincoln Riley lineages)."
  - "Built 2026-04-30 to round out the option family in the play library — combines zone-read (run/keep) with RPO (pass) into a true 3-option play."
