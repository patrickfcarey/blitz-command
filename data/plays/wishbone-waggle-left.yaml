notes: 'Wishbone Waggle is the PA bootleg companion to triple-option / FB dive.

  Triple play-fake (FB + HBR + QB) is the signature — the formation tells

  defense to expect run, and the deep play-action holds them. QB rolls

  to the strong side for shorter throws to TE corner / SE post / HBR flat.


  Mirror by flipping all x.

  '
