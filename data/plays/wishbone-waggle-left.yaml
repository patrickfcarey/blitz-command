  notes: 'Triple fake — sell FB dive, sell HBR pitch, then bootleg to the strong side.

    QB rolls to ~5 yd depth, scans:

    - TE corner first (the kill shot)

    - SE post second (vs cover-1 or cover-3 with FS biting TE)

    - HBR flat as outlet (he releases late)

    '
