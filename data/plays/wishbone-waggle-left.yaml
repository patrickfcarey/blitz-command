  depth_yd: 3
  notes: Pitch HB releases late to the strong-side flat — outlet for QB on rollout.
strengths:
- Triple play-fake (FB dive + HBR pitch + QB bootleg) sells the run massively
- Wishbone defenses key heavily on run — PA shots have huge impact
- TE corner attacks the seam between safety and corner
- Backside post threat keeps the FS honest
- HBR flat outlet provides an easy 3-yd completion
- Constraint package after establishing FB dive / triple-option success
weaknesses:
- Slow-developing — QB rolling out takes 3+ sec
- Vulnerable to backside DE pursuing the rollout
- Pass protection fragile (only 5 OL + HBL chip)
- Cover-2 with playside corner squat shuts down corner route
- Wishbone QB may not be a true thrower — accuracy / arm-strength concerns
best_vs_defense:
- Cover-3 with FS biting on TE corner
- Cover-1 with single coverage on TE
- any defense aggressively run-fitting (LBs flow, leaving voids)
- 8-man fronts (no help in deep coverage)
worst_vs_defense:
- Cover-2 with playside corner squatting
- Cover-4 with disciplined deep coverage
- Backside DE who plays QB on rollouts
- Defenses that don't bite on PA
common_uses:
- PA shot off established triple-option run game
- 1st-and-10 after a sequence of FB dives
- Red-zone TE corner (back of end zone)
- Constraint to over-pursuing run defenses
- 1980s-era staple in option offenses
