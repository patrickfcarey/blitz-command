notes: 'Play-action bootleg off Lead Toss. The QB reverse-out, the HB perimeter

  fake, the FB lead, the RG pull, and the OL run-block show are all

  IDENTICAL to Lead Toss through the pitch fake. Because the toss already

  flows the defense hard to the strong side, the QB keeping it and booting

  backside runs the pursuit away from the throw. Three-level read (TE drag

  / FB flat / X comeback). Member of the I-Formation Toss disguise family

  (see data/play-families/).


  Mirror to toss-boot-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- Bootleg off the toss sweep is a universal constraint concept. Authored as a disguise twin of i-formation-lead-toss — initial
  action (QB reverse-out, HB/FB tracks, RG pull) deliberately mirrors the base play's first two waypoints exactly.
- Mirror of i-formation-toss-boot.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
