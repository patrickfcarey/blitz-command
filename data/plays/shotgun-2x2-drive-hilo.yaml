notes: |
  A hi-lo variant of the Drive concept that attacks a different level. The
  base Drive runs a dig over the shallow cross; this play keeps the identical
  TE drag (LO) but replaces the dig with a Z corner route (HI), turning the
  read into a corner-over-flat vertical stretch on the strong-side flat/curl
  defender. The empty motion block and the QB's three-step drop are
  IDENTICAL to the Drive base — the defense reads the same look. Member of
  the Shotgun 2x2 West Coast Drive disguise family (see data/play-families/).

  Mirror to drive-hilo-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "Web validated 2026-05-15 — Throw Deep Publishing 'Hi-Lo Concept' (https://throwdeeppublishing.com/blogs/football-glossary/): a hi-lo stacks two routes attacking one defender at two depths. The corner-over-shallow pairing is a standard West Coast answer to a squatting underneath defender."
  - "Authored as a disguise twin of shotgun-2x2-drive — empty motions block and the QB's three-step drop waypoints deliberately mirror the base play; the shallow TE drag is shared byte-for-byte with the family's other plays."
