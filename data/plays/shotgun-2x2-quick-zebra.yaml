notes: |
  Quick-game play built on the zebra (fake-drag) as the primary route. The
  QB's 3-step drop is IDENTICAL to Stick; TE and X push vertical exactly
  like the base clear-outs, and the zebra's first three steps show the same
  out-breaking release the base Stick option route gives versus man — the
  defense reads the same picture. The zebra then pivots back inside and
  crosses underneath for the completion. Member of the Shotgun 2x2
  Quick-Game disguise family (see data/play-families/).

  Mirror to quick-zebra-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "Built on the zebra route (data/routes/zebra.yaml), a documented fake-drag disguise wrinkle. Authored as a disguise twin of shotgun-2x2-stick — the QB drop's first two waypoints are identical to the base play, all members carry the same empty motions block, and the receivers' early release waypoints match the base play's releases (vertical clear-outs; the zebra's out-fake mirrors the base option route's man-beating out-cut) before the routes branch."
