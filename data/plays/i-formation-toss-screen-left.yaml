notes: 'HB screen off Lead Toss. The QB reverse-out, the HB perimeter track, the

  FB lead, and the RG pull are all IDENTICAL to Lead Toss for the first two

  steps — the defense reads toss and flows to the perimeter. The HB then

  slips back behind the LOS and settles into the screen pocket behind the

  LT/LG/C wall. Member of the I-Formation Toss disguise family (see

  data/play-families/).


  Timing window: HB slips on count 2 of the QB''s settle; LT/LG/C hold for a

  1-2 count, then release downfield to form the wall. Mirror to

  toss-screen-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- Screen off the toss sweep is a universal constraint concept. Authored as a disguise twin of i-formation-lead-toss — initial
  action (QB reverse-out, HB/FB tracks, RG pull) deliberately mirrors the base play's first two waypoints exactly.
- Screen OL release timing (1-2 count) follows standard NFL/college screen coaching, consistent with i-formation-hb-screen.
- Mirror of i-formation-toss-screen.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
