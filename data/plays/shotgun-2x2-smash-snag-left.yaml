strengths:
- Two complete concepts — Snag triangle vs anything, Smash as the boundary shot
- The Snag triangle gives a clean man-or-zone read in a tight, quick window
- Smash answers a squatting boundary corner the Snag cannot punish
- HB flat is the built-in hot read against pressure
- Quick rhythm throw — ball is out before a four-man rush gets home
weaknesses:
- Five-man protection once the HB releases — six-man pressure forces the throw
- Both concepts are short to intermediate — limited explosive-play upside
- Snag crowds three routes into one area; a robber in that window is trouble
- Smash is only the answer side — limited if the QB stays on it too long
- QB must read the boundary leverage cleanly pre-snap to pick the right side
best_vs_defense:
- cover-3 (Snag's seam sits in the void, flat stretches the curl-flat defender)
- cover-1 (Snag slant and flat rub man coverage)
- cover-2 with a squatting boundary corner (Smash punishes it)
- zone-blitz (HB flat is the immediate hot answer)
worst_vs_defense:
- cover-1 robber sitting in the Snag seam window
- pattern-match quarters that carries the seam and matches the triangle
- six-man pressure that beats the five-man protection
- bracket coverage rolled to the Snag side
defensive_counters:
- counter_id: snag-window-robber
  pre_snap_look: Single-high shell with a linebacker or safety cheating to the middle hole over the Snag side
  qb_key: Check the middle-of-field defender — sitting in the seam/snag window before the snap
  read_category: safety-shell
  why: The Snag seam is the primary; a robber pre-set in that window takes the rhythm throw and bait-jumps the slant behind
    it.
  typical_against:
  - cover-1 robber
  - cover-3 with a sinking Mike
- counter_id: boundary-corner-squat
  pre_snap_look: Boundary corner squatted tight at 5-6 yards in inside leverage on the X, safety capped over the top
  qb_key: Check the boundary corner — squatted low and inside with a safety above
  read_category: cb-leverage
  why: A low, inside-leverage corner sits the X hitch and the corner-route window both, so the boundary Smash has no clean
    answer.
  typical_against:
  - cover-2 with hard corners
  - cloud to the boundary
- counter_id: overload-pressure
  pre_snap_look: A nickel or linebacker walked up over the Snag-side guard with a single-high look, showing six rushers
  qb_key: Count the rush against the five blockers — the box shows a free runner
  read_category: box-count
  why: Once the HB releases into the Snag flat, only five protect; a six-man pressure gets a free runner before the triangle
    develops.
  typical_against:
  - cover-1 pressure
  - nickel overload blitz
common_uses:
- 3rd-and-short to medium chain-mover
- 1st-and-10 rhythm throw
- Two-minute / hurry-up
- Anytime the defense crowds the box and plays soft on the perimeter
