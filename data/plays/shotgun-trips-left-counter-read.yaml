strengths:
- Two pulling blockers (LT kickout + LG lead) at the QB-keep point of attack
- Counter step + 3-WR look hold defenders
- Reads the EDGE — same conflict as zone-read but with power-scheme blocking
- Three-WR strong side stresses defense to honor pass — fewer box defenders
- Mobile QB becomes a downhill runner with two lead blockers
- Pairs with RPO (slant or bubble) to extend defensive conflict
weaknesses:
- Slow-developing — pullers need ~2.5 sec to arrive
- Requires QB who's a credible runner AND can read EDGE accurately
- Vulnerable to scrape-exchange (LB scraping for QB)
- Predictable as a power play once defense identifies the pull tendency
- QB injury risk on every keep
best_vs_defense:
- 4-3 base with predictable EDGE / over-front
- cover-3 with run-fit LBs
- any defense over-pursuing the perimeter sweep
- nickel personnel (3-WR forces lighter box)
worst_vs_defense:
- scrape-exchange (LB taking QB)
- cover-1 robber (extra defender)
- 8-man fronts (no QB-keep room)
- bear front
common_uses:
- 1st-and-10 base run with mobile QB
- Constraint to inside-zone-read (different read defender, different motion)
- Red-zone scoring concept (QB power inside or HB sweep outside)
- 3rd-and-medium power conversion
- Modern spread-option base from trips
philosophy: spread-option
philosophy_ref: spread-option
era: Mid-2010s onward — counter-read became universal as mobile-QB spread offenses spread through college and into NFL.
famous_examples:
- Eagles under Doug Pederson / Nick Sirianni (Jalen Hurts QB counter)
- Ravens under John Harbaugh (Lamar Jackson designed-runs)
- Modern Power 5 spread programs (Auburn, Ohio State, Oklahoma)
- Bills under Brian Daboll (Josh Allen designed-counter)
