strengths:
- Two complete concepts — Hi-Lo vs zone, Double Slant vs man, the QB picks pre-snap
- HB stays in to protect — a true six-man pocket, rare for a quick-game look
- Hi-Lo puts a hook defender in a true high-low bind on one route stem
- Double Slant is an instant hot answer to pressure
- Under-center look ties to the run game and play-action shells
weaknesses:
- All routes are short to intermediate — limited explosive-play upside
- With the HB in to protect there is no release-outlet if both concepts are covered
- Hi-Lo depends on a defender choosing — a disciplined zone that passes routes off is tougher
- Double Slant is two routes only — easy to bracket if the QB hangs on it
- QB must diagnose the coverage pre-snap to pick the right side
best_vs_defense:
- cover-3 (Hi-Lo high-low bind on the hook/curl defender)
- cover-1 (Double Slant rub frees the inside slant)
- cover-2 (X dig settles in the void between the corner and the safety)
- zone-blitz (Double Slant is the quick hot answer)
worst_vs_defense:
- pattern-match quarters that passes the Hi-Lo routes off cleanly
- cover-1 robber sitting in the dig window
- press-man on both slant receivers, jamming the timing
- any defense content to tackle the short completion
defensive_counters:
- counter_id: hook-defender-depth
  pre_snap_look: The left-side hook/curl defender aligned at depth, eyes to the quarterback, splitting the dig and the shallow
  qb_key: Check the hook defender's depth — already deep enough to carry the dig and break on the shallow
  read_category: lb-depth
  why: The Hi-Lo only works if one defender must choose; a hook defender at depth covers the dig and still drives the shallow,
    beating the high-low.
  typical_against:
  - cover-3 with deep hooks
  - pattern-match quarters
- counter_id: slant-side-press
  pre_snap_look: Both right-side corners pressed with inside leverage on the slant receivers
  qb_key: Check the slant-side corners — pressed and inside, sitting the slant break
  read_category: cb-leverage
  why: Inside-leverage press jams the slant timing and sits the break, removing the quick man-beater and the hot answer at
    once.
  typical_against:
  - cover-1 press
  - cover-0
- counter_id: dig-window-robber
  pre_snap_look: Single-high shell with a safety or linebacker cheating down into the middle hole over the dig
  qb_key: Check the middle-of-field defender — sitting in the dig window before the snap
  read_category: safety-shell
  why: The dig is the primary; a robber pre-set in that window takes the rhythm throw and bait-jumps it for the interception.
  typical_against:
  - cover-1 robber
  - cover-3 with a sinking Mike
common_uses:
- 3rd-and-short to medium chain-mover
- 1st-and-10 rhythm throw off a run-look formation
- Backed-up or protect-the-QB situations (six-man pocket)
- Anytime the defense shows pressure and the protection must hold
