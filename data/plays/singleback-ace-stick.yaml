notes: |
  Y-Stick from the 12-personnel singleback. The stick comes from the in-line
  TE-R rather than a slot WR — a tighter split, but the same option-route
  read (sit vs zone, break out vs man). The HB releases to the flat as the
  LO of the stick/flat combo; Z clears the corner vertically. Quick-game
  answer for the singleback-ace section.

  Mirror to stick-weak by flipping all coordinates.

verification_status: unverified
source_notes:
  - "West Coast / Walsh-tree Y-Stick concept; standard quick-game material. Same concept as singleback-trio-stick, adapted to run the stick from an in-line TE in 12 personnel."
