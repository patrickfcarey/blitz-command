  role: ball_carrier
  is_primary: true
  path:
  - - 0
    - 0
  - - 1
    - 1
  - - -3
    - 3
  - - 3
    - 2
  notes: 'First two waypoints IDENTICAL to QB Power — start the lead-sweep

    track to sell the QB-Power run action, then plant, slip back behind

    the LOS to the weak side, settle into the screen lane, catch the

    screen, and follow the LG and C convoy.

    '
strengths:
- Identical pre-snap look and first-step action to QB Power — the defense cannot tell it from the run
- The QB showing the run himself pulls the rush and the box hard before the screen releases
- LG and C release out front to give the HB a convoy on the catch
- Punishes an aggressive front by using its own upfield rush against it
- Clearout routes vacate the weak side, opening grass for the screen
weaknesses:
- Needs QB Power on tape first — a cold fake does not pull the pursuit
- Timing-dependent — a mistimed release lets defenders read and sit on the screen
- Dead against a defense that does not rush hard or that spies the HB
- Loses yardage badly if a weak-side defender sniffs the screen and beats the linemen out
- The QB must hold the rush long enough without taking a sack
best_vs_defense:
- aggressive four-man rushes that get upfield fast
- blitz-heavy fronts vacating the underneath
- any defense overcommitting to the QB-Power run
- man coverage with the secondary chasing the clearout routes
worst_vs_defense:
- zone defenses with linebackers reading the QB and sitting underneath
- a spy assigned to the HB
- disciplined four-man rushes that stay in lanes
- any defense that has stopped QB Power and stopped respecting it
defensive_counters:
- counter_id: lb-spot-drop-read-screen
  pre_snap_look: Linebackers aligned at pass depth (5+ yards) squared to the QB with eyes in the backfield, not crowding the
    box
  qb_key: Check the LB depth and eyes — backers deep, squared up, reading the QB
  read_category: lb-depth
  why: Linebackers already at depth reading the QB will spot-drop and pass off the clearouts, leaving them free to trigger
    on the screen the moment the HB slips out.
  typical_against:
  - cover-3 zone
  - cover-4
  - any screen-aware defense
- counter_id: contain-rush-no-upfield
  pre_snap_look: Both EDGE defenders in square two-point stances playing contain, hands free, not in get-off sprinter's stances
  qb_key: Scan the edges — both EDGEs squared and squatting, playing contain rather than rushing
  read_category: dl-alignment
  why: A contain rush that does not sell out upfield never vacates the screen lane, so the weak-side EDGE is in position to
    beat the releasing linemen to the HB.
  typical_against:
  - bend-don't-break zone
  - any defense playing the screen
- counter_id: weakside-spy
  pre_snap_look: A linebacker or safety walked into the weak-side underneath, shaded to the HB with no clear coverage or run-fit
    responsibility
  qb_key: Check the weak-side underneath — a defender shaded to the HB with no other job
  read_category: lb-depth
  why: A defender spying the HB mirrors him out of the backfield and arrives at the screen catch point before the convoy of
    linemen can set up.
  typical_against:
  - cover-1 with a back spy
  - QB/RB spy game-plans
common_uses:
- After establishing QB Power for 4+ yards
- 2nd-and-long / 3rd-and-long vs an aggressive rush
- Slowing a hot pass rush
- Catching a blitz-heavy defense vacating the underneath
- Changing pace against a fast-flow front
