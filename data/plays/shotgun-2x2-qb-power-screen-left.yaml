notes: 'Running-back screen off QB Power. The QB''s first two steps attacking the

  strong-side off-tackle hole, the HB lead-sweep release, and the OL

  down-block show are all IDENTICAL to QB Power through the first two

  waypoints — the defense reads the designed QB power run. The HB sells the

  lead-sweep track, then slips back behind the LOS to the weak side; the LG

  and C lead the screen. Member of the Shotgun 2x2 QB-Power disguise family

  (see data/play-families/).


  The QB-Power action pulls the rush and the box one way so the screen

  springs back the other. Mirror to qb-power-screen-left by flipping all

  coordinates.

  '
verification_status: unverified
source_notes:
- Running-back screens off run-game action are a universal modern constraint concept. Authored as a disguise twin of shotgun-2x2-qb-power
  — initial action (QB off-tackle attack, HB lead-sweep release) deliberately mirrors the base play through the first two
  waypoints.
- Mirror of shotgun-2x2-qb-power-screen.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
