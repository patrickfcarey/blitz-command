  notes: 'First two waypoints IDENTICAL to QB Power — attack the strong-side

    off-tackle hole showing the designed QB run, then pull up, drift back

    off the run fake letting the rush come, before flipping the screen

    back to the HB on the weak side. Eyes downfield to hold the rush.

    '
