play_id: singleback-trio-outside-zone
name: Outside Zone (Stretch)
aliases:
  - OZ
  - Stretch
  - Wide Zone

formation: singleback-trio
play_type: run
ball_carrier: HB

motions: []

assignments:
  - player: LT
    role: run_block
    blocking_scheme: zone-reach-playside
    notes: "Reach step playside; if backside DE crashes, scoop to backside LB."
  - player: LG
    role: run_block
    blocking_scheme: zone-reach-playside
    target: 1-or-3-tech
  - player: C
    role: run_block
    blocking_scheme: zone-reach-playside
    target: backside-A-gap
  - player: RG
    role: run_block
    blocking_scheme: zone-reach-playside
    target: 3-tech
    notes: "Reach the 3-tech; if reached, climb to playside LB."
  - player: RT
    role: run_block
    blocking_scheme: zone-reach-playside
    target: 5-tech-or-EDGE
  - player: TE
    role: run_block
    blocking_scheme: reach-block
    target: edge-defender
    notes: "Critical block — reach the EDGE to seal him inside, opening the bounce."
  - player: X
    role: run_block
    blocking_scheme: stalk-or-crack
    target: cornerback
  - player: Z
    role: run_block
    blocking_scheme: stalk-or-crack
    target: cornerback
  - player: SLOT
    role: run_block
    blocking_scheme: stalk
    target: nickel-defender
  - player: QB
    role: handoff
    path: [[0, 0], [1, -1], [-3, -1], [-4, 0]]
    notes: "Open at 6 o'clock to HB, follow with a bootleg fake to the backside (away from the stretch direction)."
  - player: HB
    role: ball_carrier
    is_primary: true
    path: [[0, 0], [4, 1], [6, 5], [8, 9]]
    alt_paths:
      - priority: secondary
        path: [[0, 0], [3, 1], [4, 5], [4, 9]]
        notes: "BANG — if EDGE crashes inside, hit the off-tackle hole."
      - priority: tertiary
        path: [[0, 0], [-1, 2], [-3, 6], [-4, 9]]
        notes: "CUTBACK — if defense overflows playside, cut against the grain."
    notes: |
      Three reads off the EDGE block:
      - PRIMARY (orange) — BOUNCE outside if EDGE is reached
      - SECONDARY (blue) — BANG off-tackle if EDGE crashes inside
      - TERTIARY (lavender) — CUTBACK if defense overflows playside

strengths:
  - Forces playside defenders to flow horizontally
  - Big-play potential when EDGE gets reached
  - Stresses defensive discipline (over-pursuit = cutback)
  - Works against speed defenses
  - Sets up bootleg PA off the same look

weaknesses:
  - Requires athletic OL (especially playside T)
  - Slow-developing — needs ~2 sec to reach playside hole
  - HB must commit to read or play breaks down
  - Vulnerable to playside DE crashing inside
  - Hash position matters (less room from a tight hash)

best_vs_defense:
  - 4-3 fronts
  - cover-3 with run-fit LBs
  - over-front
  - speed defenses
  - undisciplined backside pursuit

worst_vs_defense:
  - bear front
  - 8-man fronts
  - disciplined gap-control fronts
  - cover-1 with EDGE squeezing

defensive_counters:
  - counter_id: wide-9-edge
    pre_snap_look: "Playside DE aligned wide outside the TE's outside shoulder in a wide-9, square in a track stance ready to run upfield"
    qb_key: "Check the playside edge width — DE flared outside the TE's shoulder"
    read_category: dl-alignment
    why: "Outside Zone needs the EDGE reached; a wide-9 alignment puts the DE outside the reach angle, making the seal geometrically impossible and forcing the HB to BANG or CUTBACK into pursuit."
    typical_against: ["over-front", "4-3 with movement"]
  - counter_id: de-wrong-arm-kickout
    pre_snap_look: "Backside DE in a tight, square inside alignment with the backside LB cheated over playside, ready to scrape"
    qb_key: "Scan the backside DE — tight and square inside, not flared for contain"
    read_category: dl-alignment
    why: "A tight, square backside DE is set to chase flat down the line and wrong-arm any kickout; the cutback closes and the HB is forced back into the playside flow."
    typical_against: ["over-front", "4-3 base"]
  - counter_id: fast-flow-lbs
    pre_snap_look: "LBs in a sprinter's stance with weight forward, cheated a half-step toward the stretch side at normal depth"
    qb_key: "Check the LBs — weight-forward sprinter's stance, leaning to the stretch"
    read_category: lb-depth
    why: "OZ depends on combo blocks climbing to the second level; LBs in a weight-forward stance are set to fast-flow and beat the climbing OL to the perimeter before the combo releases."
    typical_against: ["cover-3", "any defense keying HB flow"]

common_uses:
  - 1st-and-10 base run
  - Setting up bootleg PA
  - Two-minute / hurry-up
  - Establishing tempo

philosophy: zone-run
run_concept_ref: outside-zone

era: "1990s onward — Mike Shanahan / Alex Gibbs lineage."

famous_examples:
  - "1990s–2000s Broncos (Terrell Davis ran 1,000+ yards on this concept)"
  - "2010s 49ers (Frank Gore under Mike Shanahan tree)"
  - "Modern Vikings, Dolphins, 49ers (Kyle Shanahan tree)"

tags:
  - zone-run
  - outside-zone
  - stretch
  - any-level
  - high-school
  - college
  - nfl
  - modern

notes: |
  Companion play to inside zone. OL all step playside as a unit; HB stretches
  the run to the perimeter and reads the EDGE block. The bootleg PA off this
  look is one of the most lethal tendency-breakers in football.

verification_status: unverified
source_notes:
  - "Assignments: Alex Gibbs / Mike Shanahan zone tradition."
  - "Strengths/weaknesses: modern run-game textbook material."
  - "Web validated 2026-04-29 — SumerSports 'Shanahan Schemes' (https://sumersports.com/the-zone/shanahan-schemes/); The Ringer 'Shanahan System' (https://www.theringer.com/2020/01/22/nfl/kyle-mike-shanahan-zone-blocking-raheem-mostert-running-backs); vIQtory Sports 'Outside Zone Install Guide' (https://www.viqtorysports.com/complete-outside-zone-guide-tutorial/); Mile High Report 'Hacking the Broncos OZ' (https://www.milehighreport.com/2022/1/31/22907767/film-breakdown-broncos-outside-zone). Confirmed: HB sets track to outside hip of TE, reads gaps outside-in; reach-blocking from playside T."
flip_reads:
- flip_id: three-tech-callside
  pre_snap_look: The 3-technique tackle and the playside linebacker are both set to the called
    side, loading the front-side gaps the zone is aiming for.
  qb_key: Find the 3-technique — it is aligned to the called side, in the zone's path.
  read_category: dl-alignment
  flip_to: mirror-play
  why: Zone run into the 3-technique blocks the penetrator head-on; flipping the zone away runs
    at the lighter shade and a cleaner front-side double.
  typical_against:
  - over-front
  - shifted 4-3
- flip_id: strength-declared-to-formation
  pre_snap_look: Defense has declared to the formation's strength — an extra box defender to the
    strong side with a safety rolled down to support it.
  qb_key: Check the strength side — the box count and the safety roll are both committed to it.
  read_category: safety-shell
  flip_to: mirror-formation
  why: Flipping the whole formation re-locates the strength call; a defense slow to re-set leaves
    the front-side gaps the zone wants unfilled.
  typical_against:
  - cover-3 with strong roll
  - quarters with strong roll
