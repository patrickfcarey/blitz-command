notes: 'Quick pop pass off the jet fake. The jet motion is IDENTICAL to Jet

  Sweep — SLOT-W motions full-speed and the ball is snapped on the move —

  and the QB''s first two steps riding the jet mesh are identical to the Jet

  Sweep handoff. The QB then pulls it and fires a one-hitch pop pass to the

  TE in the seam behind the run-flow linebackers, while SLOT-W and the HB

  run their Jet Sweep fakes. Member of the Shotgun 2x2 Jet disguise family

  (see data/play-families/).


  Mirror to jet-pop-pass-left by motioning Z across and flipping all

  coordinates.

  '
verification_status: unverified
source_notes:
- The pop pass off jet/fly-sweep motion is a universal modern constraint concept. Authored as a disguise twin of shotgun-2x2-jet-sweep
  — the jet motion block is byte-identical to the base play and the QB's first two path waypoints mirror the Jet Sweep handoff.
- Mirror of shotgun-2x2-jet-pop-pass.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
