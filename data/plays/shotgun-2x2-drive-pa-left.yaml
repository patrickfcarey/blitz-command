notes: 'Play-action pass off the inside-zone run, throwing the Drive concept. The

  empty motion block and the QB''s first two drop steps are IDENTICAL to the

  Drive base — the defense reads the same dropback look until the HB mesh

  shows run. The run fake holds the linebackers, emptying the window the Z

  dig settles into while the TE drag arrives behind the run flow. Member of

  the Shotgun 2x2 West Coast Drive disguise family (see data/play-families/).


  Mirror to drive-pa-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- Play-action off the zone run feeding a crossing concept is a universal West Coast constraint. Authored as a disguise twin
  of shotgun-2x2-drive — empty motions block and the QB's first two drop waypoints deliberately mirror the base play.
- Mirror of shotgun-2x2-drive-pa.yaml — path waypoints flipped on x; formation reference points to the mirror formation. Routes
  auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed look
  — coordinates and paths are the source of truth.
