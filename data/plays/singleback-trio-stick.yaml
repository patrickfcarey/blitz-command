play_id: singleback-trio-stick
name: Stick (Strong)
aliases:
  - Y-Stick
  - Stick Concept
  - Stick-Out

formation: singleback-trio
play_type: pass
ball_carrier: QB
primary_read: SLOT
secondary_read: TE
checkdown: HB

# Mandatory motion: SLOT must shift to the strong side as the inner slot
# so the stick concept fires to the strong side with a vertical clear-out
# from Z. Without the motion, the play becomes a weak-side stick.
motions:
  - player: SLOT
    type: mandatory
    motion_type: short-across
    end_position: { x: 6.0, y: -1.0 }
    notes: "SLOT motions across to become the strong-side inner slot at snap."

assignments:
  - player: LT
    role: pass_block
    blocking_scheme: man-protection
  - player: LG
    role: pass_block
    blocking_scheme: man-protection
  - player: C
    role: pass_block
    blocking_scheme: man-protection
  - player: RG
    role: pass_block
    blocking_scheme: man-protection
  - player: RT
    role: pass_block
    blocking_scheme: man-protection
  - player: TE
    role: route
    route_name: flat
    depth_yd: 3
    notes: "TE releases to the strong-side flat as the LO option."
  - player: X
    role: route
    route_name: comeback
    depth_yd: 14
    notes: "Backside comeback for late-window throw if strong-side covered."
  - player: Z
    role: route
    route_name: clear-out-go
    depth_yd: 25
    notes: "Vertical to clear the strong-side corner out of the stick window."
  - player: SLOT
    role: route
    route_name: stick
    depth_yd: 6
    is_primary: true
    notes: |
      Option route: push to 6 yds and:
      - sit in the soft spot vs zone (cover-2/3)
      - break out to the sideline vs man (cover-1)
  - player: QB
    role: ball_carrier
    path: [[0, 0], [0, -1], [0, -2]]
    notes: "3-step drop from shotgun depth, throw stick on rhythm. Pre-snap read: if MIKE walks out, SLOT wins. If MIKE stays inside, TE flat wins."
  - player: HB
    role: pass_block
    blocking_scheme: man-protection
    notes: "Pass-protect; release as checkdown only if pressure clears."

strengths:
  - Quick-game concept (3-step drop, fast throw)
  - Wins vs zone (sit in soft spot) and man (break out to sideline)
  - Easy first-down concept on 3rd-and-short / 3rd-and-medium
  - Pre-snap read tells QB which option will be open
  - Pairs naturally with vertical clear-outs

weaknesses:
  - Limited to short throws (5–7 yards)
  - SLOT WR must read coverage correctly mid-route
  - Vulnerable to LB carry-and-cushion on the stick
  - Won't break for big plays
  - Bracket on slot kills it

best_vs_defense:
  - cover-2 zone (sit in soft spot between corner and safety)
  - cover-3 (sit between the curl and flat defender)
  - cover-1 man (break out to the sideline)
  - any defense with predictable underneath spacing

worst_vs_defense:
  - bracket coverage on the slot
  - banjo / pattern-match
  - cover-2 robber
  - any defense with a hot underneath defender on the slot

common_uses:
  - 3rd-and-short / 3rd-and-medium
  - 1st down chains
  - Hot read against blitz
  - Quick-game tempo

philosophy: pro-style
pass_concept_ref: stick
philosophy_ref: pro-style

era: "Originated in the Bill Walsh / Paul Brown West Coast tradition; modernized through Erhardt-Perkins, Andy Reid, and modern spread offenses."

famous_examples:
  - "Patriots offense (Belichick / Brady era)"
  - "Andy Reid offense (Eagles, Chiefs)"
  - "Modern spread college offenses"

tags:
  - pass
  - spread
  - quick-game
  - stick
  - west-coast
  - any-level
  - high-school
  - college
  - nfl

notes: |
  Stick is an option route — the slot reads coverage and either sits (vs
  zone) or breaks out (vs man). The mandatory SLOT motion across creates
  a strong-side stick concept; without the motion the play would have to
  fire to the weak-side slot.

