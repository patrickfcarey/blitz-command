notes: 'West Coast slant/flat quick-game play disguised off Stick. The QB''s 3-step

  drop is IDENTICAL to Stick, and the receivers take the same early vertical

  releases (X and Z stem vertical exactly like the base clear-out and option

  routes, TE pushes vertical exactly like the base clear-out) before the

  routes branch into the slant/flat hi-lo. The defense reads the same picture

  as Stick. SLOT-W releases flat immediately — a flat route cannot match a

  vertical stem, an inherent limitation of the concept. Member of the Shotgun

  2x2 Quick-Game disguise family (see data/play-families/).


  Mirror to slant-flat-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- Slant/flat is a textbook Bill Walsh West Coast quick-game concept — a flat defender hi-lo read off the 3-step drop. Authored
  as a disguise twin of shotgun-2x2-stick — the QB drop's first two waypoints are identical to the base play, all members
  carry the same empty motions block, and the receivers' early release waypoints match the base play's vertical stems before
  the routes branch (the SLOT-W flat is the one route that releases outside immediately, an inherent property of the flat
  route).
- Mirror of shotgun-2x2-slant-flat.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
