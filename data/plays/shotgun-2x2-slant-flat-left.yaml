strengths:
- Identical pre-snap look, QB drop, and early receiver releases to Stick — the defense cannot tell it apart
- Classic West Coast hi-lo — the flat defender is wrong on the flat or wrong on the slant
- Slant is a built-in blitz beater — ball out on the 3-step rhythm before pressure arrives
- Yards-after-catch concept — the slant catches in stride with grass ahead
- Mirrored quick hitter — the Z slant gives the QB an answer to the strong side
weaknesses:
- Limited big-play potential — slant and flat are short, YAC-dependent throws
- A flat defender with depth and discipline can wall the slant and squeeze the flat
- Inside-leverage press man on the slant receivers chokes the break
- Cover-2 corners squatting on the flat take away the easy LO
- QB must read the flat defender quickly — a wrong read is a no-throw
best_vs_defense:
- cover-3 (slant behind the curl-flat defender, flat underneath him)
- cover-1 (slant beats trailing man, flat is the leverage outlet)
- any defense that blitzes off the edge — the slant is the hot answer
- off-coverage corners giving a free release to the slant
worst_vs_defense:
- cover-2 with corners squatting hard on the flat
- inside-leverage press man on the slot
- bracket coverage on the slant receivers
- disciplined zone with a flat defender who carries the slant
defensive_counters:
- counter_id: squat-flat-corner
  pre_snap_look: Strong-side and weak-side corners squatted at 5-7 yards depth, eyes inside, shaded to the flat rather than
    bailing to a deep third
  qb_key: Check the corners' depth and eyes — squatted short, looking inside at the flat
  read_category: cb-leverage
  why: A squatted corner sits on the flat route and is in position to drive the slant from outside-in, taking both legs of
    the hi-lo on the 3-step rhythm.
  typical_against:
  - cover-2
  - cover-2 invert
  - quarters with squat corners
- counter_id: inside-press-slot
  pre_snap_look: Nickel and SAM pressed inside-leverage on both slots, foot up inside, no deep-middle safety showing
  qb_key: Check slot-defender leverage — pressed with the inside foot up, no middle help
  read_category: cb-leverage
  why: Inside-leverage press man kills the slant break — the defender is already where the route wants to go — and the trailing
    leverage smothers the flat, leaving nowhere to throw.
  typical_against:
  - cover-1
  - cover-0
  - sticky man-match
- counter_id: flat-side-pressure
  pre_snap_look: Weak-side nickel walked up on the LOS over the slot (toes on the line, hand low), single-high safety shell
    behind
  qb_key: Scan the slot defender — walked up on the line with only one high safety
  read_category: lb-depth
  why: A nickel on the line over the slot is a free runner; with the HB in protection the QB must rely on the slant as the
    hot throw, and inside leverage on that slant leaves no built-in answer.
  typical_against:
  - cover-1 zero-pressure
  - fire-zone
  - nickel pressure packages
common_uses:
- 3rd-and-short / 3rd-and-medium
- 1st-down chains
- Anti-blitz hot read — the slant is the built-in answer
- Quick-game tempo
- Moving the chains after Stick has been on tape
