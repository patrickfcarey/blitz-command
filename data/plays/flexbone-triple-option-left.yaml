  notes: "TWO READS in sequence (the \"triple\" mechanic):\n1. DIVE READ: Read the playside EDGE (typically 5-tech DE).\n\
    \   - EDGE crashes inside on FB → PULL the ball, attack the corner with SLOT-R\n   - EDGE plays QB / contains → GIVE to\
    \ FB on dive (FB hits inside)\n2. PITCH READ (only if QB pulled): Read the playside FORCE defender (OLB or strong safety).\n\
    \   - Defender plays QB → PITCH to SLOT-R\n   - Defender plays the pitch → KEEP the ball, turn upfield\n"
