    - 0
  - - 0
    - 2
  - - -1
    - 4
  - - -2
    - 6
  notes: 'Dive path: receive QB read, hit between RG and RT (B-gap aim point).'
- player: SLOT-L
  role: run_block
  blocking_scheme: arc-block
  target: backside-safety
  notes: Backside slot arcs to seal the FS / backside safety.
- player: SLOT-R
  role: lead_block
  target: pitch-relationship
  path:
  - - 0
    - 0
