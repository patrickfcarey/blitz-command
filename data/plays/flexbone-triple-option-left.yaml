  notes: Pitch back — runs at full speed, stays 4 yards behind and outside the QB. Receives pitch if QB reads keep-or-pitch
    correctly.
strengths:
- Modern triple-option mechanic — three ball-carrier threats from one snap
- Slot-back at slot depth = faster pitch arrival than wishbone HBs
- Numbers advantage when option works (3 ball-carriers vs every defender)
- FB dive is the foundation — sets up everything else
- Backside slot arc seals the FS — opens cutback if pitch is killed
- Service-academy base play
weaknesses:
- Slow-developing — needs ~2.5 sec for option to develop
- Requires QB who's a credible runner AND can pitch accurately
- Modern fast defenses with disciplined option-fits neutralize triple threat
- Vulnerable to scrape-exchange (DE plays QB, LB takes pitch)
- FB has to be physical — runs into traffic on every snap
best_vs_defense:
- 4-3 base with predictable EDGE play
- any defense unprepared for option football
- speed-flow defenses that over-pursue
- cover-3 with run-fit ILBs
worst_vs_defense:
- disciplined option-fit defenses (academies, prep matters)
- scrape-exchange from playside ILB
- cover-1 robber (extra defender)
- 8-man fronts
common_uses:
- Flexbone base play — most-called concept
- 1st-and-10 base run vs 4-3 / 3-4 base defenses
- Setting up midline option, counter option from same look
- Goal-line / red-zone (FB dive becomes the run)
- Service-academy base offense
philosophy: option
run_concept_ref: triple-option-veer
era: 1980s onward — Fisher DeBerry Air Force; popularized through Paul Johnson Navy / Georgia Tech systems.
