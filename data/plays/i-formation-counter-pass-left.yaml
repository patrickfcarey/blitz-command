notes: 'Play-action pass off Counter Trey. The QB reverse-out, the HB counter-step

  off-tackle fake, the FB lead, the LG and LT pulls, and the OL down-block

  show are all IDENTICAL to Counter Trey through the first two waypoints —

  the defense reads Counter. The QB then settles in the pocket and throws

  the TE drag behind the run-flow linebackers. Member of the I-Formation

  Counter disguise family (see data/play-families/).


  Mirror to counter-pass-left by flipping all coordinates.

  '
