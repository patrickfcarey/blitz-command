source_notes:
- Play-action off the counter run is a universal constraint concept. Authored as a disguise twin of i-formation-counter-trey
  — initial action (QB reverse-out, HB counter step, FB track, LG/LT pulls) deliberately mirrors the base play through the
  first two waypoints, and all members carry the same empty motions block.
- Mirror of i-formation-counter-pass.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
