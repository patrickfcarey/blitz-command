notes: |
  Snag-concept quick-game play disguised off Stick. The QB's 3-step drop is
  IDENTICAL to Stick, and the receivers take the same early vertical
  releases (Z and SLOT-W stem vertical exactly like the base option routes,
  TE and X push vertical exactly like the base clear-outs) before the
  routes branch into the snag triangle. The defense reads the same picture
  as Stick. Member of the Shotgun 2x2 Quick-Game disguise family (see
  data/play-families/).

  Mirror to quick-snag-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "Snag is a textbook pro-style quick-game concept. Authored as a disguise twin of shotgun-2x2-stick — the QB drop's first two waypoints are identical to the base play, all members carry the same empty motions block, and the receivers' early release waypoints match the base play's vertical stems before the routes branch."
