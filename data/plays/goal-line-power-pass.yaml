notes: |
  Play-action pass off Goal Line Power. The QB reverse-out, the HB
  off-tackle fake, the FB lead, the LG pull, and the OL down-block show
  are all IDENTICAL to Goal Line Power through the mesh — the defense
  reads Power. The QB then settles in the pocket and throws the TE-R
  corner once the goal-line linebackers trigger on the run fake. Member
  of the Goal Line Power disguise family (see data/play-families/).

  Mirror to goal-line-power-pass-left by flipping all coordinates.

verification_status: unverified
source_notes:
  - "Play-action off goal-line power is a universal red-zone constraint concept. Authored as a disguise twin of goal-line-power — initial action (QB reverse-out, HB/FB tracks, LG pull) deliberately mirrors the base play's first two waypoints exactly."
