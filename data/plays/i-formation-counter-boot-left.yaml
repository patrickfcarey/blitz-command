strengths:
- Identical pre-snap look and first-step action to Counter Trey — indistinguishable from the run early
- QB on the move — easier throws, fewer pass-rush angles
- Counter Trey already sells a backside boot fake (the QB reverse-out), so the boot is the most natural twin
- The counter step plus PA fake holds run-flow linebackers, opening the TE drag
- High completion percentage once Counter is respected
weaknesses:
- Needs Counter Trey on tape first — a cold fake holds no one
- Boot-side EDGE defender is unblocked or chipped at best
- Field cut in half — only the boot side is live
- Slow-developing — needs ~4 seconds to reach the launch point
- Throwing back across the field is high-risk
best_vs_defense:
- cover-3 with run-fit linebackers
- 4-3 with predictable LB flow
- any defense overcommitting to Counter or Power
- single-high coverages
worst_vs_defense:
- two-high shells with LBs at pass depth
- safety blitz from the boot side
- cover-2 with a corner playing edge contain
- any defense not biting the Counter fake
defensive_counters:
- counter_id: alert-zone-no-bite
  pre_snap_look: Linebackers aligned at full passing depth (5+ yards off the LOS) under a two-high safety shell, not crowding
    the box
  qb_key: Check the LB depth and safety shell — backers deep, two-high behind them
  read_category: lb-depth
  why: Linebackers already at pass depth read pass first; they will not vacate on the Counter fake, so the TE drag arrives
    into a populated zone.
  typical_against:
  - cover-4
  - cover-3 alert
  - any defense after Counter has been slowed
- counter_id: rush-the-boot-edge
  pre_snap_look: Boot-side EDGE in a wide-9 sprinter's stance with no blocker assigned to him
  qb_key: Scan the boot-side edge — EDGE flared wide-9, weight forward, uncovered
  read_category: dl-alignment
  why: A wide-9 EDGE in a get-off stance with no blocker crashes upfield and flushes the QB before the rollout reaches its
    launch point.
  typical_against:
  - cover-1 with edge pressure
  - any defense with a free runner off the boot side
- counter_id: squat-flat-corner
  pre_snap_look: Boot-side CB aligned tight at 5-6 yards with inside leverage and a safety capped over the top of him
  qb_key: Check the boot-side corner — CB squatted low and inside with a safety overlapping above
  read_category: cb-leverage
  why: A low, inside-leverage corner with deep safety help is free to trigger down on the FB flat, removing the rolling QB's
    safety-valve outlet.
  typical_against:
  - cover-2 with hard corners
  - quarters with cloud rotation
common_uses:
- After establishing Counter Trey for 4+ yards
- 1st-and-10 play-action shot
- 3rd-and-medium moving-pocket throw
- Red-zone moving-target passing
