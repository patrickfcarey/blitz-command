notes: 'Play-action bootleg off Counter Trey. The QB reverse-out, the HB

  counter-step off-tackle fake, the FB lead, the LG and LT pulls, and the

  OL down-block show are all IDENTICAL to Counter Trey through the first

  two waypoints — and the Counter reverse-out already sells a backside boot

  fake, so the boot is the most natural disguise twin of the run. The QB

  keeps it and boots backside with a three-level read (TE drag / FB flat /

  X comeback). Member of the I-Formation Counter disguise family (see

  data/play-families/).


  Mirror to counter-boot-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- Bootleg off the counter run is a universal constraint concept. Authored as a disguise twin of i-formation-counter-trey —
  initial action (QB reverse-out, HB counter step, FB track, LG/LT pulls) deliberately mirrors the base play through the first
  two waypoints, and all members carry the same empty motions block.
- Mirror of i-formation-counter-boot.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
