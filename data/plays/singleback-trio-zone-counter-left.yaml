philosophy_ref: zone-run
era: Modern — pairing a gap-scheme counter with zone-run action is a staple of every modern run game; the counter punishes
  a defense that has learned to fly to the zone.
famous_examples:
- Modern NFL teams pairing counter with their 11-personnel zone run game
- Spread college programs running counter off an established zone identity
