notes: 'Counter off Inside Zone from the 11-personnel singleback trio set. The

  QB reverse-pivot and the HB bang track are IDENTICAL to singleback-trio-

  inside-zone for the first two path waypoints — the defense reads the

  zone run and flows playside. The ball then goes BACKSIDE: the LT kicks

  out the backside edge, the RG pulls and wraps, and the HB cuts back

  behind the convoy. With no FB, the counter leans on the single guard

  pull plus the tackle kickout. Member of the Singleback Trio Zone

  disguise family (see data/play-families/).


  Mirror to zone-counter-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- The gap-scheme counter run off zone action is a universal modern constraint concept. Authored as a disguise twin of singleback-trio-inside-zone
  — the QB reverse-pivot and HB bang track deliberately mirror the base play's first two path waypoints exactly; the LT's
  switch from backside zone step to kickout and the RG's switch from zone-combo to pull are the structural changes that build
  the counter.
- Mirror of singleback-trio-zone-counter.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
flip_reads:
- flip_id: front-overshift-callside
  pre_snap_look: Defensive front slid toward the called side — an extra down lineman or a walked-up
    linebacker puts +1 in the called-side box.
  qb_key: Count the box side to side — the called side has one more hat than the backside.
  read_category: box-count
  flip_to: mirror-play
  why: Running a gap scheme into the overshift is into the teeth; flipping the play attacks the
    lighter box with the same blocking math.
  typical_against:
  - over-front
  - shifted 4-3
- flip_id: strength-declared-to-formation
  pre_snap_look: Defense has fully declared to the formation's strength — an extra box defender
    to the strong side and a safety rolled down over it.
  qb_key: Check the strength side — both the box count and the safety roll are committed to it.
  read_category: safety-shell
  flip_to: mirror-formation
  why: When the defense keys the formation's strength, flipping the whole formation forces a re-declare
    and the run hits the side they vacated.
  typical_against:
  - cover-3 with strong roll
  - 8-man fronts
