strengths:
  - "Direct snap to RB1 with two pulling guards = extreme numbers advantage at edge"
  - "Multiple lead blockers (pulling LG + pulling RG + RB2 + SLOT crack)"
  - "Speed advantage — RB1 already moving at the snap"
  - "Surprise factor in modern football"
