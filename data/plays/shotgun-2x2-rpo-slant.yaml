play_id: shotgun-2x2-rpo-slant
name: RPO Slant (Strong)
aliases:
  - Slant RPO
  - Inside Zone Slant RPO
  - Glance RPO

formation: shotgun-2x2
play_type: rpo
ball_carrier: QB
primary_read: Z

motions: []

assignments:
  - player: LT
    role: run_block
    blocking_scheme: zone-step-playside
    notes: "Run block — OL stays at LOS (RPO: no downfield release)."
  - player: LG
    role: run_block
    blocking_scheme: zone-combo
  - player: C
    role: run_block
    blocking_scheme: zone-combo
  - player: RG
    role: run_block
    blocking_scheme: zone-combo
  - player: RT
    role: run_block
    blocking_scheme: zone-combo
  - player: TE
    role: run_block
    blocking_scheme: zone-step-playside
    target: edge-defender
  - player: X
    role: route
    route_name: clear-out-go
    depth_yd: 18
    notes: "Backside clear-out — pull weak-side corner deep."
  - player: SLOT-W
    role: run_block
    blocking_scheme: stalk
    notes: "Weak-side slot stalk-blocks if QB hands off; otherwise becomes outlet."
  - player: Z
    role: route
    route_name: slant
    depth_yd: 5
    is_primary: true
    notes: "Strong-side slant — RPO primary throw. Breaks at 5 yds, runs through the soft spot."
  - player: QB
    role: ball_carrier
    path: [[0, 0], [-1, -1], [0, -1]]
    notes: |
      Catch the gun snap, mesh with the HB at (-1, -1) — extend the ball toward
      the HB, who is aligned to the QB's left — then pull up to (0, -1) and set
      square to throw the slant. Quick rhythm: do not drop deeper.
      Read the strong-side LB / nickel defender:
      - LB drops in coverage / sits → GIVE to HB on inside zone
      - LB attacks the run / vacates throwing window → PULL + throw slant to Z
      Decision at the mesh point. OL is run-blocking.
  - player: HB
    role: ball_carrier
    path: [[0, 0], [1, -1], [-1, 1], [0, 5]]
    notes: "Step to mesh at (1,-1) — toward the QB at center — take the handoff, attack playside A/B gap. If QB pulls and throws, HB has executed his fake."

strengths:
  - Defensive conflict — strong-side LB CAN'T cover both run and slant
  - Quick-rhythm throw (slant breaks at 5 yds — fast release)
  - Easy first-down RPO concept
  - Modern foundational concept across HS/college/NFL
  - Pairs with downhill inside zone for run-game balance

weaknesses:
  - Requires QB read accuracy at the mesh point
  - OL must NOT release downfield (penalty risk if they push past 1-3 yds)
  - Defenses with disciplined LB read-keys neutralize the conflict
  - Slant can be jumped by aggressive corner
  - NFL ineligible-downfield rules are stricter than NCAA — limits how far OL can push

best_vs_defense:
  - cover-3 with run-fit LBs
  - 4-3 with crashing strong-side LB
  - any defense with apex/box LB conflict on RPO reads

worst_vs_defense:
  - cover-2 with squatting nickel on slant
  - cover-4 with disciplined LB read-keys
  - bracket on Z
  - blitz from the slant side

defensive_counters:
  - counter_id: read-defender-slow-play
    pre_snap_look: "Strong-side conflict LB / nickel aligned at a mid-depth split (4-5 yds), squared up at the LOS with feet quiet — neither walked into the box nor dropped into the slant window"
    qb_key: "Check the conflict LB / nickel — squared up at a mid-depth split, feet still"
    read_category: lb-depth
    why: "A conflict defender pre-set at a non-committal mid-depth alignment can read-and-react to either phase, making both the give and the slant look covered enough to force a QB hesitation or wrong decision."
    typical_against: ["disciplined cover-3 / cover-4 RPO defenses", "any defense with RPO triangle rules"]
  - counter_id: sticky-man-slant
    pre_snap_look: "Strong-side corner pressed on Z with the inside foot up, no deep safety help showing to the slant side"
    qb_key: "Check the strong-side CB leverage — pressed inside-foot-up with no deep help"
    read_category: cb-leverage
    why: "An inside-leverage press corner is set to drive on the 5-yd slant break and undercut the throw, turning the RPO pull into an interception or PBU."
    typical_against: ["cover-1", "cover-0", "match coverages with inside-leverage CB"]
  - counter_id: second-level-box
    pre_snap_look: "MIKE and strong-side LB both widened toward the strong-side hash sitting in the slant window, with a safety walked down to 6-8 yds, eyes in the backfield"
    qb_key: "Count the box — extra hat down with the LBs widened into the slant window"
    read_category: box-count
    why: "LBs pre-set in the hook/curl close the slant lane while the walked-down safety adds a +1 on the give — both phases of the RPO are answered before the snap."
    typical_against: ["robber coverages", "cover-1 with rolled-down SS", "quarters with SS in the box"]

common_uses:
  - 1st-and-10 base RPO call
  - 2nd-and-medium
  - College spread base
  - High school spread offenses (RPO has trickled down rapidly)
  - Setting up vertical shots when defense over-rotates to slant

philosophy: spread-option
philosophy_ref: spread-option

era: "Mid-2010s onward — RPO trend made this a base call across all levels."

famous_examples:
  - "Eagles under Doug Pederson / Nick Sirianni"
  - "Chiefs under Andy Reid (Mahomes era)"
  - "Modern Power 5 college (Alabama, Ohio State, Auburn)"
  - "HS spread programs across the country"

tags:
  - rpo
