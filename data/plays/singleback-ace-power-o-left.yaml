source_notes:
- 12-personnel power scheme; standard modern adaptation of classic Power O.
- Mirror of singleback-ace-power-o.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
