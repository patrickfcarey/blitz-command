strengths:
- 12 personnel singleback gives 7-blocker surface
- Both edges sealed (TE-L cuts backside, TE-R kicks out playside)
- Pulling LG provides lead block through the hole
- Defense forced to honor pass with 2 WRs split — can't over-load box freely
- Symmetric pre-snap look — defense can't shade run direction
weaknesses:
- No FB lead block (singleback limitation) — LG pull IS the lead
- Slow-developing relative to dive
- HB must hit the hole on first read
- Vulnerable to playside DT penetration before down-blocks are set
- Backside DE who chases hard kills cutback option
best_vs_defense:
- over-front (gives down-block angles)
- cover-3 with single safety
- 4-3 base
- any defense with predictable LB flow
worst_vs_defense:
- bear front
- 8-man fronts
- cover-1 robber
- penetrating playside 1-tech
common_uses:
- 1st/2nd-and-short — modern 12-personnel power
- Red-zone runs (4-12 yard line)
- Setting up PA shots off the same look
- 4-minute offense
