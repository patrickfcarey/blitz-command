notes: 'Counter off Goal Line Power. The QB reverse-out, the HB off-tackle jab

  step, the FB playside lead step, and the LG pull are all IDENTICAL to

  Goal Line Power for the first two path waypoints — the defense reads

  Power and flows playside. The ball then goes BACKSIDE: TE-L kicks out

  the backside edge, the LG keeps pulling and wraps, the RG pulls as the

  second blocker, and the HB cuts back behind the convoy. Member of the

  Goal Line Power disguise family (see data/play-families/).


  Mirror to goal-line-power-counter-left by flipping all coordinates.

  '
verification_status: unverified
source_notes:
- The counter off a power look is a universal short-yardage misdirection concept (Counter Trey lineage — Joe Gibbs / Joe Bugel
  Redskins). Authored as a disguise twin of goal-line-power — the QB/HB/FB/LG initial action deliberately mirrors the base
  play's first two path waypoints exactly; only TE-L's assignment (down-block to kickout) and the RG's assignment (down-block
  to pull) change to open the counter hole.
- Mirror of goal-line-power-counter.yaml — path waypoints flipped on x; formation reference points to the mirror formation.
  Routes auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed
  look — coordinates and paths are the source of truth.
flip_reads:
- flip_id: front-overshift-callside
  pre_snap_look: Defensive front slid toward the called side — an extra down lineman or a walked-up
    linebacker puts +1 in the called-side box.
  qb_key: Count the box side to side — the called side has one more hat than the backside.
  read_category: box-count
  flip_to: mirror-play
  why: Running a gap scheme into the overshift is into the teeth; flipping the play attacks the
    lighter box with the same blocking math.
  typical_against:
  - over-front
  - shifted 4-3
- flip_id: strength-declared-to-formation
  pre_snap_look: Defense has fully declared to the formation's strength — an extra box defender
    to the strong side and a safety rolled down over it.
  qb_key: Check the strength side — both the box count and the safety roll are committed to it.
  read_category: safety-shell
  flip_to: mirror-formation
  why: When the defense keys the formation's strength, flipping the whole formation forces a re-declare
    and the run hits the side they vacated.
  typical_against:
  - cover-3 with strong roll
  - 8-man fronts
