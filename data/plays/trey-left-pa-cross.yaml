  notes: 'Fake handoff to HB (lateral pivot), then drop straight back to ~7 yd depth.

    Y-Cross primary — read the FS:

    - FS bites on Z post → throw TE-R cross underneath

    - FS carries TE-R cross → throw Z post over the top

    - LBs sink in coverage → throw SLOT flat or TE-L drag

    '
- player: HB
  role: fake
  notes: Sell run fake hard; check release as outlet only if pressure forces.
strengths:
- 12 personnel sells PA hard (defense expects run)
- Y-Cross attacks the seam between safety and inside LBs
- Z post forces safety to choose
- TE-R is the canonical Y-Cross receiver — better mismatch than a pure WR
- Backside TE-L drag adds 4th option not available in 11 personnel
- Setup play after establishing run game
weaknesses:
- QB takes 4-5 sec to deliver — pass protection critical
- Defense playing pass keys (no PA bite) makes it predictable
- Vulnerable to nickel/dime defenses that don't honor 12P run
- Bracket on TE-R neutralizes primary
- 12 personnel slower release than 11
best_vs_defense:
- cover-2 (TE-R cross attacks safety hole, Z post pulls FS)
- cover-3 (Y-Cross attacks curl/flat seam)
- any defense biting on play-action
- base 4-3 / 3-4 (matchup advantages on TE-R)
worst_vs_defense:
- cover-2 robber (extra defender in middle hole)
- cover-4 (two deep safeties bracket TE-R)
- aggressive zero blitz (no time to develop)
- any pass-only defense ignoring the fake
common_uses:
- 1st-and-10 after a power run for 4+ yards
- 2nd-and-medium PA shots
- Red-zone window plays
- Setting up future plays off the same look
philosophy: pro-style
era: 1980s onward — Coryell origin; modernized through Mumme/Leach Air Raid '95'.
famous_examples:
- Bill Walsh 49ers play-action library
- Norv Turner / Ernie Zampese (Coryell tree)
- Andy Reid 12-personnel PA shots
- Patriots PA cross (Gronkowski era)
