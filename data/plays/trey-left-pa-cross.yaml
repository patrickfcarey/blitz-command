notes: 'Same Y-Cross concept as i-formation-pa-cross.yaml but from 12-personnel

  Trey. The 12P version is harder for defenses to read because both TEs

  are eligible — defense can''t shade coverage to "the TE" since there are

  two. SLOT flat outlet replaces FB flat from the I-Form version.

  '
