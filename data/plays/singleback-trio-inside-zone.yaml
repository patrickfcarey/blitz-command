play_id: singleback-trio-inside-zone
name: Inside Zone
aliases:
  - IZ
  - Inside Stretch
  - Bang

formation: singleback-trio
play_type: run
ball_carrier: HB

motions: []

assignments:
  - player: LT
    role: run_block
    blocking_scheme: zone-step-playside
    notes: "Backside tackle: zone step playside; if uncovered, climb to backside LB."
  - player: LG
    role: run_block
    blocking_scheme: zone-combo
    target: backside-DT-then-LB
    notes: "Combo with C on backside DT, climb when DT secured."
  - player: C
    role: run_block
    blocking_scheme: zone-combo
    target: 0-or-1-tech
    notes: "Combo with LG (or RG depending on shade) on the playside or backside DT."
  - player: RG
    role: run_block
    blocking_scheme: zone-combo
    target: 3-tech-then-PSLB
    notes: "Combo with RT on playside DT, climb to playside LB."
  - player: RT
    role: run_block
    blocking_scheme: zone-combo
    target: 3-tech-or-EDGE
  - player: TE
    role: run_block
    blocking_scheme: zone-step-playside
    target: edge-defender
  - player: X
    role: run_block
    blocking_scheme: stalk
    target: cornerback
  - player: Z
    role: run_block
    blocking_scheme: stalk
    target: cornerback
  - player: SLOT
    role: run_block
    blocking_scheme: stalk
    target: nickel-defender
  - player: QB
    role: handoff
    path: [[0, 0], [-1, -1], [-2, -2]]
    notes: "Quick handoff to HB, reverse-pivot for backside bootleg fake."
  - player: HB
    role: ball_carrier
    is_primary: true
    path: [[0, 0], [2, 3], [3, 8]]
    notes: |
      Aim point is the playside A or B gap (terminology varies — Shanahan-tree
      tradition uses B-gap, others use A). Read the playside DT/G combo:
      - BANG (playside A or B gap) if the playside DT is reached cleanly
      - BEND (cut back behind C / backside G) if DT sheds playside
      - BOUNCE (outside the playside tackle) if the front crashes inside

strengths:
  - Most efficient run scheme in modern football
  - HB has multiple read options (bang/bend/bounce)
  - Combo blocks let OL handle penetrating fronts
  - Sets up cutback runs vs over-pursuit
  - Works against any defensive front

weaknesses:
  - Requires athletic OL who can climb to second level
  - HB must read correctly — wrong choice = TFL
  - Slow-developing relative to gap schemes
  - Vulnerable to playside DE shooting outside contain
  - Hard to install cleanly — assignments depend on the front

best_vs_defense:
  - over-front (gives natural combo angles)
  - cover-3 (LB drops away from playside)
  - 4-3 base
  - any defense with stretched LBs

worst_vs_defense:
  - bear front (DT in every gap)
  - 8-man fronts
  - any defense with disciplined gap fits
  - cover-1 robber

defensive_counters:
  - counter_id: backside-c-gap-pressure
    pre_snap_look: "Backside DE shaded inside in a 4i or tight 5-technique, with the backside LB cheated over toward the cutback lane"
    qb_key: "Scan the backside DE shade — 4i / tight 5, inside the tackle"
    read_category: dl-alignment
    why: "Singleback has no FB to insert backside; an inside-shaded backside DE is set to close the BEND lane, leaving the HB no cutback and forcing a BANG into a stacked playside front."
    typical_against: ["over-front", "4-3 base"]
  - counter_id: scrape-lb-over-top
    pre_snap_look: "Playside LB stacked directly behind the 3-tech at normal depth, shoulders square to the LOS"
    qb_key: "Check the playside LB — stacked square behind the 3-tech"
    read_category: lb-depth
    why: "A LB stacked square over the 3-tech is positioned to scrape over the zone-combo and beat the climbing blocker to the designed front-side A/B lane."
    typical_against: ["over-front", "4-3 stack", "3-4 base"]
  - counter_id: slant-dl-playside
    pre_snap_look: "DL set in even alignment but visibly cocked and leaning toward the play call, weight on the playside hand"
    qb_key: "Scan the interior DL stagger — tackles tilted and leaning playside"
    read_category: dl-alignment
    why: "A DL cocked playside telegraphs a slant that creates first-step penetration through the reach blocks, blowing up the combo and forcing a BOUNCE into an unblocked force player."
    typical_against: ["over-front", "any 4-down front with movement calls"]

common_uses:
  - 1st-and-10 base run
  - 2nd-and-medium
  - Working into the run game vs pass-heavy defenses
  - Setting up PA off zone fake

philosophy: zone-run
run_concept_ref: inside-zone

era: "1990s onward — Mike Shanahan / Alex Gibbs Broncos popularized it; now universal."

famous_examples:
  - "1990s–2000s Broncos (Terrell Davis, Clinton Portis)"
  - "Modern NFL (every team runs IZ)"
  - "Stanford under Harbaugh / Shaw"

tags:
  - zone-run
  - inside-zone
  - any-level
  - high-school
  - college
  - nfl
  - modern

notes: |
  The "rules-based" run play. Every OL has a zone step and a defender to
  account for, but no individual defender must be blocked specifically. HB
  reads the playside guard/tackle combo to pick his lane. The bang/bend/
  bounce decision is the hallmark of inside zone.

verification_status: unverified
source_notes:
  - "Assignments: standard inside zone coaching (Alex Gibbs / Mike Shanahan tradition)."
  - "Strengths/weaknesses: modern run-game textbook material."
  - "Web validated 2026-04-29 — SumerSports 'Shanahan Schemes' (https://sumersports.com/the-zone/shanahan-schemes/); BigSkillPosition 'Inside Zone' (https://bigskillposition.wordpress.com/category/inside-zone/); Mile High Report 'Zone vs Gap' (https://www.milehighreport.com/22451001/difference-between-zone-and-gap-scheme). Confirmed BANG/BEND/BOUNCE framework; B-gap aim point is Shanahan-tradition (other traditions use A-gap)."
flip_reads:
- flip_id: three-tech-callside
  pre_snap_look: The 3-technique tackle and the playside linebacker are both set to the called
    side, loading the front-side gaps the zone is aiming for.
  qb_key: Find the 3-technique — it is aligned to the called side, in the zone's path.
  read_category: dl-alignment
  flip_to: mirror-play
  why: Zone run into the 3-technique blocks the penetrator head-on; flipping the zone away runs
    at the lighter shade and a cleaner front-side double.
  typical_against:
  - over-front
  - shifted 4-3
- flip_id: strength-declared-to-formation
  pre_snap_look: Defense has declared to the formation's strength — an extra box defender to the
    strong side with a safety rolled down to support it.
  qb_key: Check the strength side — the box count and the safety roll are both committed to it.
  read_category: safety-shell
  flip_to: mirror-formation
  why: Flipping the whole formation re-locates the strength call; a defense slow to re-set leaves
    the front-side gaps the zone wants unfilled.
  typical_against:
  - cover-3 with strong roll
  - quarters with strong roll
