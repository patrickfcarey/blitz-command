play_id: i-formation-counter-trey
name: Counter Trey (Strong)
aliases:
  - Counter
  - Counter OF
  - Counter G/T

formation: i-formation
play_type: run
ball_carrier: HB
run_reads:
  - priority: 1
    read_key: kicking guard (LG) — kickout block on EDGE
    run_to: follow the pulling tackle (RT) through the C-gap once you see the LG kick the DE out
    notes: "LG kicks the EDGE, RT logs or wraps the linebacker. Hit the seam between those two blocks."
  - priority: 2
    read_key: playside linebacker (wrapping tackle's target)
    run_to: if the LB shoots the gap before the RT can wrap him, press the B-gap immediately inside
    notes: "Don't wait for the LB to be blocked — if he's shooting, bang it inside fast."
  - priority: 3
    read_key: backside pursuit
    run_to: if the frontside clogs, bounce all the way backside (counter action slowed pursuit)
    notes: "The counter misdirection buys time — backside DE is hand-off fake away. Use it if needed."

motions: []

assignments:
  - player: LT
    role: run_block
    blocking_scheme: pull-around
    target: edge-defender
    path: [[0, 0], [3, -0.5], [5, -0.5], [7, 2]]
    notes: "PULL — backside tackle pulls and kicks out the playside EDGE."
  - player: LG
    role: run_block
    blocking_scheme: pull-around
    target: playside-LB
    path: [[0, 0], [2, -0.5], [4, 0], [5, 4]]
    notes: "PULL — backside guard pulls around C, leads through the off-tackle hole onto the playside LB."
  - player: C
    role: run_block
    blocking_scheme: gap-block
    target: backside-A-gap
  - player: RG
    role: run_block
    blocking_scheme: down-block
    target: playside-3-tech
  - player: RT
    role: run_block
    blocking_scheme: down-block
    target: playside-DT
  - player: TE
    role: run_block
    blocking_scheme: down-block
    target: playside-LB
    notes: "TE down-blocks at the second level."
  - player: X
    role: run_block
    blocking_scheme: stalk
    target: cornerback
  - player: Z
    role: run_block
    blocking_scheme: stalk
    target: cornerback
  - player: QB
    role: handoff
    path: [[0, 0], [-1, -1], [-2, -1]]
    notes: "Reverse-out to HB; sell a fake bootleg to the backside (weak side)."
  - player: FB
    role: lead_block
    target: alley-defender
    path: [[0, 0], [3, 3], [4, 6]]
    notes: "FB leads through the playside hole; iso a free defender at the second level."
  - player: HB
    role: ball_carrier
    is_primary: true
    path: [[0, 0], [-1, 1], [3, 4], [4, 9]]
    alt_paths:
      - priority: secondary
        path: [[0, 0], [-1, 1], [1, 4], [2, 9]]
        notes: "Read 2: LB shoots the gap before RT wraps — press the B-gap immediately inside."
      - priority: tertiary
        path: [[0, 0], [-1, 1], [-3, 5], [-4, 9]]
        notes: "Read 3: frontside clogs — bounce all the way backside (counter action bought time)."
    notes: |
      Counter step LEFT first (sell run away from playside), then plant and run
      RIGHT through the off-tackle hole behind the pulling LG and LT.

strengths:
  - Two pulling blockers (BSG and BST) at the point of attack — a real numbers advantage
  - Counter step + reverse-out QB hold backside defenders aggressively
  - Devastating against defenses overplaying Power tendencies
  - Multiple lead blockers + double-team at the playside DT
  - One of the highest-yielding power-run plays in football history

weaknesses:
  - Slow-developing — pullers need ~2.5 sec to arrive
  - Vulnerable to playside DE penetration before pulling tackle gets there
  - HB must read the counter correctly OR the play breaks
  - Backside cutback shut down if counter step fools backside fitters

best_vs_defense:
  - over-front (gives down-block angles + gap to pull through)
  - cover-3 with predictable LB flow
  - any defense overplaying Power
  - speed-flow defenses that over-pursue the counter step

worst_vs_defense:
  - bear front (DT in every gap)
  - 8-man fronts
  - cover-1 robber (extra defender)
  - playside DE shooting upfield

defensive_counters:
  - counter_id: spill-the-puller
    pre_snap_look: "Playside EDGE in a tight 6/7-technique with his inside shoulder cocked down and a force defender (OLB or SS) cheated wide outside the TE"
    qb_key: "Scan the playside edge — EDGE hand and shoulder pointed inside, force defender widened"
    read_category: dl-alignment
    why: "An inside-cocked EDGE is set to wrong-arm the LT's kickout and spill the run wide into the pre-widened force defender, where the pullers have no angle."
    typical_against: ["over-front", "4-3 base", "any defense coached to spill power"]
  - counter_id: backside-chase
    pre_snap_look: "Backside DE in a wide-9 well outside the LT and the backside LB stacked square behind the line at normal depth, eyes inside on the guards"
    qb_key: "Check the backside edge — DE flared wide-9, backside LB squared and not honoring the QB"
    read_category: dl-alignment
    why: "A wide-9 backside DE and a square backside LB are aligned to chase flat down the line and ignore the counter step, killing the cutback and stacking the playside."
    typical_against: ["disciplined option-fit defenses", "any defense drilled against counter"]
  - counter_id: shoot-the-b-gap
    pre_snap_look: "Playside 3-technique crowding the ball, outside-eye of the guard, hand low and weight forward over the B-gap"
    qb_key: "Scan the interior DL shade — playside tackle in a tight, weight-forward 3-tech"
    read_category: dl-alignment
    why: "A 3-tech crowding the ball with weight forward is set to shoot the B-gap and beat the down-block, destroying the LG/LT pull path in the backfield."
    typical_against: ["over-front with aggressive 3-tech", "stunt-heavy 4-3"]

common_uses:
  - Counter to Power tendencies
  - 1st/2nd-and-medium with established run game
  - Short-yardage when defense overcommits
  - Setting up bootleg PA off the same look

philosophy: power-run
run_concept_ref: power
philosophy_ref: power-run

era: "1980s onward — Joe Gibbs Washington Redskins popularized; staple of pro-style power offenses ever since."

famous_examples:
  - "1980s Washington Redskins (Joe Gibbs / John Riggins)"
  - "Bill Parcells Giants / Patriots era power run game"
  - "Modern NFL teams using counter as a Power complement"
  - "HS power-run programs across the country"

tags:
