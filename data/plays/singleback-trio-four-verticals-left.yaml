strengths:
- Devastating vs single-high coverages (cover-1, cover-3)
- Multiple deep options — defense can't bracket all four
- Forces deep safety to choose; SLOT seam wins vs single-high
- Air Raid signature concept
- Big-play potential on every snap
weaknesses:
- Slow-developing — pass protection is critical
- Needs an accurate deep-ball QB
- Requires WR vs safety win for big play
- Vulnerable to cover-4 (every vertical bracketed)
- Won't beat a true zero blitz
best_vs_defense:
- cover-3 (the textbook beater — SLOT seam splits it)
- cover-1 (SLOT runs past a single-high FS)
- cover-1 robber (the robber can't carry both seams)
- cover-0 with a slow-developing rush
worst_vs_defense:
- cover-4 / quarters (every vertical has bracket help)
- cover-2 trap with smart safeties
- aggressive zero blitz with no time
- any defense playing pattern-match on verticals
common_uses:
- 3rd-and-long
- 2-minute drill
- Deep shot off a run-heavy series
- Setting up future window throws (defense backs off after a 4-Verts hit)
philosophy: air-raid
pass_concept_ref: four-verticals
philosophy_ref: air-raid
era: 1980s onward — Don Coryell origin, Mike Leach / Hal Mumme made it iconic in the Air Raid.
