notes: "Veer Option is the CLASSIC triple option from under center — Bill Yeoman's\n1965 invention at Houston that predated\
  \ the Wishbone (1968 at Texas) by\nthree years. From the I-Formation, the FB dives at the playside B-gap\nwith QB reading\
  \ the EDGE, then HB trails as the pitch back if QB pulls.\n\nDifferences from Wishbone:\n  - Veer: I-Form (FB at 4.5 yd,\
  \ HB at 7 yd directly behind FB)\n  - Wishbone: 3-back (FB at 4.5 yd, two HBs flanking at -3/+3 and -6 yd)\n  - Veer pitch\
  \ path is longer (HB is deeper)\n  - Wishbone has 2 pitch men (either direction); veer has 1\n\nMirror by flipping all x.\n"
verification_status: unverified
source_notes:
- Houston Veer / triple option — Bill Yeoman 1965 origin; documented across option-football coaching tradition.
- Built 2026-04-30 to round out the option family with the original under-center triple option.
- Mirror of i-formation-veer.yaml — path waypoints flipped on x; formation reference points to the mirror formation. Routes
  auto-mirror in the drawing tool based on receiver side. Narrative notes may still describe the original right-handed look
  — coordinates and paths are the source of truth.
flip_reads:
- flip_id: keys-set-callside
  pre_snap_look: The dive key and the pitch key (first two defenders outside the tackle) are both
    aligned hard and downhill to the called side.
  qb_key: Scan the called-side edge — both option keys are squatted and committed, no width left
    to read.
  read_category: dl-alignment
  flip_to: mirror-play
  why: An option into keys that are already set gives the QB no honest read; flipping the option
    attacks the side where the keys still have to choose.
  typical_against:
  - over-front
  - cover-1 with edge pressure
- flip_id: strength-declared-to-formation
  pre_snap_look: Defense has declared to the formation's strength — an extra perimeter defender
    and a safety rolled down to the strong side.
  qb_key: Check the strength side — the extra hat and the safety roll are committed to it.
  read_category: safety-shell
  flip_to: mirror-formation
  why: Flipping the formation moves the option away from the loaded perimeter and forces the defense
    to re-declare its keys.
  typical_against:
  - cover-3 with strong roll
  - 8-man fronts
