strengths:
- Original triple option from under center (predates wishbone by 3 years)
- Three ball-carrier threats from one snap
- FB dive grinds yards when defense honors pitch
- QB pitch sweep can break for big plays
- Forces defense to commit a defender to each option phase
- Misdirection built in — no pre-snap tell of which option fires
weaknesses:
- Slow-developing relative to modern spread-option
- QB takes hits as a runner — injury risk
- Modern fast defenses with disciplined option-fits neutralize triple
- Vulnerable to scrape-exchange (LB taking pitch while EDGE plays QB)
- FB is a 1-back — limited downhill power compared to wishbone double-back
- Pitch path is longer than wishbone (HB starts at 7 yd depth vs 6)
best_vs_defense:
- 4-3 with predictable EDGE play
- any defense unprepared for option football
- speed-flow defenses that over-pursue
- cover-3 with run-fit LBs
worst_vs_defense:
- disciplined option-fit defenses
- scrape-exchange from playside LB
- cover-1 robber (extra defender)
- 8-man fronts
common_uses:
- Heritage triple-option from a non-Wishbone formation
- 1st-and-10 base run vs 4-3 / 3-4 base defenses
- Setting up PA passes off the same look (Houston-era PA was lethal)
- Goal-line / red-zone (FB dive becomes the run)
philosophy: option
