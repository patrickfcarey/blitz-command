notes: |
  Play-action bootleg off the jet fake. The jet motion is IDENTICAL to Jet
  Sweep — SLOT-W motions full-speed and the ball is snapped on the move —
  and the QB's first two steps riding the jet mesh are identical to the Jet
  Sweep handoff. The QB then pulls it and boots weak-side away from the jet
  flow with a three-level read (X comeback / TE drag / HB checkdown), while
  SLOT-W and the HB run their Jet Sweep fakes. Member of the Shotgun 2x2
  Jet disguise family (see data/play-families/).

  The jet flow pulls the strong-side pursuit so the boot springs back into
  the vacated weak side. Mirror to jet-boot-left by motioning Z across and
  flipping all coordinates.

verification_status: unverified
source_notes:
  - "The bootleg off jet/fly-sweep motion is a universal modern constraint concept. Authored as a disguise twin of shotgun-2x2-jet-sweep — the jet motion block is byte-identical to the base play and the QB's first two path waypoints mirror the Jet Sweep handoff."
