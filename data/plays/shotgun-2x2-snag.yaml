play_id: shotgun-2x2-snag
name: Snag (Strong)
aliases:
  - Snag Concept
  - Triangle

formation: shotgun-2x2
play_type: pass
ball_carrier: QB
primary_read: TE
secondary_read: Z
checkdown: HB

motions: []

assignments:
  - player: LT
    role: pass_block
    blocking_scheme: man-protection
  - player: LG
    role: pass_block
    blocking_scheme: man-protection
  - player: C
    role: pass_block
    blocking_scheme: man-protection
  - player: RG
    role: pass_block
    blocking_scheme: man-protection
  - player: RT
    role: pass_block
    blocking_scheme: man-protection
  - player: TE
    role: route
    route_name: snag-or-mini-curl
    depth_yd: 5
    is_primary: true
    notes: "TE pushes 5 yds inside, then settles in the soft spot — the 'snag' (or mini-curl)."
  - player: X
    role: route
    route_name: comeback
    depth_yd: 14
    notes: "Backside comeback — opens late if strong-side covered."
  - player: SLOT-W
    role: route
    route_name: drag
    depth_yd: 5
    notes: "Backside drag, helps pull MIKE / underneath defender across."
  - player: Z
    role: route
    route_name: corner
    depth_yd: 12
    notes: "Strong-side corner route — the HI of the snag triangle."
  - player: QB
    role: ball_carrier
    path: [[0, 0], [0, -1], [0, -2]]
    notes: |
      3-step quick rhythm from shotgun depth. Triangle read on the strong side:
      TE snag (LO) / Z corner (HI) / HB flat (FLAT). Pre-snap leverage tells
      you which leg of the triangle is open.
  - player: HB
    role: route
    route_name: flat
    depth_yd: 3
    notes: "HB releases to the strong-side flat — completes the snag triangle (LO/HI/FLAT)."

strengths:
  - Triangle concept attacks all three zones (deep, flat, intermediate)
  - Always one open against any single coverage
  - Quick rhythm — 3-5 step drop, ball out fast
  - HB flat is the 'gimme' outlet — easy first down
  - Effective vs cover-2, cover-3, cover-1 — beats most coverages

weaknesses:
  - Bracket coverage on the snag receiver shuts down the primary
  - QB must read leverage pre-snap, decide quickly post-snap
  - Defenses with banjo coverage can match the triangle
  - Limited big-play potential (corner is only 12 yds)
  - Backside comeback is a slow developer

best_vs_defense:
  - cover-3 (snag sits in soft spot, corner over flat)
  - cover-2 (corner over flat defender, snag underneath)
  - cover-1 (snag opens vs trail, flat is uncovered)
  - any defense with predictable underneath spacing

worst_vs_defense:
  - bracket on TE / snag receiver
  - banjo coverage on slot / TE
  - cover-2 robber
  - aggressive blitz from snag-side LB

defensive_counters:
  - counter_id: trap-corner
    pre_snap_look: "Strong-side corner squatted at 5-7 yds depth (tighter than a normal cover-3 corner), with the strong safety widened toward the flat"
    qb_key: "Check the strong-side CB depth — squatted short, eyes inside"
    read_category: cb-leverage
    why: "A short, squatted corner is set to trap the HB flat instead of carrying the deep half, taking the easy LO outlet and leaving the safety to bracket the corner route over the top."
    typical_against: ["cover-2 trap", "cover-2 invert", "any cover-2 with disguised corner roll"]
  - counter_id: bracket-snag
    pre_snap_look: "MIKE walked out and cheated toward the TE, with a safety rolled down over the strong hash"
    qb_key: "Check the MIKE — walked out toward the TE with a safety capping him"
    read_category: lb-depth
    why: "A MIKE pre-set toward the TE with a safety over the top brackets the snag — the play's anchor — forcing the QB onto the slower comeback or the bracketed flat."
    typical_against: ["cover-1 robber", "match quarters", "pattern-match coverages"]
  - counter_id: snag-side-pressure
    pre_snap_look: "Strong-side LB / nickel walked up in a blitz alignment on the LOS, single-high safety shell behind"
    qb_key: "Scan the strong-side LB / nickel — walked up on the line, one high safety"
    read_category: lb-depth
    why: "A walked-up snag-side defender is a free runner; with the HB in protection he gets home before the triangle develops, forcing a checkdown or sack."
    typical_against: ["cover-1 zero-pressure", "fire-zone", "nickel pressure packages"]

common_uses:
  - 3rd-and-medium (4-7 yards)
  - 1st down rhythm play
  - Anti-blitz hot read
  - Red zone short-corner option

philosophy: pro-style
pass_concept_ref: snag
philosophy_ref: pro-style

era: "1990s onward — modern pro-style staple, originally Tom Moore / Peyton Manning era; ubiquitous now."

famous_examples:
  - "Peyton Manning Colts offense (Tom Moore tree)"
  - "Patriots 11-personnel snag concepts"
  - "Modern NFL widely (every team has a snag variant)"

tags:
