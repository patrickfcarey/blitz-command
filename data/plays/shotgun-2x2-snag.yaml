notes: |
  "Snag" = the inside-receiver settle route at 5 yards. Combined with a
  corner route and a flat release, the three routes form a triangle that
  stretches the strong-side coverage three ways at once. Mirror this
  concept to the weak side as needed.

verification_status: unverified
source_notes:
  - "Web validated 2026-04-29 — XsOs Football 'Shotgun Formation and Sets' (https://xsosfootball.com/shotgun-formation-sets/); BreakdownSports '2x2 Mirrored Concepts' (http://breakdownsports.blogspot.com/2015/02/football-fundamentals-2x2-and-mirrored-passing-concepts-route-combinations.html). Snag triangle with corner-over-flat + checkdown is standard pro-style staple, well-documented across coaching trees."
