strengths:
- 11-blocker advantage in the box (no QB to leave hanging back; QB-as-WR removes a defender if covered)
- Direct snap = no fake / handoff timing risk
- Power scheme angles work like under-center Power O
- Misdirection from RB2 and QB-as-WR holds backside
- Surprise factor in modern football — defenses rarely prepare for it
weaknesses:
- Defense knows it's a run (no credible passer at the snap)
- Vulnerable to defenses that bring a safety down (numbers neutralized)
- Limited counter / pass off the same look — telegraphs intent
- RB1 must be a credible runner with vision (not a typical QB skill)
- Modern defenses adjusted by 2010 — fewer big plays now
best_vs_defense:
- 4-3 with light box
- any defense not prepared for direct-snap sets
- cover-2 with squatting corners (no run support from corners)
worst_vs_defense:
- 4-3 with safety in the box
- cover-1 robber
- 4-6 / bear front
- prepared / film-studied defense
common_uses:
- Short-yardage / goal-line surprise package
- Tempo / look-changer in a modern offense
- 1st-and-10 vs an unprepared defense
- Setting up trick plays (Wildcat Pass)
philosophy: power-run
era: 'Modern resurgence: 2008 Miami Dolphins (Ronnie Brown). Concept dates to 1920s-1940s single-wing era.'
famous_examples:
- Ronnie Brown — 2008 Dolphins Wildcat Power, scored 4 rushing TDs vs Patriots Sept 21 2008
- Darren McFadden — 2006 Arkansas Wildcat package
- Modern NFL situational use (Jets, Bills, Eagles 2008-2014 era)
