name: High School Base Playbook
description: 'Power-run-oriented HS varsity base playbook. I-Formation is the spine

  (downhill run game with PA off the same look). Singleback gives a no-FB

  / quick-game complement. Shotgun provides QB run game, quick game, and

  spread answers. Goal Line and 3rd-and-Short are situational packages.


  Built around plays a HS line and HS QB can actually execute — no exotic

  RPO trees, no max-protection 7-step concepts. Most plays install in the

  first two weeks of camp.

  '
